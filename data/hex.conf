# dkde-hex settings.
[hex]
# Folder of Kaitai Struct .ksy files, for example a clone of
# https://github.com/kaitai-io/kaitai_struct_formats . When empty, dkde-hex
# looks in ~/.local/share/dkde/formats .
formats-dir=

# Folder of ImHex patterns: a clone of https://github.com/WerWolv/ImHex-Patterns
# (with patterns/ and includes/ inside). Empty: ~/.local/share/dkde/patterns .
patterns-dir=
