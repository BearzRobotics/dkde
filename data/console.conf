# System-wide settings for dkde-console, the text console that replaces agetty
# (SPEC.md 5.11). Copy to /etc/dkde/console.conf and change what you want; only
# the keys you set need to be there. `dkde-console config list` shows what is in
# effect and where each value comes from, and `dkde-console config set KEY VALUE`
# checks a value before writing it. Changes apply to running consoles at once,
# except `fallback`, which is read when a console starts.
#
# A [vt:N] group overrides keys for one virtual terminal, for example:
#   [vt:1]
#   font-size=32
[console]
# Path to a font file: a PSF font (PSF1 or PSF2, not gzipped) or a monospace
# TrueType font (.ttf). Empty: the built-in Terminus font. List what is on this
# system with `dkde-console config fonts`.
font=
# Font files (PSF or TrueType), separated by commas or spaces, for characters
# the main font lacks.
fallback-fonts=
# Height of a character cell in pixels. The built-in font comes in 16, 24 and 32;
# a TrueType font takes any size. 0 chooses from the screen's physical size,
# keeping at least 80x24 characters.
font-size=0
# 1, or 2 to double every pixel on very dense screens.
scale=1
# campbell, one-half-dark, solarized-dark or solarized-light
colors=campbell
# Lines kept for Shift+PageUp.
scrollback-lines=2000
# Blinking cursors blink only on the VT you are looking at. Off wakes the
# machine less.
cursor-blink=false
# What to run when the console cannot start (no display) or has crashed three
# times in a row. %N is the VT number.
fallback=/sbin/agetty --noclear tty%N linux
# How much the console writes to standard error, where the init system collects
# it: error, warn, info or debug. info says what was set up (display, font,
# input devices, login) and every problem; debug adds each VT switch and each
# step behind it. Applies at once.
log-level=info
# Megabytes of image data per console (kitty graphics; not yet used).
image-memory=32
