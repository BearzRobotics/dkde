id = "VIII.19"
book = 8
order = 19
title = "Between two similar solid numbers"
statement = "Between two similar solid numbers there fall two mean proportional numbers; and the solid number has to the similar solid number the ratio triplicate of that which the corresponding side has to the corresponding side."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let A, B be two similar solid numbers, with sides C, D, E of A and F, G, H of B, so that C is to F as D is to G and as E is to H (here 2, 2, 2 and 3, 3, 3). I say that two mean proportional numbers fall between A, B and A has to B the ratio triplicate of that which C has to F."
