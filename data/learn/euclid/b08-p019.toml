[[step]]
text = "A is C·D·E and B is F·G·H. Let the two means be X = C·D·H and Y = C·G·H. Then A to X is E to H (VII.17), X to Y is D to G, and Y to B is C to F; and these three ratios are the same, since the sides are proportional. So A, X, Y, B are in continued proportion (here 8, 12, 18, 27), and A has to B the ratio triplicate of that which C has to F (V definition 10)."
