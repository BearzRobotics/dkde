title = "The square on the minor straight line"
statement = "The square on the minor straight line, if applied to a rational straight line, produces as breadth the fourth apotome."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB be the minor straight line with the annex BC, and let a rational straight line DE be set out. Apply to DE the rectangle DF equal to the square on AB, producing DG as breadth. I say that DG is the fourth apotome. Example: (1.848 less 0.765) squared is 4 less 2 times the square root of 2 (terms 4.000 and 2.828, the remainder 1.172)."
