[[step]]
text = "Let AB, BC, CA, AD, DB, DC be bisected at the points E, F, G, H, K, L, and let HE, EG, GH, HK, KL, LH, KF, FG be joined. Since AE is equal to EB, and AH to DH, EH is parallel to DB (VI.2). For the same reason HK is parallel to AB. Therefore HEBK is a parallelogram, so HK is equal to EB. But EB is equal to AE. Therefore AE is also equal to HK. But AH is also equal to HD. Therefore the two sides EA, AH are equal to the two sides KH, HD respectively, and the angle EAH is equal to the angle KHD. Therefore the base EH is equal to the base KD, and the triangle AEH is equal and similar to the triangle HKD. For the same reason the triangle AHG is also equal and similar to the triangle HLD. Since two straight lines meeting one another, EH, HG, are parallel to two straight lines meeting one another, KD, DL, not in the same plane, they will contain equal angles (XI.10). Therefore the angle EHG is equal to the angle KDL. And since the two straight lines EH, HG are equal to the two KD, DL respectively, the base EG is equal to the base KL, and the triangle EHG is equal and similar to the triangle KDL. Therefore the pyramid of which the triangle AEG is the base and the point H the vertex is equal and similar to the pyramid of which the triangle HKL is the base and the point D the vertex. And since HK has been drawn parallel to AB, one of the sides of the triangle ADB, the triangle ADB is equiangular with the triangle DHK, and they have their sides proportional. Therefore the triangle ADB is similar to the triangle DHK. For the same reason the triangle DBC is similar to the triangle DKL, and ADC to DHL, and ABC to AEG. Now the triangle HKL is similar to the triangle AEG, for the sides of the former are parallel to the sides of the latter. Therefore the pyramid of which the triangle ABC is the base and the point D the vertex is similar to the pyramid of which the triangle AEG is the base and the point H the vertex."
