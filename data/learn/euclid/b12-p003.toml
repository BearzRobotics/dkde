[[step]]
text = "Now the pyramid of which the triangle HKL is the base and the point D the vertex was proved similar to the pyramid of which the triangle AEG is the base and the point H the vertex; and these are similar to the whole. Next, since BF is equal to FC, the parallelogram EBFG is double of the triangle GFC (I.41). Since the triangles GFC, HKL are equal and similar, and the prism of which the parallelogram EBFG is the base and the straight line HK its opposite is equal to the prism of which the triangle GFC is the base and the triangle HKL its opposite (XI.39), the two prisms are equal to one another. And the pyramids of which the triangles AEG, HKL are the bases and the points H, D the vertices are equal. Therefore the whole pyramid ABCD is divided into two pyramids equal to one another and similar to the whole, and into two equal prisms. And since the prisms are greater than the two pyramids (the prism with the base BKFL... is greater than the pyramid with the same base and height, as the pyramid is a third of the prism), the two prisms are greater than half the whole pyramid."
