id = "XII.3"
book = 12
order = 3
title = "Dividing a pyramid"
statement = "Any pyramid which has a triangular base is divided into two pyramids equal and similar to one another and similar to the whole and having triangular bases, and into two equal prisms; and the two prisms are greater than half of the whole pyramid."
proof = "Therefore any pyramid which has a triangular base is divided into two pyramids equal and similar to one another and similar to the whole and having triangular bases, and into two equal prisms; and the two prisms are greater than half of the whole pyramid. Q.E.D."

[[step]]
text = "Let there be a pyramid of which the base is the triangle ABC and the vertex the point D. I say that the pyramid ABCD is divided into two pyramids equal to one another, having triangular bases and similar to the whole pyramid, and into two equal prisms; and the two prisms are greater than half of the whole pyramid."
