id = "IX.22"
book = 9
order = 22
title = "An even number of odd numbers"
statement = "If as many odd numbers as we please be added together, and their multitude be even, the whole will be even."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "For let as many odd numbers as we please, AB, BC, CD, DE, even in multitude, be added together (3, 5, 7, 9). I say that the whole AE is even (24)."
