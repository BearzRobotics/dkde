[[step]]
text = "Since each of the numbers AB, BC, CD, DE is odd, if a unit be subtracted from each, each of the remainders will be even (VII definition 7). So that the sum of them will be even (IX.21). But the multitude of the units is even. Therefore the whole AE is even."
