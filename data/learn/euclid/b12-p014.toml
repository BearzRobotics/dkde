[[step]]
text = "For let the axis KL be produced to the point N, let LN be made equal to the axis GH, and about LN as axis let the cylinder CM be described. Since the cylinders EB, CM have the same height, they are to one another as their bases (XII.11). But the bases AB, CD are equal. Therefore the cylinders EB, CM are also equal. And since the cylinder FM has been cut by the plane CD which is parallel to its opposite planes, as the cylinder CM is to the cylinder FD, so is the axis LN to the axis KL (XII.13). But the cylinder CM is equal to the cylinder EB, and the axis LN to the axis GH. Therefore, as the cylinder EB is to the cylinder FD, so is the axis GH to the axis KL. But, as the cylinder EB is to the cylinder FD, so is the cone ABG to the cone CDK, since the cylinders are triple of the cones (XII.10). Therefore also, as the axis GH is to the axis KL, so is the cone ABG to the cone CDK and the cylinder EB to the cylinder FD."
