id = "XII.14"
book = 12
order = 14
title = "Cones and cylinders on equal bases"
statement = "Cones and cylinders which are on equal bases are to one another as their heights."
proof = "Therefore cones and cylinders which are on equal bases are to one another as their heights. Q.E.D."

[[step]]
text = "Let EB, FD be cylinders on equal bases, namely the circles AB, CD. I say that, as the cylinder EB is to the cylinder FD, so is the axis GH to the axis KL."
