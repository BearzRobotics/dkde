id = "IV.13"
book = 4
order = 13
title = "Inscribe a circle in a pentagon"
statement = "In a given pentagon, which is equilateral and equiangular, to inscribe a circle."
proof = "Therefore in the given pentagon the circle has been inscribed. Being what it was required to do."

[[step]]
text = "Let ABCDE be the given equilateral and equiangular pentagon. It is required to inscribe a circle in the pentagon ABCDE. Let the angles BCD, CDE be bisected by the straight lines CF, DF (I.9), and let them meet at the point F."
