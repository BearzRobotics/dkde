title = "Rectangle of two medial lines commensurable in square only"
statement = "A rectangle contained by medial straight lines commensurable in square only is either rational or medial."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "For let the rectangle AC be contained by medial straight lines AB, BC commensurable in square only (here the fourth root of 2 and its cube-like partner, the fourth root of 8; their rectangle is the rational area 2). I say that the rectangle AC is either rational or medial."
