[[step]]
text = "Describe on AB, BC the squares AD, BE. Each is medial. Set out a rational straight line FG, and apply to FG the rectangle GH equal to AD, producing FH as breadth, and to HM the rectangle MK equal to the rectangle AC, producing HK, and then NO equal to BE. Then FH, HK, KL are rational and incommensurable with FG... Since AD, BE are commensurable (the lines are commensurable in square), FH is commensurable in length with KL. And since AD, AC, BE are in the ratio of AB, BC, FH, HK, KL are in continued proportion: HK is a mean proportional between FH, KL. So the rectangle FH, KL is equal to the square on HK. Now either FH, KL are commensurable in length or not; if they are, HK is commensurable with them and rational, so the rectangle AC is rational; if not, HK is medial and so is the rectangle AC. In the example the first case occurs: the rectangle is 2."
