[[step]]
text = "Since the triangle CGF is equal to the triangle CFB, and ADE to DEH (I.34), and the parallelogram CA is equal to the parallelogram EB, for they are opposite (XI.24), and GE is equal to CH, therefore the prism contained by the two triangles CGF, ADE and the three parallelograms GE, AC, CE is equal to the prism contained by the two triangles CFB, DEH and the three parallelograms CH, BE, CE. For they are contained by planes equal in multitude and in magnitude, and similarly situated. Therefore the solid AB is bisected by the plane CDEF."
