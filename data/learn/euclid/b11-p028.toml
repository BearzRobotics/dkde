id = "XI.28"
book = 11
order = 28
title = "A diagonal plane bisects the solid"
statement = "If a parallelepipedal solid be cut by a plane through the diagonals of two of the opposite planes, the solid will be bisected by the plane."
proof = "Therefore if a parallelepipedal solid be cut by a plane through the diagonals of two of the opposite planes, the solid will be bisected by the plane. Q.E.D."

[[step]]
text = "For let the parallelepipedal solid AB be cut by the plane CDEF through the diagonals CF, DE of two opposite planes. I say that the solid AB will be bisected by the plane CDEF."
