id = "IX.13"
book = 9
order = 13
title = "A prime after the unit"
statement = "If as many numbers as we please beginning from an unit be in continued proportion, and the number after the unit be prime, the greatest will not be measured by any except those which have a place among the proportional numbers."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let there be as many numbers as we please beginning from the unit A in continued proportion, B, C, D (here 1, 3, 9, 27), and let B, the number after the unit, be prime. I say that the greatest, D, will not be measured by any number except A, B, C."
