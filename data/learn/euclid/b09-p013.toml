[[step]]
text = "If possible, let D be measured by a number E which is none of A, B, C. If E is prime, it measures D and so it measures B (IX.12); but B is prime, so E would be B, contrary to the supposition. So E is composite, and is measured by some prime F (VII.31). F measures D, so F measures B (IX.12), and as B is prime, F is B. So B measures E: let E be B times G. Then, as E measures D, G also measures D. And G is none of A, B, C: if G were one of them, then E = B times G would be one of the series (the product of two terms of the series is a term, IX.11). Thus G is again a number measuring D which is not in the series, and G is less than E."
draw = [
]

[[step]]
text = "Repeating the argument with G in place of E, we find a still smaller number of the same kind; and so on without end. But a descending sequence of numbers cannot go on for ever. This is impossible. Therefore D is not measured by any number except A, B, C."
