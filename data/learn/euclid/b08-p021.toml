id = "VIII.21"
book = 8
order = 21
title = "Two means: similar solid numbers"
statement = "If two mean proportional numbers fall between two numbers, the numbers are similar solid numbers."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "For let two mean proportional numbers C, D fall between the two numbers A, B (here 8, 12, 18, 27). I say that A, B are similar solid numbers."
draw = [
  "clear",
  "point A 0 0",
  "point a 2.8 0",
  "segment A a blue",
  "point B 0 -0.9",
  "point b 9.45 -0.9",
  "segment B b red",
  "point C 0 -1.8",
  "point c 4.2 -1.8",
  "segment C c green",
  "point D 0 -2.7",
  "point d 6.3 -2.7",
  "segment D d orange",
]

[[step]]
text = "Take the least four numbers in the ratio of A, C, D, B. They are the cubes and products of the least numbers E, F in that ratio: E·E·E, E·E·F, E·F·F, F·F·F (VIII.2). The least numbers measure the others equally, so A = G·E·E·E and B = G·F·F·F for the same multiplier G."
draw = [
]

[[step]]
text = "Therefore A is the solid number with sides E, E, G·E, and B is the solid number with sides F, F, G·F. These sides are proportional (E : F = E : F = G·E : G·F), so A, B are similar solid numbers."
