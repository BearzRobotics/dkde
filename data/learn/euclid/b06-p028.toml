id = "VI.28"
book = 6
order = 28
title = "Application deficient by a similar figure"
statement = "To a given straight line to apply a parallelogram equal to a given rectilineal figure and deficient by a parallelogrammic figure similar to a given one: thus the given rectilineal figure must not be greater than the parallelogram described on the half of the straight line and similar to the defect."
proof = "Therefore to the given straight line AB there has been applied the parallelogram AP equal to the given rectilineal figure C and deficient by the parallelogrammic figure PB similar to D. Being what it was required to do."

[[step]]
text = "Let AB be the given straight line, C the given rectilineal figure to which the parallelogram to be applied to AB is to be equal, not being greater than the parallelogram described on the half of AB and similar to the defect, and D the parallelogram to which the defect is to be similar. It is required to apply to the given straight line AB a parallelogram equal to the given rectilineal figure C and deficient by a parallelogrammic figure similar to D."
