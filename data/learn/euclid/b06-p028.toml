[[step]]
text = "Let AB be bisected at the point E, and on EB let the parallelogram EBFG be described similar and similarly situated to D (VI.18), and let the parallelogram AG be completed. If AG is equal to C, that which was prescribed is done. If not, let HE be greater than C. But HE is equal to GB. Therefore GB is also greater than C. Let KLMN be constructed at once similar and similarly situated to D and equal to the excess by which GB exceeds C (VI.25). But D is similar to GB. Therefore KM is also similar to GB. Let KL correspond to GE and LM to GF."
draw = [
]

[[step]]
text = "Since GB is equal to C and KM, GB is greater than KM. Therefore GE is greater than KL and GF than LM. Let GO be made equal to KL and GP equal to LM, and let the parallelogram OGPQ be completed. Then GQ is equal and similar to KM. But KM is similar to GB. Therefore GQ is also similar to GB. Therefore GQ is about the same diameter with GB (VI.26). Let GQB be their diameter, and let the figure be described. Since BG is equal to C and KM, and in these GQ is equal to KM, the remaining gnomon UWV is equal to the remaining C. And since PR is equal to OS, add QB to each. Then the whole PB is equal to the whole OB. But OB is equal to TE, since AE is equal to EB. Therefore TE is also equal to PB. Add OS to each. Then the whole TS is equal to the gnomon VWU. But the gnomon VWU was proved equal to C. Therefore TS is also equal to C. Therefore to the given straight line AB there has been applied the parallelogram ST equal to the given rectilineal figure C and deficient by a parallelogrammic figure QB similar to D."
