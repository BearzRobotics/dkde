id = "XI.14"
book = 11
order = 14
title = "Planes with the same perpendicular"
statement = "Planes to which the same straight line is at right angles will be parallel."
proof = "Therefore planes to which the same straight line is at right angles will be parallel. Q.E.D."

[[step]]
text = "Let any straight line AB be at right angles to each of the planes CD, EF. I say that the planes are parallel."
