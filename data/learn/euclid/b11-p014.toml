[[step]]
text = "For, if not, they will meet when produced. Let them meet; they will make a straight line as common section (XI.3). Let it be GH, and let any point K be taken at random on GH, and let AK, BK be joined. Since AB is at right angles to the plane EF, AB is also at right angles to BK, which is a straight line in the plane EF produced. Therefore the angle ABK is right. For the same reason the angle BAK is also right. Thus in the triangle ABK the two angles ABK, BAK are equal to two right angles, which is impossible (I.17). Therefore the planes CD, EF do not meet when produced. Therefore the planes CD, EF are parallel."
