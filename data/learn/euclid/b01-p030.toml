id = "I.30"
book = 1
order = 31
title = "Parallel to the same line"
statement = "Straight lines parallel to the same straight line are also parallel to one another."
proof = "Therefore straight lines parallel to the same straight line are also parallel to one another. Q.E.D."

[[step]]
text = "Let each of the straight lines AB, CD be parallel to EF. I say that AB is also parallel to CD."
draw = [
  "clear",
  "point A -5 3",
  "point B 5 3",
  "point E -5 0",
  "point F 5 0",
  "point C -5 -3",
  "point D 5 -3",
  "segment A B blue",
  "segment E F red",
  "segment C D blue",
]

[[step]]
text = "Let the straight line GK fall upon them, meeting AB at G, EF at H, and CD at K."
draw = [
  "point G -1 3",
  "point H 0 0",
  "point K 1 -3",
  "line G K black",
]

[[step]]
text = "Since the straight line GK has fallen on the parallel straight lines AB, EF, the angle AGK is equal to the angle GHF (I.29). Again, since GK has fallen on the parallel straight lines EF, CD, the angle GHF is equal to the angle GKD."
draw = [
  "angle A G K orange fill",
  "angle G H F orange fill",
  "angle G H F green fill",
  "angle G K D green fill",
]

[[step]]
text = "But the angle AGK was also proved equal to the angle GHF. Therefore the angle AGK is also equal to the angle GKD, and they are alternate. Therefore AB is parallel to CD (I.27)."
draw = [
]
