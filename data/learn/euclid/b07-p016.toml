  "point ba 7.5 -2.7",
  "segment BA ba orange",
]

[[step]]
text = "Since A by multiplying B has made C, B measures C according to the units in A. But the unit E also measures the number A according to the units in it. Therefore the unit E measures A the same number of times that B measures C. Therefore, alternately, the unit E measures the number B the same number of times that A measures C (VII.15). Again, since B by multiplying A has made D, A measures D according to the units in B. But the unit E measures B according to the units in it. Therefore the unit E measures B the same number of times that A measures D. But the unit E measured B the same number of times that A measures C. Therefore A measures each of the numbers C, D the same number of times. Therefore C is equal to D."
