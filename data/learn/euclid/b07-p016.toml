id = "VII.16"
book = 7
order = 16
title = "Multiplication is commutative"
statement = "If two numbers by multiplying one another make certain numbers, the numbers so produced will be equal to one another."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let A, B be two numbers, and let A by multiplying B make C, and B by multiplying A make D. I say that C is equal to D. (Here 3 times 5 and 5 times 3 are both 15.)"
draw = [
  "clear",
