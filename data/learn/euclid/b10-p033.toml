id = "X.33"
book = 10
order = 33
title = "Two lines: rational sum of squares, medial rectangle"
statement = "To find two straight lines incommensurable in square which make the sum of the squares on them rational but the rectangle contained by them medial."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let there be set out two rational straight lines AB, BC commensurable in square only, such that the square on AB is greater than the square on BC by the square on a straight line incommensurable with AB (X.30; here AB = 2, BC = the square root of 2). Let BC be bisected at D, apply to AB a parallelogram equal to the square on BD and deficient by a square, namely the rectangle AE, EB, and describe on AB the semicircle AFB; draw EF at right angles to AB and join AF, FB. I say that AF, FB are incommensurable in square, and make the sum of their squares rational and the rectangle contained by them medial."
