[[step]]
text = "Since AB is incommensurable in length with BC (the square on AB exceeds that on BC by a square on a line incommensurable with AB), AE is incommensurable with EB (X.18). Since, as AE is to EB, so is the rectangle BA, AE to the rectangle AB, BE, and these are equal to the squares on AF, FB (VI.8 corollary), the squares on AF, FB are incommensurable; so AF, FB are incommensurable in square. The sum of the squares on AF, FB is the square on AB (I.47), which is rational. The rectangle AF, FB equals the rectangle AB, EF (equal areas, I.35 and similar triangles), and EF is a mean proportional between AE, EB, so that the rectangle AB, EF is medial, since it is contained by the rational AB and EF, which is incommensurable in length with it. Therefore the rectangle AF, FB is medial."
