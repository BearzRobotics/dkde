id = "V.21"
book = 5
order = 21
title = "Perturbed proportion: three magnitudes"
statement = "If there be three magnitudes, and others equal to them in multitude, which taken two and two together are in the same ratio, and the proportion of them be perturbed, then, if ex aequali the first magnitude is greater than the third, the fourth will also be greater than the sixth; if equal, equal; and if less, less."
proof = "Therefore if there be three magnitudes, and others equal to them in multitude, which taken two and two together are in the same ratio, and the proportion of them be perturbed, then, if ex aequali the first magnitude is greater than the third, the fourth will also be greater than the sixth; if equal, equal; and if less, less. Q.E.D."

[[step]]
text = "Let there be three magnitudes A, B, C, and others D, E, F equal to them in multitude, which taken two and two together are in the same ratio, and let their proportion be perturbed, so that A:B = E:F and B:C = D:E, and let A be greater than C ex aequali. I say that D will also be greater than F."
