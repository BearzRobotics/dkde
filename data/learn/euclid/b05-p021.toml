[[step]]
text = "Since A is greater than C, and B is some other magnitude, A has to B a greater ratio than C has to B (V.8). But A:B = E:F, and, inversely, C:B = E:D. Therefore E has to F a greater ratio than E has to D (V.13). But that to which the same has a greater ratio is less (V.10). Therefore F is less than D. Therefore D is greater than F."
draw = [
]

[[step]]
text = "Similarly we can prove that if A is equal to C, D is equal to F; and if A is less than C, D is less than F."
