[[step]]
text = "Set out a rational straight line EF and apply to it the rectangle FG equal to AB and HI equal to CD. Then EH is rational and commensurable with EF, and HK is rational and incommensurable with it (X.20, X.22). So EH is incommensurable with HK, and EH, HK are rational straight lines commensurable in square only; so EK is a binomial (X.36). Divide EK at L so that the rectangle... The greater term EH or HK may exceed the less by a square on a line commensurable or incommensurable with it: four cases arise. If the greater is EH and the excess is commensurable with it, EK is the first binomial, so its area's side is a binomial (X.54). If the greater is HK, the lesser EH commensurable with EF and the excess commensurable, EK is a second binomial and the side is a first bimedial (X.55). If the greater is EH and the excess is incommensurable, EK is a fourth binomial and the side is a major line (X.57). If the greater is HK and the excess is incommensurable, EK is a fifth binomial and the side is the side of a rational plus a medial area (X.58). Therefore the side is one of the four irrational lines."
