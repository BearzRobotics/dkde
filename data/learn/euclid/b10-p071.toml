order = 71
title = "A rational and a medial area added"
statement = "If a rational and a medial area be added together, four irrational straight lines arise as the side of the area so composed, namely either a binomial or a first bimedial or a major or a side of a rational plus a medial area."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB be a rational area and CD a medial area, and let them be added together (here 4 and the square root of 3 square units, drawn as the lengths of the areas). I say that the side of the area AD is either a binomial or a first bimedial or a major or a side of a rational plus a medial area."
