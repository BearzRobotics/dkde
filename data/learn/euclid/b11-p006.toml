[[step]]
text = "For let them meet the plane of reference at the points B, D, let the straight line BD be joined, let DE be drawn in the plane of reference at right angles to BD, let DE be made equal to AB, and let BE, AE, AD be joined."
draw = [
  "point E 1.2 -3 0",
  "segment B D blue",
  "segment D E green",
  "segment B E black",
  "segment A E black",
  "segment A D black",
]

[[step]]
text = "Since AB is at right angles to the plane of reference, it will also make right angles with all the straight lines which meet it and are in the plane, so each of the angles ABD, ABE is right. For the same reason each of the angles CDB, CDE is right. Since AB is equal to DE, and BD is common, the two sides AB, BD are equal to the two sides ED, DB, and they contain right angles; therefore the base AD is equal to the base BE. Again, since AB is equal to DE, and BE to AD, the two sides AB, BE are equal to DE, AD, and AE is common; therefore the angle ABE is equal to the angle EDA. But ABE is right. Therefore EDA is also right. Therefore ED is at right angles to DA. But it is also at right angles to each of BD, DC. Therefore ED is set up at right angles to the three straight lines BD, DA, DC at their point of meeting. Therefore the three straight lines BD, DA, DC are in one plane (XI.5). But in whatever plane DB, DA are, in that plane is AB also. Therefore AB, BD, DC are in one plane. And each of the angles ABD, BDC is right. Therefore AB is parallel to CD (I.28)."
