id = "XI.6"
book = 11
order = 6
title = "Two perpendiculars to a plane are parallel"
statement = "If two straight lines be at right angles to the same plane, the straight lines will be parallel."
proof = "Therefore if two straight lines be at right angles to the same plane, the straight lines will be parallel. Q.E.D."

[[step]]
text = "For let the two straight lines AB, CD be at right angles to the plane of reference. I say that AB is parallel to CD."
