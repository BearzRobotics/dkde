id = "V.23"
book = 5
order = 23
title = "Perturbed ex aequali"
statement = "If there be three magnitudes, and others which are equal to them in multitude, which taken two and two together are in the same ratio, and the proportion of them be perturbed, they will also be in the same ratio ex aequali."
proof = "Therefore if there be three magnitudes, and others which are equal to them in multitude, which taken two and two together are in the same ratio, and the proportion of them be perturbed, they will also be in the same ratio ex aequali. Q.E.D."

[[step]]
text = "Let there be three magnitudes A, B, C, and others D, E, F equal to them in multitude, which taken two and two together are in the same ratio, and let their proportion be perturbed, so that A:B = E:F and B:C = D:E. I say that A:C = D:F."
