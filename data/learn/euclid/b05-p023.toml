[[step]]
text = "Take equimultiples G, H, K of A, B, D, and other equimultiples L, M, N of C, E, F. Since G, H are equimultiples of A, B, and parts have the same ratio as their equimultiples, A:B = G:H. For the same reason E:F = M:N. But A:B = E:F. Therefore G:H = M:N. Again, since B:C = D:E, and H, K are equimultiples of B, D, and L, M of C, E, H:L = K:M."
