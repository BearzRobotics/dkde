[[step]]
text = "Since there are three magnitudes G, H, L and others K, M, N equal to them in multitude which taken two and two are in the same ratio, and the proportion of them is perturbed, then, if G exceeds L ex aequali, K exceeds N; if equal, equal; if less, less (V.21). And G, K are equimultiples of A, D, and L, N of C, F. Therefore A:C = D:F."
