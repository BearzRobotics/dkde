id = "Definitions III"
book = 0
order = 4
title = "Definitions (Book III)"
statement = "The eleven definitions of Book III, on circles."

[[step]]
text = "1. Equal circles are those the diameters of which are equal, or the radii of which are equal."
draw = [
  "clear",
  "point A -3 0",
  "point B -1 0",
  "point C 3 0",
  "point D 5 0",
  "circle A B blue",
  "circle C D blue",
]

[[step]]
text = "2. A straight line is said to touch a circle which, meeting the circle and being produced, does not cut the circle."
draw = [
  "clear",
  "point O 0 0",
  "point A 3 0",
  "circle O A blue",
  "point P 3 -3",
  "point Q 3 3",
  "line P Q red",
]

[[step]]
text = "3. Circles are said to touch one another which, meeting one another, do not cut one another."
draw = [
  "clear",
  "point A -2 0",
  "point T 0 0",
  "point B 2.5 0",
  "point C 4 0",
  "circle A T blue",
  "circle B T red",
]

[[step]]
text = "4. In a circle straight lines are said to be equally distant from the centre when the perpendiculars drawn to them from the centre are equal. 5. And that straight line is said to be at a greater distance on which the greater perpendicular falls."
draw = [
  "clear",
  "point O 0 0",
  "point A -3 1.5",
  "point B 3 1.5",
  "point C -3.5 -2",
  "point D 3.5 -2",
  "circle O A blue",
  "segment A B red",
  "segment C D green",
  "point E 0 1.5",
  "point F 0 -2",
  "segment O E black",
  "segment O F black",
]

[[step]]
text = "6. A segment of a circle is the figure contained by a straight line and a circumference of a circle. 7. An angle of a segment is that contained by a straight line and a circumference of a circle."
draw = [
  "clear",
  "point O 0 0",
  "point A -3 1.5",
  "point B 3 1.5",
  "point T 0 3",
  "circle O A blue",
  "segment A B red",
  "polygon A B T teal",
]

[[step]]
text = "8. An angle in a segment is the angle which, when a point is taken on the circumference of the segment and straight lines are joined from it to the extremities of the straight line which is the base of the segment, is contained by the straight lines so joined. 9. And when the straight lines containing the angle cut off a circumference, the angle is said to stand upon that circumference."
draw = [
  "clear",
  "point O 0 0",
  "point A -3 1.5",
  "point B 3 1.5",
  "point C 0 3",
  "circle O A blue",
  "segment A B green",
  "segment A C red",
  "segment C B red",
  "angle A C B red fill",
]

[[step]]
text = "10. A sector of a circle is the figure which, when an angle is constructed at the centre of the circle, is contained by the straight lines containing the angle and the circumference cut off by them."
draw = [
  "clear",
  "point O 0 0",
  "point A 3 0",
  "point B 1.5 2.6",
  "circle O A blue",
  "segment O A red",
  "segment O B red",
  "angle A O B green fill",
]

[[step]]
text = "11. Similar segments of circles are those which admit equal angles, or in which the angles are equal to one another."
draw = [
  "clear",
  "point A -5 0",
  "point B -1 0",
  "point C -3 1.8",
  "point D 1 0",
  "point E 5 0",
  "point F 3 1.8",
  "segment A B blue",
  "segment D E blue",
  "polygon A B C teal",
  "polygon D E F teal",
]
