[[step]]
text = "Let the axis EF be produced in both directions to the points L, M, and let any number of axes EN, NL be made equal to the axis EK, and any number FO, OM equal to KF, and let the planes through L, N, O, M be parallel to AB, CD. Then the sections made are circles equal to the circles AB, CD. Then since the axes LN, NE, EK are equal to one another, the cylinders QN, NB, BG are to one another as their bases (XII.11). But the bases are equal. Therefore the cylinders QN, NB, BG are also equal to one another. Since the axes LN, NE, EK are equal to one another, and the cylinders QN, NB, BG are also equal to one another, and the multitude of the former is equal to the multitude of the latter, therefore, whatever multiple the axis KL is of the axis EK, that multiple also is the cylinder QG of the cylinder GB. For the same reason, whatever multiple the axis MK is of the axis KF, that multiple also is the cylinder PG of the cylinder GD. And if the axis KL is equal to the axis KM, the cylinder QG is also equal to the cylinder GP; if the axis exceeds the axis, the cylinder exceeds the cylinder; and if less, less. Therefore, there being four magnitudes, the two axes EK, KF and the two cylinders BG, GD, equimultiples have been taken of the axis EK and the cylinder BG, namely the axis LK and the cylinder QG, and of the axis KF and the cylinder GD, namely the axis KM and the cylinder GP; and it has been proved that, if the axis KL exceeds the axis KM, the cylinder QG exceeds the cylinder GP; if equal, equal; and if less, less. Therefore, as the axis EK is to the axis KF, so is the cylinder BG to the cylinder GD (V, definition 5)."
