id = "XII.13"
book = 12
order = 13
title = "A cylinder cut by a parallel plane"
statement = "If a cylinder be cut by a plane which is parallel to the opposite planes, then, as the cylinder is to the cylinder, so will the axis be to the axis."
proof = "Therefore, as the cylinder AD is to the cylinder EC, so is the axis FG to the axis GH. Q.E.D."

[[step]]
text = "For let the cylinder AD be cut by the plane GH which is parallel to the opposite planes AB, CD, and let the plane GH meet the axis at the point K. I say that, as the cylinder BG is to the cylinder GD, so is the axis EK to the axis KF."
