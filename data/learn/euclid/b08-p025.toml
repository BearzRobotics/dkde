id = "VIII.25"
book = 8
order = 25
title = "Ratio of cubes: first cube"
statement = "If two numbers have to one another the ratio which a cube number has to a cube number, and the first be a cube, the second will also be a cube."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "For let two numbers A, B have to one another the ratio which the cube number C has to the cube number D, and let A be a cube. I say that B is also a cube."
draw = [
  "clear",
  "point A 0 0",
  "point a 2.8 0",
  "segment A a blue",
  "point B 0 -0.9",
  "point b 9.45 -0.9",
  "segment B b red",
  "point C 0 -1.8",
  "point c 22.4 -1.8",
  "segment C c green",
  "point D 0 -2.7",
  "point d 75.6 -2.7",
  "segment D d orange",
]

[[step]]
text = "Since C, D are cubes, C, D are similar solid numbers. Therefore two mean proportional numbers fall between C, D (VIII.19). And as C is to D, so is A to B. Therefore two mean proportional numbers fall between A, B also (VIII.8). But A is a cube. Therefore B is also a cube (VIII.23)."
