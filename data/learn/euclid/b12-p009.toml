[[step]]
text = "Complete the parallelepipedal solids BGML, EHQP. Since the pyramid ABCG is equal to the pyramid DEFH, and the solid BGML is six times the pyramid ABCG, and the solid EHQP is six times the pyramid DEFH, the solid BGML is equal to the solid EHQP. But in equal parallelepipedal solids the bases are reciprocally proportional to the heights (XI.34). Therefore, as the base BM is to the base EQ, so is the height of the solid EHQP to the height of the solid BGML. But, as the base BM is to the base EQ, so is the triangle ABC to the triangle DEF. Therefore, as the triangle ABC is to the triangle DEF, so is the height of the solid EHQP to the height of the solid BGML. But the height of the solid EHQP is the same as the height of the pyramid DEFH, and the height of the solid BGML is the same as the height of the pyramid ABCG. Therefore, as the base ABC is to the base DEF, so is the height of the pyramid DEFH to the height of the pyramid ABCG. The converse follows by reversing the argument."
