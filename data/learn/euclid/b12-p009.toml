id = "XII.9"
book = 12
order = 9
title = "Equal pyramids: reciprocal bases and heights"
statement = "In equal pyramids which have triangular bases the bases are reciprocally proportional to the heights; and those pyramids which have triangular bases and in which the bases are reciprocally proportional to the heights are equal."
proof = "Therefore in equal pyramids which have triangular bases the bases are reciprocally proportional to the heights; and those pyramids which have triangular bases and in which the bases are reciprocally proportional to the heights are equal. Q.E.D."

[[step]]
text = "Let there be equal pyramids which have the triangular bases ABC, DEF and the vertices G, H. I say that in the pyramids ABCG, DEFH the bases are reciprocally proportional to the heights, that is, as the base ABC is to the base DEF, so is the height of the pyramid DEFH to the height of the pyramid ABCG."
