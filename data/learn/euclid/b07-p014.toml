[[step]]
text = "Since A is to B as D is to E, alternately A is to D as B is to E (VII.13). Again, since B is to C as E is to F, alternately B is to E as C is to F. But B is to E as A is to D. Therefore also A is to D as C is to F, and alternately A is to C as D is to F."
