id = "VII.14"
book = 7
order = 14
title = "Ex aequali"
statement = "If there be as many numbers as we please, and others equal to them in multitude, which taken two and two are in the same ratio, they will also be in the same ratio ex aequali."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let there be as many numbers as we please A, B, C, and others equal to them in multitude D, E, F, which taken two and two are in the same ratio, so that A is to B as D is to E, and B is to C as E is to F. I say that ex aequali A is to C as D is to F. (Here 2 : 3 = 4 : 6 and 3 : 6 = 6 : 12.)"
