id = "X.81"
book = 10
order = 81
title = "Only one annex"
statement = "To a second apotome of a medial straight line only one medial straight line can be annexed which is commensurable with the whole in square only and which contains with the whole a medial rectangle."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Take a second apotome of a medial AB. I say that no second straight line of the same kind can be annexed to it."
draw = [
  "clear",
  "point AB 0 0",
  "point ab 0.188 0",
  "segment AB ab blue",
  "point BC 0 -0.9",
  "point bc 1.212 -0.9",
  "segment BC bc red",
  "point BD 0 -1.8",
  "point bd 0.84 -1.8",
  "segment BD bd green",
]

[[step]]
text = "Suppose two such annexes BC, BD. Applying the areas to a rational straight line gives an apotome whose annexed rational lines would then be two, contrary to X.79. Impossible."
draw = [
]
