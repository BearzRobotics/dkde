id = "XII.8"
book = 12
order = 8
title = "Similar pyramids: triplicate ratio"
statement = "Similar pyramids which have triangular bases are in the triplicate ratio of their corresponding sides."
proof = "Therefore similar pyramids which have triangular bases are in the triplicate ratio of their corresponding sides. Q.E.D."

[[step]]
text = "Let there be similar and similarly situated pyramids of which the triangles ABC, DEF are the bases and the points G, H the vertices. I say that the pyramid ABCG has to the pyramid DEFH the ratio triplicate of that which BC has to EF. (Here the second pyramid is the first enlarged by one half.)"
