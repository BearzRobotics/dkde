[[step]]
text = "Complete the parallelepipedal solids BGML, EHQP on the straight lines BA, AC, AG and ED, DF, DH. Since the pyramid ABCG is similar to the pyramid DEFH, the angle ABC is equal to the angle DEF, the angle GBC to the angle HEF, and the angle ABG to the angle DEH; and as AB is to DE, so is BC to EF and BG to EH. Since, as AB is to DE, so is BC to EF, and the sides about the equal angles are proportional, the parallelogram BM is similar to the parallelogram EQ. For the same reason BN is similar to ER and BK to EO. Therefore the three parallelograms BM, BK, BN are similar to the three EQ, EO, ER. But the three BM, BK, BN are equal and similar to their opposites, and the three EQ, EO, ER to theirs. Therefore the solids BGML, EHQP are contained by similar planes equal in multitude. Therefore the solid BGML is similar to the solid EHQP. But similar parallelepipedal solids are in the triplicate ratio of their corresponding sides (XI.33). Therefore the solid BGML has to the solid EHQP the ratio triplicate of that which the corresponding side BC has to the corresponding side EF. But, as the solid BGML is to the solid EHQP, so is the pyramid ABCG to the pyramid DEFH, since the pyramid is the sixth part of the solid on account of the prism, being half of the solid, being three times the pyramid (XII.7). Therefore the pyramid ABCG also has to the pyramid DEFH the ratio triplicate of that which BC has to EF."
