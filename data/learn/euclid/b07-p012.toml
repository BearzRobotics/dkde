id = "VII.12"
book = 7
order = 12
title = "Proportional numbers: sums"
statement = "If there be as many numbers as we please in proportion, then as one of the antecedents is to one of the consequents, so will all the antecedents be to all the consequents."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let A, B, C, D be as many numbers as we please in proportion, so that A is to B as C is to D. I say that A is to B as A, C together are to B, D together. (Here 2 : 3 = 4 : 6 = 6 : 9, and 2 + 4 + 6 : 3 + 6 + 9 = 2 : 3.)"
