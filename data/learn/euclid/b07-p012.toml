[[step]]
text = "If A is equal to B, C is also equal to D, and so A, C together are equal to B, D together, and the ratios are the same. If A is a part or parts of B, then C is the same part or parts of D (VII definition 20). Therefore A, C together are the same part or parts of B, D together that A is of B (VII.5, 6). Therefore, as A is to B, so are A, C together to B, D together."
