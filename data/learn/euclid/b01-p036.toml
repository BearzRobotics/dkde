[[step]]
text = "Let BE, CH be joined. Since BC is equal to FG, and FG to EH, BC is equal to EH. And they are parallel, and EB, HC join them. But straight lines joining equal and parallel straight lines at their extremities in the same directions are equal and parallel (I.33). Therefore EBCH is a parallelogram."
draw = [
  "segment B E green",
  "segment C H green",
  "polygon E B C H teal fill",
]

[[step]]
text = "It is equal to ABCD, for it has the same base BC with it and is in the same parallels BC, AH (I.35). For the same reason EFGH is equal to the same EBCH. Therefore the parallelogram ABCD is also equal to EFGH (common notion 1)."
