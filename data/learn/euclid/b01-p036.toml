id = "I.36"
book = 1
order = 37
title = "Parallelograms on equal bases"
statement = "Parallelograms which are on equal bases and in the same parallels are equal to one another."
proof = "Therefore parallelograms which are on equal bases and in the same parallels are equal to one another. Q.E.D."

[[step]]
text = "Let ABCD, EFGH be parallelograms on equal bases BC, FG and in the same parallels AH, BG. I say that the parallelogram ABCD is equal to EFGH."
draw = [
