[[step]]
text = "Since A, C, D, B are in continued proportion and their extremes are prime to one another, they are the least in their ratio (VIII.1). Take the least numbers in that ratio, and let their sides be F, G (here 2 and 3). Then the least four in continued proportion are the products F·F·F, F·F·G, F·G·G, G·G·G (VIII.2), so A is the cube of F and B the cube of G."
draw = [
]

[[step]]
text = "Now the unit, F, F·F, F·F·F (1, 2, 4, 8) are in continued proportion, since the unit measures F as often as F measures F·F, and so on. Likewise the unit, G, G·G, G·G·G (1, 3, 9, 27). So between A and the unit fall two numbers (2, 4), and between B and the unit two numbers (3, 9): as many as fall between A and B."
