id = "VIII.9"
book = 8
order = 9
title = "Means between prime numbers and the unit"
statement = "If two numbers be prime to one another, and numbers fall between them in continued proportion, then, however many numbers fall between them in continued proportion, so many will also fall between each of them and an unit in continued proportion."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let A, B be two numbers prime to one another (8 and 27), and let C, D (12, 18) fall between them in continued proportion. I say that as many numbers fall between each of A, B and the unit."
