[[step]]
text = "Let AH be produced in each direction, let any number of straight lines AK, KL be made equal to AE, and any number HM, MN equal to EH, and let the parallelograms LP, KV, HW, MS and the solids LQ, KR, DM, MT be completed. Since the straight lines LK, KA, AE are equal to one another, the parallelograms LP, KV, EV are equal to one another, and so are KO, KB, AG, and LX, KQ, AR (for they are opposite). Similarly the parallelograms EC, HW, MS are equal to one another, and so are HG, HI, IN, and DH, MU, NT. Therefore three planes of the solids LQ, KR, AU are equal to three planes of one another, and the three planes are equal and similar to their opposites. Therefore the three solids LQ, KR, AU are equal to one another (XI definition 10). Similarly the three solids ED, DM, MT are equal to one another. Therefore, whatever multiple the base LF is of the base AF, that multiple also is the solid LU of the solid AU; and whatever multiple the base NF is of the base FH, that multiple also is the solid NU of the solid ED."
