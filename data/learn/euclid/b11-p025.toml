id = "XI.25"
book = 11
order = 25
title = "Cutting a parallelepiped"
statement = "If a parallelepipedal solid be cut by a plane which is parallel to the opposite planes, then, as the base is to the base, so will the solid be to the solid."
proof = "Therefore if a parallelepipedal solid be cut by a plane which is parallel to the opposite planes, then, as the base is to the base, so will the solid be to the solid. Q.E.D."

[[step]]
text = "For let the parallelepipedal solid ABCD be cut by the plane FG which is parallel to the opposite planes RA, DH. I say that, as the base AEFV is to the base EHCF, so is the solid ABFU to the solid EGCD."
