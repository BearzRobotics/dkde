[[step]]
text = "If the base LF is equal to the base NF, the solid LU is also equal to the solid NU; if the base LF exceeds the base NF, the solid LU exceeds the solid NU; and if less, less. There being four magnitudes, the two bases AF, FH and the two solids AU, ED, equimultiples have been taken of the base AF and the solid AU, namely the base LF and the solid LU, and of the base FH and the solid ED, namely the base FN and the solid NU; and it has been proved that if the base LF exceeds the base FN, the solid LU exceeds the solid NU; if equal, equal; if less, less. Therefore, as the base AF is to the base FH, so is the solid AU to the solid ED (V, definition 5)."
