[[step]]
text = "On the straight line EF, and at the points E, F on it, let the angle FEG be constructed equal to the angle ABC, and the angle EFG equal to the angle ACB (I.23). Then the remaining angle at A is equal to the remaining angle at G (I.32). Therefore the triangle ABC is equiangular with the triangle GEF."
draw = [
]

[[step]]
text = "Therefore in the triangles ABC, GEF the sides about the equal angles are proportional (VI.4), so AB is to BC as GE is to EF. But by hypothesis AB is to BC as DE is to EF. Therefore DE is to EF as GE is to EF, so DE is equal to GE. For the same reason DF is also equal to GF. Since DE is equal to EG, and EF is common, the two sides DE, EF are equal to the two sides GE, EF, and the base DF is equal to the base FG. Therefore the angle DEF is equal to the angle GEF (I.8), and the triangle DEF is equal to the triangle GEF. Therefore the triangle DEF is equiangular with the triangle ABC."
