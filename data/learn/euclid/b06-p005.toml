id = "VI.5"
book = 6
order = 5
title = "Proportional sides give equiangular triangles"
statement = "If two triangles have their sides proportional, the triangles will be equiangular and will have those angles equal which the corresponding sides subtend."
proof = "Therefore if two triangles have their sides proportional, the triangles will be equiangular and will have those angles equal which the corresponding sides subtend. Q.E.D."

[[step]]
text = "Let ABC, DEF be two triangles having their sides proportional, so that AB is to BC as DE is to EF, BC to CA as EF to FD, and BA to AC as ED to DF. I say that the triangle ABC is equiangular with the triangle DEF, and they will have those angles equal which the corresponding sides subtend, namely the angle ABC to the angle DEF, the angle BCA to the angle EFD, and the angle BAC to the angle EDF."
