[[step]]
text = "Since the square on BA is to the square on AF as the number DC is to CE, the squares are commensurable, so AB, AF, which are rational (AB is rational, AF is commensurable in square with it), are rational straight lines commensurable in square. But CD, CE are not in the ratio of squares, so the lines are incommensurable in length (X.9). Since, as DC is to CE, so is the square on BA to the square on AF, convertendo as CD is to DE, so is the square on AB to the square on BF (III.31, I.47). But CD has to DE the ratio of a square to a square, so AB is commensurable in length with BF (X.9). The square on AB is the squares on AF, FB. So the square on AB is greater than the square on AF by the square on FB, which is commensurable with AB."
