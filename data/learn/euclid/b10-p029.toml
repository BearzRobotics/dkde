id = "X.29"
book = 10
order = 29
title = "Two rational lines: the first binomial type"
statement = "To find two rational straight lines commensurable in square only and such that the square on the greater is greater than the square on the less by the square on a straight line commensurable in length with the greater."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let there be set out a rational straight line AB, and two square numbers CD, DE such that their difference CE is not square. On AB describe the semicircle AFB, let it be that, as DC is to CE, so is the square on BA to the square on AF, and let FB be joined. I say that AB, AF are rational straight lines commensurable in square only, and that the square on AB is greater than the square on AF by the square on FB, which is commensurable in length with AB. (Here take the numbers 4, 3, 1: AB = 2, AF = the square root of 3, FB = 1.)"
