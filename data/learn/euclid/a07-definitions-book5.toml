title = "Definitions (Book V)"
statement = "The eighteen definitions of Book V, on magnitudes and proportion."

[[step]]
text = "1. A magnitude is a part of a magnitude, the less of the greater, when it measures the greater. 2. The greater is a multiple of the less when it is measured by the less."

[[step]]
text = "3. A ratio is a sort of relation in respect of size between two magnitudes of the same kind. 4. Magnitudes are said to have a ratio to one another which are capable, when multiplied, of exceeding one another."

[[step]]
text = "5. Magnitudes are said to be in the same ratio, the first to the second and the third to the fourth, when, if any equimultiples whatever be taken of the first and third, and any equimultiples whatever of the second and fourth, the former equimultiples alike exceed, are alike equal to, or alike fall short of, the latter equimultiples respectively taken in corresponding order."

[[step]]
text = "6. Let magnitudes which have the same ratio be called proportional. 7. When, of the equimultiples, the multiple of the first magnitude exceeds the multiple of the second, but the multiple of the third does not exceed the multiple of the fourth, then the first is said to have to the second a greater ratio than the third has to the fourth."

[[step]]
text = "8. A proportion in three terms is the least possible. 9. When three magnitudes are proportional, the first is said to have to the third the duplicate ratio of that which it has to the second. 10. When four magnitudes are continuously proportional, the first is said to have to the fourth the triplicate ratio of that which it has to the second, and so on continually, whatever be the proportion."

[[step]]
text = "11. Antecedent and consequent: in a ratio the first term is the antecedent and the second the consequent. 12. Alternate ratio is taking the antecedent in relation to the antecedent and the consequent in relation to the consequent. 13. Inverse ratio is taking the consequent as antecedent in relation to the antecedent as consequent."

[[step]]
text = "14. Composition of a ratio is taking the antecedent together with the consequent as one in relation to the consequent by itself. 15. Separation of a ratio is taking the excess by which the antecedent exceeds the consequent in relation to the consequent by itself. 16. Conversion of a ratio is taking the antecedent in relation to the excess by which the antecedent exceeds the consequent."

[[step]]
text = "17. A ratio ex aequali arises when, there being several magnitudes and another set equal to them in multitude which taken two and two are in the same proportion, the first is to the last among the first magnitudes as the first is to the last among the second magnitudes. 18. A perturbed proportion arises when, there being three magnitudes and another set equal to them in multitude, as antecedent is to consequent among the first magnitudes, so is antecedent to consequent among the second magnitudes, while, as the consequent is to a third among the first magnitudes, so is a third to the antecedent among the second magnitudes."
