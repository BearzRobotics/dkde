[[step]]
text = "Since A is greater than C, and B is another magnitude, A has to B a greater ratio than C has to B (V.8). But A:B = C:D. Therefore C has to D a greater ratio than C has to B. But that to which the same has a greater ratio is less (V.10). Therefore D is less than B. Therefore B is greater than D."
draw = [
]

[[step]]
text = "Similarly we can prove that if A is equal to C, B is also equal to D; and if A is less than C, B is also less than D."
