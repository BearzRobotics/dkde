id = "V.14"
book = 5
order = 14
title = "Ratios in order"
statement = "If a first magnitude have to a second the same ratio as a third has to a fourth, and the first be greater than the third, the second will also be greater than the fourth; if equal, equal; and if less, less."
proof = "Therefore if a first magnitude have to a second the same ratio as a third has to a fourth, and the first be greater than the third, the second will also be greater than the fourth; if equal, equal; and if less, less. Q.E.D."

[[step]]
text = "For let a first magnitude A have to a second B the same ratio as a third C to a fourth D, and let A be greater than C. I say that B is also greater than D."
