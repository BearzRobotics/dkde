id = "X.5"
book = 10
order = 5
title = "Commensurable magnitudes are as numbers"
statement = "Commensurable magnitudes have to one another the ratio which a number has to a number."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let A, B be commensurable magnitudes (12 and 8). I say that A has to B the ratio which a number has to a number."
draw = [
  "clear",
  "point A 0 0",
  "point a 8.4 0",
  "segment A a blue",
  "point B 0 -0.9",
  "point b 5.6 -0.9",
  "segment B b red",
  "point C 0 -1.8",
  "point c 2.8 -1.8",
  "segment C c green",
]

[[step]]
text = "Since A, B are commensurable, some magnitude C measures them (here 4). Let C measure A as many times as there are units in D (3), and B as many times as there are units in E (2). Since C measures A according to the units in D, and the unit measures D according to the units in D, the unit measures D the same number of times as C measures A. Therefore, as C is to A, so is the unit to D. Inversely, as A is to C, so is D to the unit; and, as C is to B, so is the unit to E. Therefore, ex aequali, as A is to B, so is the number D to the number E (3 to 2)."
