id = "VII.36"
book = 7
order = 36
title = "The least common multiple of three numbers"
statement = "Given three numbers, to find the least number which they measure."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let A, B, C be the three given numbers (here 2, 3, 4). It is required to find the least number which they measure."
draw = [
