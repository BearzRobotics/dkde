[[step]]
text = "Since the unit A measures the number BC the same number of times that D measures EF, as many units as there are in BC, so many numbers equal to D are there in EF. Let BC be divided into its units BG, GH, HC, and EF into the numbers EK, KL, LF equal to D. Then the multitude of the units BG, GH, HC is equal to the multitude of the numbers EK, KL, LF. And since the units BG, GH, HC are equal to one another, and the numbers EK, KL, LF are also equal to one another, while the multitude of the units is equal to the multitude of the numbers, the unit BG will be to the number EK as the unit GH is to the number KL, and the unit HC to the number LF. Therefore, as one of the antecedents is to one of the consequents, so will all the antecedents be to all the consequents (VII.12). Therefore, as the unit BG is to the number EK, so is BC to EF. But the unit BG is equal to the unit A, and the number EK to the number D. Therefore, as the unit A is to the number D, so is BC to EF. Therefore the unit A measures the number D the same number of times that BC measures EF."
