id = "VII.15"
book = 7
order = 15
title = "The unit and the numbers"
statement = "If a unit measure any number, and another number measure any other number the same number of times, alternately also, the unit will measure the third number the same number of times that the second measures the fourth."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "For let a unit A measure any number BC, and let another number D measure any other number EF the same number of times. I say that, alternately also, the unit A measures the number D the same number of times that BC measures EF. (Here 1 measures 4 four times; 3 measures 12 four times; alternately 1 measures 3 as often as 4 measures 12.)"
