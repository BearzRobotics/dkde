id = "VII.26"
book = 7
order = 26
title = "Products of primes"
statement = "If two numbers be prime to two numbers, both to each, their products also will be prime to one another."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let the two numbers A, B be prime to the two numbers C, D, both to each (here 3, 5 and 2, 7), and let A by multiplying B make E, and let C by multiplying D make F. I say that E, F are prime to one another."
