[[step]]
text = "Let BD, EC, CD be joined. Since ABED is a parallelogram, and BD is its diameter, the triangle ABD is equal to the triangle EBD (I.34). Therefore the pyramid of which the triangle ABD is the base and the point C the vertex is equal to the pyramid of which the triangle DEB is the base and the point C the vertex (XII.5). But the pyramid of which the triangle DEB is the base and the point C the vertex is the same as the pyramid of which the triangle EBC is the base and the point D the vertex, for they are contained by the same planes. Therefore the pyramid with the base ABD and vertex C is equal to the pyramid with the base EBC and vertex D. Again, since FCBE is a parallelogram, and CE is its diameter, the triangle CEF is equal to the triangle CBE. Therefore the pyramid of which the triangle BCE is the base and the point D the vertex is equal to the pyramid of which the triangle ECF is the base and the point D the vertex. But the pyramid with base BCE and vertex D was proved equal to the pyramid with base ABD and vertex C. Therefore the pyramid with base CEF and vertex D is also equal to the pyramid with base ABD and vertex C. Therefore the prism ABCDEF has been divided into three pyramids equal to one another, which have triangular bases."
