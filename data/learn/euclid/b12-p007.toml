id = "XII.7"
book = 12
order = 7
title = "A prism is three pyramids"
statement = "Any prism which has a triangular base is divided into three pyramids equal to one another which have triangular bases."
proof = "Therefore any prism which has a triangular base is divided into three pyramids equal to one another which have triangular bases. Corollary: any pyramid is a third part of the prism which has the same base with it and equal height. Q.E.D."

[[step]]
text = "Let there be a prism of which the triangle ABC is the base and DEF the opposite triangle. I say that the prism ABCDEF is divided into three pyramids equal to one another, which have triangular bases."
