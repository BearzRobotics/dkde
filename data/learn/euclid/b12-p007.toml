[[step]]
text = "And since the pyramid with base ABD and vertex C is the same as the pyramid with base ABC and vertex D, for they are contained by the same planes, and the pyramid with base ABD and vertex C was proved a third part of the prism with the base ABC and the opposite triangle DEF, the pyramid with base ABC and vertex D is a third part of the prism with the same base ABC and the same height. (Corollary.) Hence any pyramid is a third part of the prism which has the same base with it and equal height."
