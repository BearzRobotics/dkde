[[step]]
text = "Take two least numbers E, F in the ratio of A, B, C, D (VII.33), then three, G, H, K, and so on until the multitude equals that of A, B, C, D, and let them be L, M, N, O. Then, as before, L, O are the cube-like products of E, F, so they are prime to one another (VIII.2, VII.27). Since L, M, N, O are in the same ratio with A, B, C, D and equal in multitude, and A, B, C, D are the least, A is equal to L and D to O. Therefore the extremes A, D are prime to one another."
