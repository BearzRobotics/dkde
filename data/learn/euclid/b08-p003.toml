id = "VIII.3"
book = 8
order = 3
title = "Least numbers: the extremes are prime"
statement = "If as many numbers as we please in continued proportion be the least of those which have the same ratio with them, the extremes of them are prime to one another."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let A, B, C, D be as many numbers as we please in continued proportion, the least of those which have the same ratio with them. I say that the extremes A, D are prime to one another."
