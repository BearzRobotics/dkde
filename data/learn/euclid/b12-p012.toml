id = "XII.12"
book = 12
order = 12
title = "Similar cones and cylinders"
statement = "Similar cones and cylinders are to one another in the triplicate ratio of the diameters in their bases."
proof = "Therefore similar cones and cylinders are to one another in the triplicate ratio of the diameters in their bases. Q.E.D."

[[step]]
text = "Let there be similar cones and cylinders, let the circles ABCD, EFGH be their bases, BD, FH the diameters of the bases, and KL, MN the axes of the cones and cylinders. I say that the cone of which the circle ABCD is the base and the point L the vertex has to the cone of which the circle EFGH is the base and the point N the vertex the ratio triplicate of that which BD has to FH."
