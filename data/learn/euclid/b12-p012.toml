[[step]]
text = "For if the cone ABCDL has not to the cone EFGHN the ratio triplicate of that which BD has to FH, the cone ABCDL will have to some solid either less than the cone EFGHN or greater the ratio triplicate of that. First let it have that ratio to a less solid O. Inscribe in the circle EFGH the square EFGH (IV.6). Then the square EFGH is greater than the half of the circle EFGH. On the square EFGH set up a pyramid having the same vertex as the cone. Then the pyramid so set up is greater than the half of the cone. Bisect the circumferences and so on, until some segments of the cone are left which are less than the excess by which the cone EFGHN exceeds the solid O. Let such be left. Therefore the remainder, the pyramid with the polygon EPFQGRHS as base and vertex N, is greater than the solid O. Inscribe in the circle ABCD the polygon ATBUCVDW similar and similarly situated to EPFQGRHS, and on it set up a pyramid having the same vertex L as the cone. Let LBT be a triangle containing the sides LB, BT of the pyramid, and NFP the corresponding triangle. Since the cone ABCDL is similar to the cone EFGHN, as BD is to FH, so is the axis KL to the axis MN. But, as BD is to FH, so is BK to FM, and therefore, alternately, as BK is to KL, so is FM to MN. Hence the sides about the equal angles BKL, FMN are proportional, so the triangle BKL is similar to the triangle FMN, and as LB is to BK, so is NF to FM. Again, as BK is to BT, so is FM to FP, as the polygons are similar; so ex aequali, as LB is to BT, so is NF to FP. Thus the triangles LBT, NFP have the sides proportional, so they are similar, and so the pyramid of which the polygon ATBUCVDW is the base and the point L the vertex is similar to the pyramid of which the polygon EPFQGRHS is the base and the point N the vertex, as they are contained by similar planes equal in multitude. Therefore the pyramid ATBUCVDWL has to the pyramid EPFQGRHSN the ratio triplicate of that which BT has to FP (XII.8), that is, which BD has to FH. But the cone ABCDL was supposed to have to the solid O the ratio triplicate of that which BD has to FH. Therefore, as the cone is to the solid O, so is the pyramid in the cone ABCDL to the pyramid in the cone EFGHN. Alternately, as the cone is to the pyramid in it, so is the solid O to the pyramid in the cone EFGHN. But the cone is greater than the pyramid in it. Therefore the solid O is greater than the pyramid in the cone EFGHN. But it is also less, which is impossible. Therefore the cone ABCDL has not to any solid less than the cone EFGHN the ratio triplicate of that which BD has to FH. Similarly we can prove that neither has the cone EFGHN to any solid less than the cone ABCDL the ratio triplicate of that which FH has to BD. Nor has the cone ABCDL to any solid greater than the cone EFGHN the ratio triplicate of that which BD has to FH, for, if possible, let it have to a greater solid O; then inversely the solid O has to the cone ABCDL the ratio triplicate of that which FH has to BD; but the solid O is to the cone ABCDL as the cone EFGHN is to some solid less than the cone ABCDL, which was proved impossible. Therefore the cone has to the cone the ratio triplicate of that which BD has to FH. But as the cone is to the cone, so is the cylinder to the cylinder, for the cylinder is triple of the cone (XII.10). Therefore the cylinder also has to the cylinder the ratio triplicate of that which BD has to FH."
