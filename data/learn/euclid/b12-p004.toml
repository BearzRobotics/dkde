id = "XII.4"
book = 12
order = 4
title = "Prisms in pyramids"
statement = "If there be two pyramids of the same height with triangular bases, and each of them be divided into two pyramids equal to one another and similar to the whole, and into two equal prisms, then, as the base of the one pyramid is to the base of the other pyramid, so will all the prisms in the one pyramid be to all the prisms, being equal in multitude, in the other pyramid."
proof = "Therefore, as the base of the one pyramid is to the base of the other pyramid, so will all the prisms in the one pyramid be to all the prisms, being equal in multitude, in the other pyramid. Q.E.D."

[[step]]
text = "Let there be two pyramids of the same height which have the triangular bases ABC, DEF and the vertices G, H, and let each of them be divided into two pyramids equal to one another and similar to the whole, and into two equal prisms (XII.3). I say that, as the base ABC is to the base DEF, so are all the prisms in the pyramid ABCG to all the prisms, being equal in multitude, in the pyramid DEFH."
