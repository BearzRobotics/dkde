[[step]]
text = "Since BX is equal to XC, and AL to LC, XL is parallel to AB, and the triangle ABC is similar to the triangle LXC. For the same reason the triangle DEF is similar to the triangle RVF. And since BC is double of CX and EF double of FV, as BC is to CX, so is EF to FV. And on BC, CX the similar and similarly situated rectilineal figures ABC, LXC are described, and on EF, FV the similar and similarly situated figures DEF, RVF. Therefore, as the triangle ABC is to the triangle LXC, so is the triangle DEF to the triangle RVF (VI.22). Therefore, alternately, as the triangle ABC is to the triangle DEF, so is the triangle LXC to the triangle RVF. But as the triangle LXC is to the triangle RVF, so is the prism of which the triangle LXC is the base and OMN the opposite to the prism of which the triangle RVF is the base and STU the opposite (XI.32, the bases being in the same ratio and the heights equal). Therefore, as the base ABC is to the base DEF, so is the prism in the pyramid ABCG to the prism in the pyramid DEFH, and so also the two prisms to the two prisms. And similarly, if the pyramids ABC, DEF be again divided, the prisms in them will be in the same ratio to one another. Therefore, as the base ABC is to the base DEF, so are all the prisms in the pyramid ABCG to all the prisms, being equal in multitude, in the pyramid DEFH."
