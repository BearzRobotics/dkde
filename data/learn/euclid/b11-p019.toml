id = "XI.19"
book = 11
order = 19
title = "The common section of two planes at right angles to a third"
statement = "If two planes which cut one another be at right angles to any plane, their common section will also be at right angles to the same plane."
proof = "Therefore if two planes which cut one another be at right angles to any plane, their common section will also be at right angles to the same plane. Q.E.D."

[[step]]
text = "For let the two planes AB, BC be at right angles to the plane of reference, and let their common section be BD. I say that BD is at right angles to the plane of reference."
