[[step]]
text = "For suppose it is not, but, if possible, let DE be drawn from the point D in the plane AB at right angles to the straight line AD, and DF in the plane BC at right angles to CD. Since the plane AB is at right angles to the plane of reference, and DE has been drawn in the plane AB at right angles to AD, their common section, DE is at right angles to the plane of reference (definition 4). Similarly DF is also at right angles to the plane of reference. Therefore from the same point D two straight lines have been set up at right angles to the plane of reference on the same side, which is impossible (XI.13). Therefore no straight line except the common section DB of the planes AB, BC can be set up from the point D at right angles to the plane of reference."
