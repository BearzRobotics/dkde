id = "VI.6"
book = 6
order = 6
title = "One angle equal, sides about it proportional"
statement = "If two triangles have one angle equal to one angle and the sides about the equal angles proportional, the triangles will be equiangular and will have those angles equal which the corresponding sides subtend."
proof = "Therefore if two triangles have one angle equal to one angle and the sides about the equal angles proportional, the triangles will be equiangular and will have those angles equal which the corresponding sides subtend. Q.E.D."

[[step]]
text = "Let ABC, DEF be two triangles having one angle BAC equal to one angle EDF and the sides about the equal angles proportional, so that BA is to AC as ED is to DF. I say that the triangle ABC is equiangular with the triangle DEF and will have the angle ABC equal to the angle DEF, and the angle ACB to the angle DFE."
