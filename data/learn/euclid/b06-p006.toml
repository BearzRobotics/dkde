[[step]]
text = "On the straight line DF, and at the points D, F on it, let the angle FDG be constructed equal to either of the angles BAC, EDF, and the angle DFG equal to the angle ACB (I.23). Therefore the remaining angle at B is equal to the remaining angle at G, and the triangle ABC is equiangular with the triangle DGF. Therefore, as BA is to AC, so is GD to DF (VI.4). But by hypothesis as BA is to AC, so is ED to DF. Therefore ED is to DF as GD is to DF (V.11), so ED is equal to DG (V.9)."
