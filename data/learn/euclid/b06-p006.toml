]

[[step]]
text = "And DF is common; therefore the two sides ED, DF are equal to the two sides GD, DF, and the angle EDF is equal to the angle GDF. Therefore the base EF is equal to the base GF, the triangle DEF is equal to the triangle DGF, and the remaining angles are equal to the remaining angles (I.4). Therefore the angle DFG is equal to the angle DFE, and the angle at G to the angle at E. But the angle DFG is equal to the angle ACB. Therefore the angle ACB is also equal to the angle DFE. And the angle BAC is equal to the angle EDF. Therefore the remaining angle at B is equal to the remaining angle at E, and the triangle ABC is equiangular with the triangle DEF."
