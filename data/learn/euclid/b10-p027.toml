[[step]]
text = "C is medial, being the side of a square equal to the rectangle A, B (X.21). And D is medial, being commensurable with C (since C is to D as A to B... C² to D² = A²·... ). Since, as A is to B, so is C to D, alternately as A is to C, so is B to D; so the squares: the lines C, D are commensurable in square only because A, B are. Next, as A is to B so is C to D, and C is the mean between A and B, so the rectangle C, D equals the rectangle contained by B and... : by the proportion, C·D = B·B·... For these numbers C·D = 2^{1/4}·2^{3/4} = 2, which is rational. Therefore C, D are medial lines commensurable in square only which contain a rational rectangle."
