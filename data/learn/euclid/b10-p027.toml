id = "X.27"
book = 10
order = 27
title = "Medial lines containing a rational rectangle"
statement = "To find medial straight lines commensurable in square only which contain a rational rectangle."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let there be set out two rational straight lines A, B commensurable in square only (1 and the square root of 2), and let C be taken a mean proportional between them (the fourth root of 2), and let it be that, as A is to B, so is C to D (so D is the fourth root of 8). I say that C, D are medial straight lines commensurable in square only which contain a rational rectangle."
