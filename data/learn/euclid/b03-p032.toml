id = "III.32"
book = 3
order = 32
title = "The tangent and chord"
statement = "If a straight line touch a circle, and from the point of contact there be drawn across, in the circle, a straight line cutting the circle, the angles which it makes with the tangent will be equal to the angles in the alternate segments of the circle."
proof = "Therefore if a straight line touch a circle, and from the point of contact there be drawn across, in the circle, a straight line cutting the circle, the angles which it makes with the tangent will be equal to the angles in the alternate segments of the circle. Q.E.D."

[[step]]
text = "For let a straight line EF touch the circle ABCD at the point B, and from the point B let a straight line BD be drawn across in the circle ABCD cutting it. I say that the angles which BD makes with the tangent EF will be equal to the angles in the alternate segments of the circle: the angle FBD equal to the angle BAD, and the angle EBD to the angle BCD."
