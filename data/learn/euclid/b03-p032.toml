[[step]]
text = "From B let BA be drawn at right angles to EF (I.11), let a point C be taken at random on the circumference BD, and let AD, DC, CB be joined. Since a straight line EF touches the circle ABCD at B, and BA has been drawn from the point of contact at right angles to the tangent, the centre of the circle ABCD is on BA (III.19). Therefore BA is a diameter, and the angle ADB, being in a semicircle, is right (III.31). Therefore the remaining angles BAD, ABD are equal to one right angle (I.32)."
draw = [
  "segment B A green",
  "segment A D green",
  "angle A D B green fill",
]

[[step]]
text = "But the angle ABF is also right. Therefore the angle ABF is equal to the angles BAD, ABD. Take away the angle ABD from each. Then the remaining angle DBF is equal to the angle BAD, which is in the alternate segment of the circle. Next, since ABCD is a quadrilateral in a circle, its opposite angles are equal to two right angles (III.22). But the angles DBF, DBE are also equal to two right angles (I.13). Therefore the angles DBF, DBE are equal to the angles BAD, BCD, of which BAD was proved equal to DBF. Therefore the remaining angle DBE is equal to the angle DCB in the alternate segment DCB of the circle."
draw = [
  "angle B A D orange fill",
  "segment D C black",
  "segment C B black",
  "angle E B D purple fill",
  "angle B C D purple fill",
]
