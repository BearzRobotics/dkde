id = "VII.34"
book = 7
order = 34
title = "The least common multiple of two numbers"
statement = "Given two numbers, to find the least number which they measure."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let A, B be the two given numbers (here 4 and 6). It is required to find the least number which they measure."
