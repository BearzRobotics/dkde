id = "XIII.9"
book = 13
order = 9
title = "Hexagon and decagon"
statement = "If the side of the hexagon and that of the decagon inscribed in the same circle be added together, the whole straight line has been cut in extreme and mean ratio, and its greater segment is the side of the hexagon."
proof = "Therefore if the side of the hexagon and that of the decagon inscribed in the same circle be added together, the whole straight line has been cut in extreme and mean ratio, and its greater segment is the side of the hexagon. Q.E.D."

[[step]]
text = "Let ABC be a circle, let BC be the side of the inscribed decagon, and CD the side of the inscribed hexagon, and let them be in a straight line. I say that the whole straight line BD has been cut in extreme and mean ratio, and CD is the greater segment."
