[[step]]
text = "For let the centre of the circle, the point E, be taken, and let EB, EC, ED be joined and let BE be carried through to A. Since CD is the side of the equilateral hexagon, the arc CD is a sixth of the circle, so the angle CED is a third of two right angles... Since BC is the side of the decagon, the circumference ACB is five times the circumference BC. Therefore the circumference AC is four times the circumference CB. But, as the circumference AC is to CB, so is the angle AEC to the angle CEB (VI.33). Therefore the angle AEC is four times the angle CEB. And since the angle EBC is equal to the angle ECB (I.5), the angle AEC is double of the angle ECB (I.32). And the angle ECD is double of the angle CEB, since the circumference CD is double of the circumference CB. Therefore the angle ECD is equal to the angle AEC... The triangle BEC is isosceles with the angle at E equal to 36 degrees, and angles at B and C of 72 degrees each; the triangle ECD is equiangular... Therefore the triangle BEC is equiangular with the triangle BCD (angle at B common, angle BEC equal to angle BCD). Therefore, as BD is to BE, so is EB to BC. But EB is equal to CD. Therefore, as BD is to DC, so is DC to CB. And BD is greater than DC. Therefore DC is also greater than CB. Therefore the straight line BD has been cut in extreme and mean ratio at C, and DC is the greater segment."
