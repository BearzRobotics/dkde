id = "XIII.10"
book = 13
order = 10
title = "The sides of pentagon, hexagon and decagon"
statement = "If an equilateral pentagon be inscribed in a circle, the square on the side of the pentagon is equal to the squares on the sides of the hexagon and the decagon inscribed in the same circle."
proof = "Therefore if an equilateral pentagon be inscribed in a circle, the square on the side of the pentagon is equal to the squares on the sides of the hexagon and the decagon inscribed in the same circle. Q.E.D."

[[step]]
text = "Let ABCDE be a circle, and let the equilateral pentagon ABCDE be inscribed in it, F being the centre. I say that the square on the side of the pentagon is equal to the squares on the side of the hexagon and the side of the decagon inscribed in the circle."
