[[step]]
text = "Euclid draws FH perpendicular to AB, carries it to K on the circle, so that AK is the side of the decagon (the arc AK is half the arc AB), and FB is the side of the hexagon (it equals the radius, IV.15). He then draws KN perpendicular to FB and shows that triangle ABF is equiangular with triangle BFN, so that AB is to BF as FB is to BN, and the rectangle AB, BN equals the square on BF; in the same way the rectangle LA, AN equals the square on AF... and adding, the square on AB equals the squares on BF and BM (the side of the decagon, equal to AK)."
draw = [
]

[[step]]
text = "A check in numbers: in a circle of radius 1 the side of the hexagon is 1, the side of the decagon is (the square root of 5 less 1) over 2, about 0.618, and the side of the pentagon is about 1.1756. Then 1 + 0.618 squared is 1 + 0.382 = 1.382, and 1.1756 squared is 1.382. So the square on the side of the pentagon is the sum of the squares on the sides of the hexagon and the decagon."
