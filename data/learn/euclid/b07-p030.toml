id = "VII.30"
book = 7
order = 30
title = "A prime measuring a product"
statement = "If two numbers by multiplying one another make some number, and any prime number measure the product, it will also measure one of the original numbers."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "For let two numbers A, B by multiplying one another make C, and let any prime number D measure C (here 3 times 5 is 15 and the prime 5 measures 15). I say that D measures one of the numbers A, B."
