[[step]]
text = "For let it not measure A. Now D is prime. Therefore A, D are prime to one another (VII.29). Let D measure C according to E. Since D measures C according to E, D by multiplying E has made C. But, further, A by multiplying B has made C. Therefore the product of D, E is equal to the product of A, B. Therefore, as D is to A, so is B to E (VII.19). But D, A are prime, primes are also least (VII.21), and the least measure the numbers which have the same ratio the same number of times, the greater the greater and the less the less, that is, the antecedent the antecedent and the consequent the consequent (VII.20). Therefore D measures B. Similarly we can also show that, if D does not measure B, it will measure A. Therefore D measures one of the numbers A, B."
