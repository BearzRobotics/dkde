id = "VIII.10"
book = 8
order = 10
title = "Means between numbers and the unit"
statement = "If numbers fall between two numbers and an unit in continued proportion, however many numbers fall between each of them and an unit in continued proportion, so many will also fall between the numbers themselves in continued proportion."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let the numbers D, E fall between the number A and the unit in continued proportion, and the numbers F, G between the number B and the unit (here the unit, 2, 4, 8 and the unit, 3, 9, 27). I say that as many numbers fall between A and B in continued proportion."
