[[step]]
text = "Let D be 2 and F be 3, so that A is D·D·D and B is F·F·F. Form the numbers D·D·F = 12 and D·F·F = 18. Then A : 12 = D : F, since D·D·D to D·D·F is D to F (VII.17). Also 12 : 18 = D : F, and 18 : B = D : F. Therefore A, 12, 18, B are in continued proportion in the ratio of D to F, and two numbers fall between A and B, as two fall between each of A, B and the unit."
