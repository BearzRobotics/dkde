title = "To find the second binomial"
statement = "To find the second binomial straight line."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "The second binomial is the binomial with the lesser term commensurable in length with the assigned rational line, and the square on the greater exceeding the square on the less by the square on a line commensurable with the greater. It is required to find one. (Example: the terms two thirds of the square root of 3, doubled, that is 1.155, and 1 (the difference of squares is 1/3); the whole is 2.155.)"
