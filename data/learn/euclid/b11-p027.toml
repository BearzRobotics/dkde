[[step]]
text = "On the straight line AB, and at the point A on it, let there be constructed a solid angle contained by the angles BAH, HAK, KAB equal to the solid angle at C (XI.26), so that the angle BAH is equal to the angle ECG, the angle BAK to ECF, and the angle KAH to FCG. Let it be contrived that as EC is to CG, so is BA to AH, and, as GC is to CF, so is HA to AK (VI.12). Then ex aequali, as EC is to CF, so is BA to AK. Let the parallelogram HB and the solid AL be completed. Since, as EC is to CG, so is BA to AH, the sides about the equal angles ECG, BAH are proportional. Therefore the parallelogram HB is similar to the parallelogram GE. For the same reason the parallelogram KH is similar to the parallelogram GF, and FE to KB. Therefore three parallelograms of the solid CD are similar to three parallelograms of the solid AL. But the former three are equal and similar to their opposites, and the latter three to theirs. Therefore the whole solid CD is similar to the whole solid AL (XI definition 9). Therefore on the given straight line AB the solid AL has been described similar and similarly situated to the given parallelepipedal solid CD."
