id = "XI.27"
book = 11
order = 27
title = "A similar parallelepiped on a line"
statement = "On a given straight line to describe a parallelepipedal solid similar and similarly situated to a given parallelepipedal solid."
proof = "Therefore on the given straight line AB the parallelepipedal solid similar and similarly situated to the given solid CD has been described. Being what it was required to do."

[[step]]
text = "Let AB be the given straight line and CD the given parallelepipedal solid. It is required to describe on the given straight line AB a parallelepipedal solid similar and similarly situated to the given solid CD."
