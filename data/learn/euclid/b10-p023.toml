id = "X.23"
book = 10
order = 23
title = "A line commensurable with a medial line"
statement = "A straight line commensurable with a medial straight line is medial."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let A be a medial straight line (the fourth root of 2) and B commensurable with it (twice A). I say that B is medial."
draw = [
  "clear",
  "point A 0 0",
  "point a 0.832 0",
  "segment A a blue",
  "point B 0 -0.9",
  "point b 1.665 -0.9",
  "segment B b red",
]

[[step]]
text = "Let a rational straight line CD be set out, and let the rectangle CE equal to the square on A be applied to CD, producing ED as breadth. Then ED is rational and incommensurable in length with CD (X.22). Let the rectangle CF equal to the square on B be applied to CD, producing FD. Since A is commensurable with B, the square on A is commensurable with the square on B. Therefore CE is commensurable with CF, so ED is commensurable in length with DF (VI.1, X.11). Therefore DF is rational and incommensurable in length with CD (X.13). So the rectangle CD, DF is contained by rational straight lines commensurable in square only; and it equals the square on B. Therefore B is medial (X.21)."
