[[step]]
text = "However many A, B are in multitude, take so many G, H, K, L, the least numbers in the ratio of A, C, D, B (VIII.2). Their extremes G, L are prime to one another (VIII.3). Since A, C, D, B are in the same ratio as G, H, K, L, and equal in multitude, ex aequali A is to B as G is to L (VII.14). But A is to B as E is to F. Therefore G is to L as E is to F. But G, L are prime, hence least, so they measure E, F equally (VII.20): G measures E as often as L measures F. Let this multiplier be M. Then M times G, H, K, L give E and three numbers in continued proportion ending in F, since they have the ratios of G, H, K, L. Therefore as many numbers as fall between A, B fall between E, F."
