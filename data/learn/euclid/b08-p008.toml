id = "VIII.8"
book = 8
order = 8
title = "Means between two numbers"
statement = "If between two numbers there fall numbers in continued proportion with them, then, however many numbers fall between them in continued proportion, so many will also fall in continued proportion between the numbers which have the same ratios with the original numbers."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let the numbers C, D fall between the numbers A, B in continued proportion (A, C, D, B = 8, 12, 18, 27), and let E be to F as A is to B (here 16 to 54... take E, F in the same ratio). I say that, however many numbers fall between A, B in continued proportion, so many will fall between E, F in continued proportion."
