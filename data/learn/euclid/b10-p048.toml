  "segment AC ac green",
]

[[step]]
text = "Construction. Take two numbers whose sum is a square number but which are not in the ratio of a square to a square, and set them so that the greater term has to the less the ratio of the larger number to the smaller. Then the terms of the binomial are two rational straight lines commensurable in square only, with the stated relation to the assigned rational line and the stated excess of squares (X.29 and X.30 give the excess; X.6 and X.9 the commensurability). Then the sum is the first binomial straight line, as defined."
