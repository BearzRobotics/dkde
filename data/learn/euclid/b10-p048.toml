title = "To find the first binomial"
statement = "To find the first binomial straight line."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "The first binomial is the binomial with the greater term commensurable in length with the assigned rational line, and the square on the greater exceeding the square on the less by the square on a line commensurable with the greater. It is required to find one. (Example: the terms 2 and the square root of 3 (the difference of their squares is 1); the whole is 3.732.)"
