id = "XI.33"
book = 11
order = 33
title = "Similar parallelepipeds: the triplicate ratio"
statement = "Similar parallelepipedal solids are to one another in the triplicate ratio of their corresponding sides."
proof = "Therefore similar parallelepipedal solids are to one another in the triplicate ratio of their corresponding sides. Q.E.D."

[[step]]
text = "Let AB, CD be similar parallelepipedal solids, and let AE correspond to CF. I say that the solid AB has to the solid CD the ratio triplicate of that which AE has to CF. (Here the second box is the first enlarged one and a half times.)"
