[[step]]
text = "Let a third proportional BG be taken to BC, EF (VI.11), so that BC is to EF as EF is to BG, and let AG be joined. Since AB is to BC as DE is to EF, alternately AB is to DE as BC is to EF. But BC is to EF as EF is to BG. Therefore AB is to DE as EF is to BG. Therefore in the triangles ABG, DEF the sides about the equal angles are reciprocally proportional. But triangles which have one angle equal to one angle, and the sides about the equal angles reciprocally proportional, are equal (VI.15). Therefore the triangle ABG is equal to the triangle DEF."
