id = "VI.19"
book = 6
order = 19
title = "Similar triangles: the duplicate ratio"
statement = "Similar triangles are to one another in the duplicate ratio of the corresponding sides."
proof = "Therefore similar triangles are to one another in the duplicate ratio of the corresponding sides. (Corollary: if three straight lines be proportional, as the first is to the third, so is the figure described on the first to that which is similar and similarly described on the second.) Q.E.D."

[[step]]
text = "Let ABC, DEF be similar triangles having the angle at B equal to the angle at E, and AB is to BC as DE is to EF, so that BC corresponds to EF. I say that the triangle ABC has to the triangle DEF a ratio duplicate of that which BC has to EF."
