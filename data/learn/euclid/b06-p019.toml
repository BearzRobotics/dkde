[[step]]
text = "Since BC is to EF as EF is to BG, and if three straight lines be proportional, the first has to the third a ratio duplicate of that which it has to the second, BC has to BG a ratio duplicate of that which BC has to EF. But as CB is to BG, so is the triangle ABC to the triangle ABG (VI.1). Therefore the triangle ABC has to the triangle ABG a ratio duplicate of that which BC has to EF. But the triangle ABG is equal to the triangle DEF. Therefore the triangle ABC also has to the triangle DEF a ratio duplicate of that which BC has to EF."
