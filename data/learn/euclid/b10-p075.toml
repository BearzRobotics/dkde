title = "The second apotome of a medial"
statement = "If from a medial straight line there be subtracted a medial straight line which is commensurable with the whole in square only, and which contains with the whole a medial rectangle, the remainder is irrational; and let it be called a second apotome of a medial straight line."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB be a medial straight line and BC a medial straight line commensurable with it in square only, such that the rectangle AB, BC is medial (here 1.457 and 1.189, whose rectangle is the square root of 3). I say that the remainder AC is irrational, and is called a second apotome of a medial straight line (here 0.267)."
draw = [
  "clear",
  "point AB 0 0",
  "point ab 1.02 0",
  "segment AB ab blue",
  "point BC 0 -0.9",
  "point bc 0.832 -0.9",
  "segment BC bc red",
  "point AC 0 -1.8",
  "point ac 0.187 -1.8",
  "segment AC ac green",
]

[[step]]
text = "AB, BC are incommensurable in length, so AC is incommensurable with AB. The square on AC is the squares on AB, BC (medial) less twice the rectangle AB, BC (medial). With a rational line set out and these areas applied, the breadths are rational and incommensurable with it (X.22), and unlike in the sense that the breadth for the squares and the breadth for the rectangle are incommensurable (X.13). The remainder of the first breadth less the second is an apotome (X.73), so irrational (X.20 converse: a rational area applied to a rational line gives a rational breadth). Therefore the square on AC is irrational and AC is a second apotome of a medial."
