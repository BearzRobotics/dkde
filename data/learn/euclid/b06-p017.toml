id = "VI.17"
book = 6
order = 17
title = "Three proportional lines"
statement = "If three straight lines be proportional, the rectangle contained by the extremes is equal to the square on the mean; and, if the rectangle contained by the extremes be equal to the square on the mean, the three straight lines will be proportional."
proof = "Therefore if three straight lines be proportional, the rectangle contained by the extremes is equal to the square on the mean; and, if the rectangle contained by the extremes be equal to the square on the mean, the three straight lines will be proportional. Q.E.D."

[[step]]
text = "Let the three straight lines A, B, C be proportional, so that A is to B as B is to C (here 2, 4, 8). I say that the rectangle contained by A, C is equal to the square on B."
