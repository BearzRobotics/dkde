[[step]]
text = "Next, let the rectangle contained by A, C be equal to the square on B. I say that A is to B as B is to C. With the same construction, since the rectangle A, C is equal to the square on B, and the square on B is the rectangle B, D, the rectangle A, C is equal to the rectangle B, D. But if the rectangle contained by the extremes be equal to the rectangle contained by the means, the four straight lines are proportional (VI.16). Therefore A is to B as D is to C. But B is equal to D. Therefore A is to B as B is to C."
