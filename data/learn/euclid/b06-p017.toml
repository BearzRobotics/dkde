[[step]]
text = "Let D be made equal to B. Since A is to B as B is to C, and B is equal to D, A is to B as D is to C. But if four straight lines be proportional, the rectangle contained by the extremes is equal to the rectangle contained by the means (VI.16). Therefore the rectangle contained by A, C is equal to the rectangle contained by B, D. But the rectangle contained by B, D is the square on B, since B is equal to D. Therefore the rectangle contained by A, C is equal to the square on B."
