  "segment EF ef orange",
]

[[step]]
text = "For if not, there will be some numbers less than A, B which are in the same ratio with A, B. Let them be C, D. Since the least numbers of those which have the same ratio measure those which have the same ratio the same number of times, the greater the greater and the less the less (VII.20), C measures A the same number of times that D measures B. Let C measure A as many times as there are units in E. Then D also measures B according to the units in E. And since C measures A according to the units in E, E also measures A according to the units in C. For the same reason E also measures B according to the units in D. Therefore E measures A, B, which are prime to one another, which is impossible. Therefore there will be no numbers less than A, B which are in the same ratio with A, B. Therefore A, B are the least of those which have the same ratio with them."
