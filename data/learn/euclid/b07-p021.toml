id = "VII.21"
book = 7
order = 21
title = "Prime numbers are least"
statement = "Numbers prime to one another are the least of those which have the same ratio with them."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let A, B be numbers prime to one another (here 3 and 2). I say that A, B are the least of those which have the same ratio with them."
draw = [
