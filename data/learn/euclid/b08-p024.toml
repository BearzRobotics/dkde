id = "VIII.24"
book = 8
order = 24
title = "Ratio of squares: first square"
statement = "If two numbers have to one another the ratio which a square number has to a square number, and the first be square, the second will also be square."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "For let two numbers A, B have to one another the ratio which the square number C has to the square number D, and let A be square. I say that B is also square. (Here A = 36, B = 64 and the ratio is that of 9 to 16.)"
draw = [
