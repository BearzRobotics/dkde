  "segment D d orange",
]

[[step]]
text = "Since C, D are squares, C, D are similar plane numbers. Therefore one mean proportional number falls between C, D (VIII.18). And as C is to D, so is A to B. Therefore one mean proportional number falls between A, B also (VIII.8). But A is square. Therefore B is also square (VIII.22)."
