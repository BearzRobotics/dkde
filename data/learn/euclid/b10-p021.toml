id = "X.21"
book = 10
order = 21
title = "The medial line"
statement = "The rectangle contained by rational straight lines commensurable in square only is irrational, and the side of the square equal to it is irrational. Let the latter be called medial."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let A, B be rational straight lines commensurable in square only (here 1 and the square root of 2). I say that the rectangle contained by A, B is irrational, and the side of the square equal to it is irrational, namely the line called medial (here the fourth root of 2, about 1.189)."
