[[step]]
text = "Describe on A the square AC. Then AC is rational. Since A is incommensurable in length with B, the rectangle contained by A, B is to the square on A as B is to A (VI.1), which is not the ratio of a number to a number (X.8 backwards: incommensurable). So the rectangle is incommensurable with the square AC, which is rational; therefore it is irrational (here its area is the square root of 2). And the side of the square equal to it is irrational: for if it were rational its square would be rational. Call it medial, since it is a mean proportional between A and B (VI.13)."
