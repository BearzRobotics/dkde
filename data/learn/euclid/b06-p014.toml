[[step]]
text = "Let the parallelogram FE be completed. Since the parallelogram AB is equal to the parallelogram BC, and FE is another area, AB is to FE as BC is to FE (V.7). But AB is to FE as DB is to BE (VI.1), and BC is to FE as GB is to BF. Therefore also DB is to BE as GB is to BF. Therefore in the parallelograms AB, BC the sides about the equal angles are reciprocally proportional."
