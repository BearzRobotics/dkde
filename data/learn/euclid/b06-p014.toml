id = "VI.14"
book = 6
order = 14
title = "Equal parallelograms: reciprocal sides"
statement = "Equal parallelograms which have one angle equal to one angle have the sides about the equal angles reciprocally proportional; and those parallelograms which have one angle equal to one angle, and have the sides about the equal angles reciprocally proportional, are equal."
proof = "Therefore equal parallelograms which have one angle equal to one angle have the sides about the equal angles reciprocally proportional; and those parallelograms which have one angle equal to one angle, and have the sides about the equal angles reciprocally proportional, are equal. Q.E.D."

[[step]]
text = "Let AB, BC be equal and equiangular parallelograms having the angles at B equal, and let DB, BE be placed in a straight line; therefore FB, BG are also in a straight line (I.14). (Here the first parallelogram is 4 by 3, the second 6 by 2.) I say that in AB, BC the sides about the equal angles are reciprocally proportional, that is, DB is to BE as GB is to BF."
