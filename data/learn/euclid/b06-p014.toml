  "polygon B E H F orange",
]

[[step]]
text = "Next, let GB be to BF as DB is to BE. I say that the parallelogram AB is equal to the parallelogram BC. Since DB is to BE as GB is to BF, and DB is to BE as the parallelogram AB is to the parallelogram FE, and GB is to BF as the parallelogram BC is to the parallelogram FE, the parallelogram AB is to FE as BC is to FE (V.11). Therefore the parallelogram AB is equal to the parallelogram BC (V.9)."
