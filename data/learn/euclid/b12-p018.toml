[[step]]
text = "For if the sphere ABC has not to the sphere DEF the ratio triplicate of that which BC has to EF, the sphere ABC will have to some sphere either less than the sphere DEF or greater the ratio triplicate of that. First let it have that ratio to a less sphere GHK, and let DEF be conceived with the same centre as GHK. Inscribe in the greater sphere DEF a polyhedral solid which does not touch the lesser sphere GHK at its surface (XII.17), and inscribe in the sphere ABC a polyhedral solid similar to the solid in the sphere DEF. Then the polyhedral solid in ABC has to the polyhedral solid in DEF the ratio triplicate of that which BC has to EF (as the solids are divided into equal numbers of similar pyramids, and similar pyramids are in the triplicate ratio of the corresponding sides, XII.8). But the sphere ABC has to the sphere GHK the ratio triplicate of that which BC has to EF. Therefore, as the sphere ABC is to the sphere GHK, so is the polyhedral solid in the sphere ABC to the polyhedral solid in the sphere DEF. Alternately, as the sphere ABC is to the polyhedron in it, so is the sphere GHK to the polyhedron in the sphere DEF. But the sphere ABC is greater than the polyhedron in it. Therefore the sphere GHK is also greater than the polyhedron in the sphere DEF. But it is also less, since it is contained by it. Therefore the sphere ABC has not to a sphere less than DEF the ratio triplicate of that which the diameter BC has to EF. Similarly we can prove that neither has the sphere DEF to a sphere less than ABC the ratio triplicate of that which EF has to BC. I say next that neither has the sphere ABC to some sphere greater than DEF the ratio triplicate of that which BC has to EF. For, if possible, let it have that ratio to a greater sphere LMN. Then, inversely, the sphere LMN has to the sphere ABC the ratio triplicate of that which the diameter EF has to the diameter BC. But, as the sphere LMN is to the sphere ABC, so is the sphere DEF to some sphere less than the sphere ABC, since LMN is greater than DEF (XII.2 reasoning with the lemma). Therefore the sphere DEF has to some sphere less than ABC the ratio triplicate of that which EF has to BC, which was proved impossible. Therefore the sphere ABC has not to a sphere greater than DEF the ratio triplicate of that which BC has to EF. But it was proved that it has not to a less sphere. Therefore the sphere ABC has to the sphere DEF the ratio triplicate of that which BC has to EF."
