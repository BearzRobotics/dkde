id = "XII.18"
book = 12
order = 18
title = "Spheres are as the cubes of their diameters"
statement = "Spheres are to one another in the triplicate ratio of their respective diameters."
proof = "Therefore spheres are to one another in the triplicate ratio of their respective diameters. Q.E.D."

[[step]]
text = "Let the spheres ABC, DEF be conceived, and let BC, EF be their diameters. I say that the sphere ABC has to the sphere DEF the ratio triplicate of that which BC has to EF."
