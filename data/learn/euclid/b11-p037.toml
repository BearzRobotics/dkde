id = "XI.37"
book = 11
order = 37
title = "Proportional lines and similar solids"
statement = "If four straight lines be proportional, the parallelepipedal solids on them which are similar and similarly described will also be proportional; and, if the parallelepipedal solids on them which are similar and similarly described be proportional, the straight lines will themselves also be proportional."
proof = "Therefore if four straight lines be proportional, the parallelepipedal solids on them which are similar and similarly described will also be proportional; and, if the parallelepipedal solids on them which are similar and similarly described be proportional, the straight lines will themselves also be proportional. Q.E.D."

[[step]]
text = "Let the four straight lines AB, CD, EF, GH be proportional, so that AB is to CD as EF is to GH, and let the similar and similarly situated parallelepipedal solids KA, LC, ME, NG be described on AB, CD, EF, GH. I say that, as KA is to LC, so is ME to NG."
