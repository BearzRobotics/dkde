[[step]]
text = "Since the solid KA is similar to LC, KA has to LC the ratio triplicate of that which AB has to CD (XI.33). For the same reason ME has to NG the ratio triplicate of that which EF has to GH. And AB is to CD as EF is to GH. Therefore, as AK is to LC, so is ME to NG. Conversely, let the solid AK be to the solid LC as the solid ME is to the solid NG. I say that the straight line AB is to CD as EF is to GH. For again, since KA has to LC the ratio triplicate of that which AB has to CD, and ME has to NG the ratio triplicate of that which EF has to GH, and KA is to LC as ME is to NG, therefore also, as AB is to CD, so is EF to GH."
