id = "XI.15"
book = 11
order = 15
title = "Parallel planes from parallel lines"
statement = "If two straight lines meeting one another be parallel to two straight lines meeting one another, not in the same plane, the planes through them are parallel."
proof = "Therefore if two straight lines meeting one another be parallel to two straight lines meeting one another, not in the same plane, the planes through them are parallel. Q.E.D."

[[step]]
text = "For let the two straight lines AB, BC meeting one another be parallel to the two straight lines DE, EF meeting one another, not in the same plane. I say that the planes through AB, BC and DE, EF will not meet one another when produced."
