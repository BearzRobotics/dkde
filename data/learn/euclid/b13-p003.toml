id = "XIII.3"
book = 13
order = 3
title = "The square on the lesser segment"
statement = "If a straight line be cut in extreme and mean ratio, the square on the lesser segment added to the half of the greater segment is five times the square on the half of the greater segment."
proof = "Therefore if a straight line be cut in extreme and mean ratio, the square on the lesser segment added to the half of the greater segment is five times the square on the half of the greater segment. Q.E.D."

[[step]]
text = "Let any straight line AB be cut in extreme and mean ratio at the point C, AC being the greater segment, and let AC be bisected at D. I say that the square on the straight line made up of BC and CD is five times the square on DC."
