[[step]]
text = "Since AB has been cut in extreme and mean ratio at C, the rectangle AB, BC is equal to the square on AC (VI.17). But AB is AC and CB. Therefore the rectangle AC, CB together with the square on CB is equal to the square on AC."
draw = [
]

[[step]]
text = "The square on BC, CD taken as one line is the square on BC, together with twice the rectangle BC, CD, together with the square on CD (II.4). Twice the rectangle BC, CD is the rectangle BC, CA, since AC is double of CD. So that square is the square on BC plus the rectangle BC, CA plus the square on CD. But the square on BC plus the rectangle BC, CA is the square on AC, as was shown. Therefore the square on BC, CD is the square on AC plus the square on CD. And since AC is double of CD, the square on AC is four times the square on CD. Therefore the square on BC, CD is five times the square on DC."
