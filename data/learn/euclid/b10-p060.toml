id = "X.60"
book = 10
order = 60
title = "The square on the binomial"
statement = "The square on a binomial straight line, if applied to a rational straight line, produces as breadth the first binomial."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB be a binomial straight line divided into its terms at C, and let a rational straight line DE be set out. Apply to DE the rectangle DF equal to the square on AB, producing DG as breadth. I say that DG is the first binomial. Example: (2 + the square root of 3) squared is 7 + 4 times the square root of 3 (terms 7 and 6.928); the breadth is the sum of these terms, 13.928."
