[[step]]
text = "The square on AB is the squares on AC, CB together with twice the rectangle AC, CB (II.4). Apply to DE the areas equal to these in turn: the squares give breadths DH, MK, and twice the rectangle gives a breadth HK (so DG = DH + HK + KG split into the two terms). By X.20 and X.22 the breadths of rational areas are rational and commensurable with DE, and of medial areas rational and incommensurable with DE, so the terms of DG have the commensurabilities with DE which belong to the first binomial. The excess of the square on the greater term over the square on the less is a square on a line which is, or is not, commensurable with the greater, according to the type of AB (X.14 carries the ratios of squares over). Therefore DG is the first binomial, in the order shown (X.48 to X.53)."
