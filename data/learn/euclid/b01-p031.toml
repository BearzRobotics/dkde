id = "I.31"
book = 1
order = 32
title = "A parallel through a point"
statement = "Through a given point to draw a straight line parallel to a given straight line."
proof = "Therefore through the given point A the straight line EAF has been drawn parallel to the given straight line BC. Being what it was required to do."

[[step]]
text = "Let A be the given point, and BC the given straight line. It is required to draw through the point A a straight line parallel to the straight line BC."
draw = [
  "clear",
  "point A 0 3",
  "point B -4 0",
  "point C 4 0",
  "line B C blue",
]

[[step]]
text = "Let a point D be taken at random on BC, and let AD be joined."
draw = [
  "point D 1.5 0",
  "segment A D black",
]

[[step]]
text = "On the straight line DA, at the point A on it, let the angle DAE be constructed equal to the angle ADC (I.23), and let the straight line AF be produced in a straight line with EA."
draw = [
  "point E -3 3",
  "angle A D C orange fill",
  "angle D A E orange fill",
  "line A E red",
]

[[step]]
text = "Since the straight line AD, falling on the two straight lines BC, EF, has made the alternate angles EAD, ADC equal to one another, EF is parallel to BC (I.27). Therefore through the given point A the straight line EAF has been drawn parallel to the given straight line BC."
draw = [
]
