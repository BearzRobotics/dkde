[[step]]
text = "Let a plane DE be drawn through AB, let CE be the common section of the plane DE and the plane of reference, let a point F be taken at random on CE, and from F let FG be drawn in the plane DE at right angles to CE (I.11). Since AB is at right angles to the plane of reference, AB is also at right angles to all the straight lines which meet it and are in the plane of reference. Therefore it is at right angles to CE, so that the angle ABF is right. But the angle GFB is also right. Therefore AB is parallel to FG (I.28). And AB is at right angles to the plane of reference. Therefore FG is also at right angles to the plane of reference (XI.8). Now a plane is at right angles to a plane when the straight lines drawn in one of the planes at right angles to the common section of the planes are at right angles to the remaining plane (definition 4). And any straight line FG, drawn in the plane DE at right angles to the common section CE, was proved to be at right angles to the plane of reference. Therefore the plane DE is at right angles to the plane of reference. Similarly it can be proved that all the planes through AB are at right angles to the plane of reference."
draw = [
  "point F 1 0 0",
  "point Gg 1 0 3",
  "segment F Gg green",
]
