id = "XI.18"
book = 11
order = 18
title = "Planes through a perpendicular"
statement = "If a straight line be at right angles to any plane, all the planes through it will also be at right angles to the same plane."
proof = "Therefore if a straight line be at right angles to any plane, all the planes through it will also be at right angles to the same plane. Q.E.D."

[[step]]
text = "Let any straight line AB be at right angles to the plane of reference. I say that all the planes through AB are also at right angles to the plane of reference."
