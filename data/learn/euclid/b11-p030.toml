[[step]]
text = "Let NK, DH be produced and meet one another at R, and let FM, GE be produced to P, Q, and let AO, LP, CQ, BR be joined. Then the solid CM, of which the base is the parallelogram ACBL and the opposite face FDHM, is equal to the solid CP, of which the base is the parallelogram ACBL and the opposite face OQRP, for they are on the same base ACBL and of the same height, and the extremities of their edges which stand up are on the same straight lines FP, DR (XI.29). But the solid CP is equal to the solid CN, for they are on the same base ACBL and of the same height, and the extremities of their edges are on the same straight lines GQ, NR (XI.29). Therefore the solid CM is also equal to the solid CN."
