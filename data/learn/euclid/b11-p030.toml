id = "XI.30"
book = 11
order = 30
title = "Same base and height (edges not on the same lines)"
statement = "Parallelepipedal solids which are on the same base and of the same height, and in which the extremities of the edges which stand up are not on the same straight lines, are equal to one another."
proof = "Therefore parallelepipedal solids which are on the same base and of the same height, and in which the extremities of the edges which stand up are not on the same straight lines, are equal to one another. Q.E.D."

[[step]]
text = "Let the parallelepipedal solids CM, CN be on the same base AB and of the same height, but let the extremities of their edges which stand up, namely AF, AG, LM, LN, CD, CE, BH, BK, not be on the same straight lines. I say that the solid CM is equal to the solid CN."
