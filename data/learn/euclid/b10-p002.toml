title = "A test for incommensurability"
statement = "If, when the less of two unequal magnitudes is continually subtracted in turn from the greater, that which is left never measures the one before it, the magnitudes will be incommensurable."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB, CD be two unequal magnitudes (here a diagonal of a square and its side, 1.4142 and 1), and let the less be continually subtracted in turn from the greater: 1.4142 less 1 leaves 0.4142; 1 less twice 0.4142 leaves 0.1716; and so on, never ending. I say that AB, CD are incommensurable."
