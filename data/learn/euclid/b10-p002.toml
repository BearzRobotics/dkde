[[step]]
text = "If they were commensurable, some magnitude would measure both. Let it be E. Then CD, measuring BF, leaves AF less than itself; AF, measuring DG, leaves GC less than itself; and so on. E measures CD, which measures BF, so E measures BF; and E measures the whole AB, so it measures the remainder AF; and so on at each step, so E measures each of the remainders. But the remainders become less than E (X.1: continued subtraction of more than a half would leave less than any magnitude; here each remainder is less than half the preceding one). A magnitude cannot measure a smaller magnitude. This is absurd. Therefore AB, CD are incommensurable. (The same process on numbers must end, VII.1, so this is the test that separates lengths from numbers.)"
