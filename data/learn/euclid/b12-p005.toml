id = "XII.5"
book = 12
order = 5
title = "Pyramids of the same height: triangular bases"
statement = "Pyramids which are of the same height and have triangular bases are to one another as the bases."
proof = "Therefore pyramids which are of the same height and have triangular bases are to one another as the bases. Q.E.D."

[[step]]
text = "Let there be pyramids of the same height of which the triangles ABC, DEF are the bases and the points G, H the vertices. I say that, as the base ABC is to the base DEF, so is the pyramid ABCG to the pyramid DEFH."
