[[step]]
text = "Therefore the angle ABC is not unequal to the angle DEF; therefore it is equal. And the angle at A is also equal to the angle at D. Therefore the remaining angle at C is equal to the remaining angle at F. Therefore the triangle ABC is equiangular with the triangle DEF. The case where each of the angles at C, F is not less than a right angle is proved similarly: if BGC equals BCG, and C is not less than a right angle, the two angles BGC, BCG would be together not less than two right angles, which is impossible (I.17)."
