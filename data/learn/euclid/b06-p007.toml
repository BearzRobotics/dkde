[[step]]
text = "For if the angle ABC is unequal to the angle DEF, one of them is greater. Let ABC be the greater. On the straight line AB, and at the point B on it, let the angle ABG be constructed equal to the angle DEF (I.23). Since the angle A is equal to D, and the angle ABG to the angle DEF, the remaining angle AGB is equal to the remaining angle DFE (I.32). Therefore the triangle ABG is equiangular with the triangle DEF. Therefore AB is to BG as DE is to EF (VI.4). But, by hypothesis, as DE is to EF, so is AB to BC. Therefore AB has the same ratio to each of the straight lines BC, BG, so BC is equal to BG (V.9), and the angle BGC is equal to the angle BCG (I.5). But the angle at C is less than a right angle, so the angle BGC is less than a right angle, and therefore the angle AGB adjacent to it is greater than a right angle (I.13). But it was proved equal to the angle at F, which is less than a right angle, which is impossible."
