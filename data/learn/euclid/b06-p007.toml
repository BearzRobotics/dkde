id = "VI.7"
book = 6
order = 7
title = "One angle equal, sides about another proportional"
statement = "If two triangles have one angle equal to one angle, the sides about other angles proportional, and the remaining angles either both less or both not less than a right angle, the triangles will be equiangular and will have those angles equal, the sides about which are proportional."
proof = "Therefore if two triangles have one angle equal to one angle, the sides about other angles proportional, and the remaining angles either both less or both not less than a right angle, the triangles will be equiangular and will have those angles equal, the sides about which are proportional. Q.E.D."

[[step]]
text = "Let ABC, DEF be two triangles having one angle equal to one angle, the angle BAC to the angle EDF, the sides about other angles ABC, DEF proportional, so that AB is to BC as DE is to EF, and, first, each of the remaining angles at C, F less than a right angle. I say that the triangle ABC is equiangular with the triangle DEF, the angle ABC equal to the angle DEF, and the remaining angle at C to the remaining angle at F."
