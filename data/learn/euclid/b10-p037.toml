]

[[step]]
text = "Since AB is incommensurable in length with BC (they are commensurable in square only), AC is incommensurable with each (X.16). The square on AC is the squares on AB, BC with twice the rectangle AB, BC (II.4). The squares on AB, BC are medial (the squares on medial lines), commensurable with each other, and twice the rectangle is rational. A medial area added to a rational area gives an irrational area (as medial does not exceed rational by medial... X.26 and its companions). So the square on AC is irrational and AC is irrational. It is called a first bimedial."
