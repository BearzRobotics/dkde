title = "The first bimedial"
statement = "If two medial straight lines commensurable in square only and containing a rational rectangle be added together, the whole is irrational; and let it be called a first bimedial straight line."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let two medial straight lines AB, BC commensurable in square only and containing a rational rectangle be added together (here the fourth root of 2 and the fourth root of 8: their rectangle is 2). I say that AC is irrational, and is called a first bimedial straight line (its length is 2.871)."
