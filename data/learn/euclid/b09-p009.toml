[[step]]
text = "It was proved (IX.8) that the third from the unit, C, is square, and so are those which leave out one. I say that all the rest are squares. Since A, B, C are in continued proportion, and A, C are squares, B has to C the ratio of... B is square by hypothesis, and then, since B, C, D are in continued proportion with B and C squares, D is square (VIII.22: three in continued proportion, the first square, the third is square). Likewise E, and all the rest."
draw = [
]

[[step]]
text = "Next let B be a cube (here 1, 8, 64, 512). Then C is a cube, being the product of B by B (IX.4), D is the product of B by C, a cube by a cube, so a cube (IX.4), and so on. Therefore all the rest are cubes."
