id = "IX.9"
book = 9
order = 9
title = "Squares and cubes in a progression from the unit"
statement = "If as many numbers as we please beginning from an unit be in continued proportion, and the number after the unit be a square, all the rest will also be squares. And, if the number after the unit be a cube, all the rest will also be cubes."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let as many numbers as we please beginning from the unit A be in continued proportion, B, C, D, E, and let B, the number after the unit, be a square (here 1, 4, 16, 64, 256). I say that all the rest will also be squares."
