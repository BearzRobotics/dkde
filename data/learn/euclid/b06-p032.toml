id = "VI.32"
book = 6
order = 32
title = "Triangles placed together at an angle"
statement = "If two triangles having two sides proportional to two sides be placed together at one angle so that their corresponding sides are also parallel, the remaining sides of the triangles will be in a straight line."
proof = "Therefore if two triangles having two sides proportional to two sides be placed together at one angle so that their corresponding sides are also parallel, the remaining sides of the triangles will be in a straight line. Q.E.D."

[[step]]
text = "Let ABC, DCE be two triangles having the two sides BA, AC proportional to the two sides CD, DE, so that AB is to AC as DC is to DE, and AB parallel to DC and AC to DE. I say that BC is in a straight line with CE."
draw = [
