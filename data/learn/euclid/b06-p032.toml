  "polygon D C E red fill",
]

[[step]]
text = "Since AB is parallel to DC, and the straight line AC falls on them, the alternate angles BAC, ACD are equal to one another (I.29). For the same reason the angle CDE is also equal to the angle ACD. Therefore the angle BAC is equal to the angle CDE. And since the triangles ABC, DCE have one angle at A equal to one angle at D and the sides about them proportional, so that AB is to AC as DC is to DE, the triangle ABC is equiangular with the triangle DCE (VI.6). Therefore the angle ABC is equal to the angle DCE."
draw = [
  "angle B A C orange fill",
  "angle A C D orange fill",
  "angle C D E orange fill",
]

[[step]]
text = "But the angle ACD was proved equal to the angle BAC. Therefore the whole angle ACE is equal to the two angles ABC, BAC. Add the angle ACB to each. Then the angles ACE, ACB are equal to the angles BAC, ACB, CBA. But the angles BAC, ABC, ACB are equal to two right angles (I.32). Therefore the angles ACE, ACB are also equal to two right angles. Therefore with a straight line AC, and at the point C on it, the two straight lines BC, CE not lying on the same side make the adjacent angles ACE, ACB equal to two right angles. Therefore BC is in a straight line with CE (I.14)."
draw = [
  "segment B E black",
]
