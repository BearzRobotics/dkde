id = "VII.18"
book = 7
order = 18
title = "Two numbers multiplying a number"
statement = "If two numbers by multiplying any number make certain numbers, the numbers so produced will have the same ratio as the multiplied."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let two numbers A, B by multiplying any number C make D, E. I say that A is to B as D is to E. (Here 3 times 4 is 12 and 5 times 4 is 20; and 3 : 5 = 12 : 20.)"
