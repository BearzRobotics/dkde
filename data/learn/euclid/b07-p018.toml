[[step]]
text = "Since A by multiplying C has made D, C by multiplying A has also made D (VII.16). For the same reason C by multiplying B has made E. Therefore the number C by multiplying the two numbers A, B has made D, E. Therefore, as A is to B, so is D to E (VII.17)."
