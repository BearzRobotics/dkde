[[step]]
text = "Since BG:C = EH:F, inversely C:BG = F:EH. Since AB:C = DE:F, and C:BG = F:EH, ex aequali AB:BG = DE:EH (V.22). Since the magnitudes are proportional separando, they will also be proportional componendo (V.18): AG:GB = DH:HE. But GB:C = HE:F. Therefore ex aequali AG:C = DH:F (V.22)."
