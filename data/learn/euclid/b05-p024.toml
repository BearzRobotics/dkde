id = "V.24"
book = 5
order = 24
title = "Adding ratios"
statement = "If a first magnitude have to a second the same ratio as a third has to a fourth, and a fifth have to the second the same ratio as a sixth to the fourth, the first and fifth added together will have to the second the same ratio as the third and sixth added together have to the fourth."
proof = "Therefore if a first magnitude have to a second the same ratio as a third has to a fourth, and a fifth have to the second the same ratio as a sixth to the fourth, the first and fifth added together will have to the second the same ratio as the third and sixth added together have to the fourth. Q.E.D."

[[step]]
text = "Let a first magnitude AB have to a second C the same ratio as a third DE has to a fourth F, and let a fifth BG have to the second C the same ratio as a sixth EH has to the fourth F. I say that the first and fifth added together, AG, will have to the second C the same ratio as the third and sixth added together, DH, have to the fourth F."
