id = "I.6"
book = 1
order = 7
title = "Equal angles, equal sides"
statement = "If in a triangle two angles be equal to one another, the sides which subtend the equal angles will also be equal to one another."
proof = "Therefore if in a triangle two angles be equal to one another, the sides which subtend the equal angles will also be equal to one another. Q.E.D."

[[step]]
text = "Let ABC be a triangle having the angle ABC equal to the angle ACB. It is required to prove that the side AB is also equal to the side AC."
draw = [
  "clear",
  "point A 0.400 3",
  "point B -2 0",
  "point C 2 0",
  "segment A B",
  "segment A C",
  "segment B C",
  "angle A B C green fill",
  "angle A C B green fill",
]

[[step]]
text = "Suppose AB is not equal to AC. Then one of them is greater. Let AB be the greater. From AB the greater cut off DB equal to AC the less (I.3), and let DC be joined."
draw = [
  "point D 0.124 2.655",
  "segment D C orange",
]

[[step]]
text = "Since DB is equal to AC, and BC is common, the two sides DB, BC are equal to the two sides AC, CB respectively, and the angle DBC is equal to the angle ACB. Therefore the base DC is equal to the base AB, and the triangle DBC is equal to the triangle ACB (I.4)."
draw = [
  "polygon D B C blue fill",
]

[[step]]
text = "That is, the less is equal to the greater, which is absurd. Therefore AB is not unequal to AC; that is, it is equal to it."
draw = [
  "polygon A B C red",
]
