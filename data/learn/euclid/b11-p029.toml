id = "XI.29"
book = 11
order = 29
title = "Same base and height (edges on the same lines)"
statement = "Parallelepipedal solids which are on the same base and of the same height, and in which the extremities of the edges which stand up are on the same straight lines, are equal to one another."
proof = "Therefore parallelepipedal solids which are on the same base and of the same height, and in which the extremities of the edges which stand up are on the same straight lines, are equal to one another. Q.E.D."

[[step]]
text = "Let the parallelepipedal solids CM, CN be on the same base AB and of the same height, and let the extremities of their edges which stand up, namely AG, AF, LM, LN, CD, CE, BH, BK, be on the same straight lines FN, DK. I say that the solid CM is equal to the solid CN."
