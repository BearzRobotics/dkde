[[step]]
text = "Since each of the figures CH, CK is a parallelogram, CB is equal to each of the straight lines DH, EK (I.34). Therefore DH is also equal to EK. Let EH be subtracted from each. Then the remainder DE is equal to the remainder HK. Therefore the triangle DCE is also equal to the triangle HBK, and the parallelogram DG to the parallelogram HN (I.8, I.36). For the same reason the triangle AFG is equal to the triangle MLN. But the parallelogram CF is equal to the parallelogram BM, and CG to BN, for they are opposite. Therefore the prism contained by the two triangles AFG, DCE and the three parallelograms AD, DG, CG is equal to the prism contained by the two triangles MLN, HBK and the three parallelograms BM, HN, BN. Let the solid, of which the base is the parallelogram AB and its opposite FDEG, be added to each. Then the whole parallelepipedal solid CM is equal to the whole parallelepipedal solid CN."
