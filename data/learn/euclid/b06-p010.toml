id = "VI.10"
book = 6
order = 10
title = "To cut a line like another"
statement = "To cut a given uncut straight line similarly to a given cut straight line."
proof = "Therefore the given uncut straight line AB has been cut similarly to the given cut straight line AC. Being what it was required to do."

[[step]]
text = "Let AB be the given uncut straight line, and AC the straight line cut at the points D, E, and let them be so placed as to contain any angle. Let CB be joined, and through D, E let DF, EG be drawn parallel to BC, and through D let DHK be drawn parallel to AB."
