id = "X.56"
book = 10
order = 56
title = "The area on the third binomial"
statement = "If an area be contained by a rational straight line and the third binomial, the side of the square equal to the area is the irrational straight line which is called second bimedial."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let the area be contained by the rational straight line AB (here 1) and the third binomial AD, divided into its terms at E, AE being the greater (here AD = 2.639). I say that the side of the square equal to the area is the second bimedial (here 1.624)."
