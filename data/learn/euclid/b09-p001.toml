id = "IX.1"
book = 9
order = 1
title = "Similar plane numbers multiply to a square"
statement = "If two similar plane numbers by multiplying one another make some number, the product will be a square."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let A, B be two similar plane numbers (here 6 = 2 by 3 and 24 = 4 by 6), and let A by multiplying B make C (144). I say that C is a square."
