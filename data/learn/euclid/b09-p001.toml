[[step]]
text = "Let A by multiplying itself make D (36). Then D is a square. Since A by multiplying itself has made D and by multiplying B has made C, A is to B as D is to C (VII.17). And since A, B are similar plane numbers, one mean proportional number falls between them (VIII.18). But if numbers between two numbers fall in continued proportion, as many fall between those which have the same ratio (VIII.8). So one mean proportional falls between D and C. But D is a square. Therefore C is also a square (VIII.22)."
