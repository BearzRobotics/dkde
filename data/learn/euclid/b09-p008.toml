[[step]]
text = "Since the unit is to B as B is to C, the unit measures B as often as B measures C; and the unit measures B according to the units in B, so B measures C according to the units in B. That is, B by multiplying itself has made C. Therefore C is a square. Since B, C, D are in continued proportion and C is square, the terms two places on are also squares (VIII.22), and so on: C, E, G are squares."
draw = [
]

[[step]]
text = "Again, B by multiplying C has made D, and C is a square, so D is the product of B and the square of B: D is a cube (VII definition 19; here 2 by 4 by 2 is 8, which is 2 times 2 times 2). Since the unit, B, C, D are in continued proportion and the first of them, the unit, is a cube, so is the fourth D (VIII.23), and so are those which leave out two further. The seventh, G, is both the third in the series of squares and the fourth in the series of cubes, and so is at once a cube and a square (here 64 is 8 squared and 4 cubed)."
