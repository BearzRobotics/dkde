id = "IX.8"
book = 9
order = 8
title = "The unit and a geometric progression"
statement = "If as many numbers as we please beginning from an unit be in continued proportion, the third from the unit will be square, and so will those which successively leave out one; the fourth will be cube, and so will all those which leave out two; and the seventh will be at once cube and square, and so will those which leave out five."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let as many numbers as we please beginning from the unit A be in continued proportion, B, C, D, E, F, G (here 1, 2, 4, 8, 16, 32, 64). I say that the third from the unit, C, is a square, and so are all those which leave out one; the fourth, D, is a cube, and so are all those which leave out two; and the seventh, G, is at once a cube and a square."
