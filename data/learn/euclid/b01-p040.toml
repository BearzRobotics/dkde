id = "I.40"
book = 1
order = 41
title = "Equal triangles on equal bases"
statement = "Equal triangles which are on equal bases and on the same side are also in the same parallels."
proof = "Therefore equal triangles which are on equal bases and on the same side are also in the same parallels. Q.E.D."

[[step]]
text = "Let ABC, CDE be equal triangles on equal bases BC, CE and on the same side. I say that they are also in the same parallels: AD is parallel to BE."
draw = [
  "clear",
  "point A 1.5 2.5",
  "point B 0 0",
  "point C 3 0",
  "point D 5.5 2.5",
  "point E 4 0",
  "point F 7 0",
  "segment B F black",
  "polygon A B C blue",
  "polygon D E F red",
  "segment A D green",
]

[[step]]
text = "For if not, let AG be drawn through A parallel to BF (I.31), and let GF be joined. Then the triangle ABC is equal to the triangle GEF, for they are on equal bases and in the same parallels (I.38)."
draw = [
  "point G 4.5 2.5",
  "line A G orange",
  "segment G F orange",
]

[[step]]
text = "But ABC is equal to DEF. Therefore DEF is also equal to GEF, the greater to the less, which is impossible. Therefore AG is not parallel to BF. Similarly neither is any other except AD. Therefore AD is parallel to BF."
