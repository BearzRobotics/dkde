[[step]]
text = "Let A by multiplying B make G. Then, since A by multiplying itself has made D and B has made G, A is to B as D is to G (VII.17). Also A is to B as G is to E (VII.18). So D, G, E are in proportion. Similarly E, H, F are in proportion, where H is B times C. Since A is to B as B is to C, the products G and H are in the same ratio: ex aequali D is to E as E is to F. Likewise, if A, B, C by multiplying D, E, F make cubes, the cubes are in continued proportion, by the same reasoning."
