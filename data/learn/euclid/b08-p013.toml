id = "VIII.13"
book = 8
order = 13
title = "Squares and cubes of a progression"
statement = "If there be as many numbers as we please in continued proportion, and each by multiplying itself make some number, the products will be proportional; and, if the original numbers by multiplying the products make certain numbers, the latter will also be proportional."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let there be as many numbers as we please in continued proportion, A, B, C (here 2, 4, 8), so that A is to B as B is to C, and let A, B, C by multiplying themselves make D, E, F (4, 16, 64). I say that D, E, F are in continued proportion."
