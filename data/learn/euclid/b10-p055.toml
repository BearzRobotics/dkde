  "segment AB ab green",
]

[[step]]
text = "Bisect ED at F, and apply to AE a rectangle AG, GE equal to the square on EF and deficient by a square (VI.28). Let x be the side of the square equal to the rectangle AB, AG, and y the side of the square equal to the rectangle AB, GE. Then x squared plus y squared is the rectangle AB, AE, and twice xy is twice AB times EF, which is the rectangle AB, ED. So the square on x + y is the rectangle AB, AE plus the rectangle AB, ED, that is, the rectangle AB, AD: the side of the square equal to the area is x + y. Here x and y are medial lines commensurable in square only, and xy = AB times EF is rational (EF, half of the lesser term, is commensurable with AB), so x + y is a first bimedial (X.37). Therefore the side of the area is the first bimedial."
