id = "X.55"
book = 10
order = 55
title = "The area on the second binomial"
statement = "If an area be contained by a rational straight line and the second binomial, the side of the square equal to the area is the irrational straight line which is called first bimedial."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let the area be contained by the rational straight line AB (here 1) and the second binomial AD, divided into its terms at E, AE being the greater (here AD = 2.155). I say that the side of the square equal to the area is the first bimedial (here 1.468)."
draw = [
  "clear",
