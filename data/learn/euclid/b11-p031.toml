[[step]]
text = "First let the edges which stand up, HK, BE, AG, LM, PQ, DF, CX, OR, be at right angles to the bases AB, CD, and let the straight line RT be placed in a straight line with CT. Construct at the point T on the straight line RT the angle RTS equal to the angle ABL (I.23), and make RT equal to AB and TS equal to BL. Let the base RS and the solid YU be completed. Since the two sides RT, TS are equal to the two sides AB, BL and contain equal angles, the parallelogram RS is equal and similar to the parallelogram HL. Since AB is equal to RT, and BE to TU, and they contain right angles, the parallelogram RU is equal and similar to the parallelogram AE. For the same reason LE is equal and similar to SU. Therefore three parallelograms of the solid AE are equal and similar to three parallelograms of the solid YU. But they are equal and similar to their opposites. Therefore the whole parallelepipedal solid AE is equal to the whole parallelepipedal solid YU (XI definition 10). Let DT, YS be drawn through and meet one another at ε, let aTb be drawn through T parallel to DC, let PD be produced to a, and let the solids YU... complete the construction. Then the solid YU is equal to the solid ε U... and so on, until the solid AE is shown equal to the solid CF, since the solids on the same base and of the same height whose edges stand up on the same straight lines are equal (XI.29, XI.30)."
