id = "XI.31"
book = 11
order = 31
title = "Equal bases, same height"
statement = "Parallelepipedal solids which are on equal bases and of the same height are equal to one another."
proof = "Therefore parallelepipedal solids which are on equal bases and of the same height are equal to one another. Q.E.D."

[[step]]
text = "Let the parallelepipedal solids AE, CF be on equal bases AB, CD and of the same height. I say that the solid AE is equal to the solid CF."
