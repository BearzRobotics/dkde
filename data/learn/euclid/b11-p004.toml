id = "XI.4"
book = 11
order = 4
title = "A line at right angles to a plane"
statement = "If a straight line be set up at right angles to two straight lines which cut one another, at their common point of section, it will also be at right angles to the plane through them."
proof = "Therefore if a straight line be set up at right angles to two straight lines which cut one another, at their common point of section, it will also be at right angles to the plane through them. Q.E.D."

[[step]]
text = "For let any straight line EF be set up at right angles to two straight lines AB, CD which cut one another at E, at the point E. I say that EF is also at right angles to the plane through AB, CD."
draw = [
