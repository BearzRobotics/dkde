[[step]]
text = "Let AE, EB, CE, ED be cut off equal to one another, and through E let any straight line GEH be drawn across in the plane through AB, CD. Let AD, CB be joined, and from any point G on GH let GF be drawn; join also AF, FD, FC, FB, FH."
draw = [
  "point G -2.5 2 0",
