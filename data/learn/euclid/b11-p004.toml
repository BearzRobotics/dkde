]

[[step]]
text = "Since the two sides AE, ED are equal to the two sides BE, EC, and they contain equal angles, the base AD is equal to the base CB, and the triangle AED is equal to the triangle CEB (I.4). Therefore the angle DAG is equal to the angle EBH, and the angle AED to the angle BEH, so that AEG, BEH are two triangles having two angles equal to two angles and one side equal to one side. Therefore they will also have the remaining sides equal, so GE is equal to EH and AG to BH. And since AE is equal to EB and FE is at right angles, FA is equal to FB; for the same reason FC is equal to FD. Since AD is equal to BC and FA to FB, the two sides FA, AD are equal to the two sides FB, BC, and the base FD is equal to the base FC. Therefore the angle FAD is equal to the angle FBC. Again, since AG was proved equal to BH, and FA is equal to FB, the two sides FA, AG are equal to FB, BH, and the angles are equal; therefore the base FG is equal to the base FH. Since GE is equal to EH, and EF is common, and the base FG is equal to the base FH, the angle GEF is equal to the angle HEF (I.8). Therefore each of the angles GEF, HEF is right. Therefore FE is at right angles to GH, which is any straight line drawn through E in the plane. Similarly FE will make right angles with all the straight lines which meet it and are in the plane of reference. But a straight line is at right angles to a plane when it makes right angles with all the straight lines which meet it and are in that plane. Therefore FE is at right angles to the plane."
