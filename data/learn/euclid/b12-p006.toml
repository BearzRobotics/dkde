[[step]]
text = "Let AC, AD, FH, FK be joined. Since ABCM, ACDM are two pyramids with triangular bases and the same height, they are to one another as their bases (XII.5). Therefore, as the base ABC is to the base ACD, so is the pyramid ABCM to the pyramid ACDM. And, componendo, as the base ABCD is to the base ACD, so is the pyramid ABCDM to the pyramid ACDM. But, as the base ACD is to the base ADE, so is the pyramid ACDM to the pyramid ADEM. Therefore, ex aequali, as the base ABCD is to the base ADE, so is the pyramid ABCDM to the pyramid ADEM, and again, componendo, as the base ABCDE is to the base ADE, so is the pyramid ABCDEM to the pyramid ADEM. Similarly, as the base FGHKL is to the base FGH, so is the pyramid FGHKLN to the pyramid FGHN. And since ADEM, FGHN are pyramids with triangular bases and the same height, as the base ADE is to the base FGH, so is the pyramid ADEM to the pyramid FGHN. Therefore, ex aequali, as the base ABCDE is to the base FGHKL, so is the pyramid ABCDEM to the pyramid FGHKLN."
