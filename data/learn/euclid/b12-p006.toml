id = "XII.6"
book = 12
order = 6
title = "Pyramids of the same height: polygonal bases"
statement = "Pyramids which are of the same height and have polygonal bases are to one another as the bases."
proof = "Therefore pyramids which are of the same height and have polygonal bases are to one another as the bases. Q.E.D."

[[step]]
text = "Let there be pyramids of the same height of which the polygons ABCDE, FGHKL are the bases and the points M, N the vertices. I say that, as the base ABCDE is to the base FGHKL, so is the pyramid ABCDEM to the pyramid FGHKLN."
