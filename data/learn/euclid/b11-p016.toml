[[step]]
text = "For, if not, EF, GH when produced will meet either in the direction of F, H or of E, G. Let them be produced, as in the direction of F, H, and let them meet at K. Since EFK is in the plane AB, all the points on EFK are also in the plane AB. But K is one of the points on the straight line EFK. Therefore K is in the plane AB. For the same reason K is also in the plane CD. Therefore the planes AB, CD when produced will meet. But they do not meet, since they are by hypothesis parallel. Therefore the straight lines EF, GH when produced in the direction of F, H will not meet. Similarly we can prove that neither will EF, GH when produced in the direction of E, G meet. But straight lines which do not meet in either direction are parallel. Therefore EF is parallel to GH."
