id = "XI.16"
book = 11
order = 16
title = "Sections of parallel planes"
statement = "If two parallel planes be cut by any plane, their common sections are parallel."
proof = "Therefore if two parallel planes be cut by any plane, their common sections are parallel. Q.E.D."

[[step]]
text = "For let the two parallel planes AB, CD be cut by the plane EFGH, and let their common sections with it be EF, GH. I say that EF is parallel to GH."
