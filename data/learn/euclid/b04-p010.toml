[[step]]
text = "Let the circle ACD be circumscribed about the triangle ACD (IV.5). Since the rectangle AB, BC is equal to the square on AC, and AC is equal to BD, the rectangle AB, BC is equal to the square on BD. And since a point B has been taken outside the circle ACD, and from B the two straight lines BA, BD have fallen on the circle ACD, of which one cuts it and the other falls on it, and the rectangle AB, BC is equal to the square on BD, BD touches the circle ACD (III.37)."
draw = [
  "point Q 1.236 1.701",
  "circle Q A blue",
]

[[step]]
text = "Since BD touches the circle, and DC is drawn across from the point of contact D, the angle BDC is equal to the angle DAC in the alternate segment of the circle (III.32). Since the angle BDC is equal to the angle DAC, add the angle CDA to each. Then the whole angle BDA is equal to the two angles CDA, DAC. But the exterior angle BCD is equal to the angles CDA, DAC (I.32). Therefore the angle BDA is also equal to the angle BCD. But the angle BDA is equal to the angle CBD, since the side AD is equal to AB (I.5). So the angle DBA is equal to the angle BCD. Therefore the three angles BDA, DBA, BCD are equal to one another. And since the angle DBC is equal to the angle BCD, the side BD is equal to the side DC (I.6). But BD was supposed equal to CA. Therefore CA is also equal to CD, so the angle CDA is equal to the angle DAC (I.5). Therefore the angles CDA, DAC are double of the angle DAC. But the angle BCD is equal to the angles CDA, DAC. Therefore the angle BCD is also double of the angle DAC. But the angle BCD is equal to each of the angles BDA, DBA. Therefore each of the angles DBA, BDA is also double of the angle DAB. Therefore the isosceles triangle ABD has been constructed having each of the angles at the base BD double of the remaining one."
