title = "Isosceles triangle with angles 72, 72, 36"
statement = "To construct an isosceles triangle having each of the angles at the base double of the remaining one."
proof = "Therefore the isosceles triangle ABD has been constructed having each of the angles at B, D double of the angle at A. Being what it was required to do."

[[step]]
text = "Let any straight line AB be taken, and let it be cut at the point C so that the rectangle contained by AB, BC is equal to the square on CA (II.11). With centre A and distance AB let the circle BDE be described, and in the circle BDE let BD be fitted equal to the straight line AC, which is not greater than the diameter of the circle BDE (IV.1). Let AD, DC be joined."
