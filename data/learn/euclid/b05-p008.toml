[[step]]
text = "Since AB is greater than C, make BE equal to C. Then the less of AE, EB, multiplied, will some time be greater than D (definition 4). Take equimultiples FG, GH of AE, EB which exceed D, and take K the multiple of D which first exceeds GH, so that K is the least multiple of D that exceeds GH."
draw = [
]

[[step]]
text = "Then GH is not less than K... and FG is greater than D. Therefore the whole FH is greater than D, K together; but FH exceeds K while the equimultiple of C does not exceed K. So there exist equimultiples of AB and C and a multiple of D such that the multiple of AB exceeds the multiple of D but the multiple of C does not. Therefore AB has to D a greater ratio than C has to D (definition 7). Similarly D has to C a greater ratio than D has to AB."
