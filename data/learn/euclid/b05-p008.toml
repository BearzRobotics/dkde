id = "V.8"
book = 5
order = 8
title = "The greater has the greater ratio"
statement = "Of unequal magnitudes, the greater has to the same a greater ratio than the less has; and the same has to the less a greater ratio than it has to the greater."
proof = "Therefore of unequal magnitudes the greater has to the same a greater ratio than the less has; and the same has to the less a greater ratio than it has to the greater. Q.E.D."

[[step]]
text = "Let AB, C be unequal magnitudes and AB the greater, and let D be another magnitude. I say that AB has to D a greater ratio than C has to D, and D has to C a greater ratio than it has to AB."
