id = "VIII.26"
book = 8
order = 26
title = "Similar plane numbers"
statement = "Similar plane numbers have to one another the ratio which a square number has to a square number."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let A, B be similar plane numbers (24, 54). I say that A has to B the ratio which a square number has to a square number."
