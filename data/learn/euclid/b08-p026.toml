  "segment D d orange",
]

[[step]]
text = "Since A, B are similar plane numbers, one mean proportional number falls between A, B (VIII.18). Let it be C (36). Let D, E, F be the least numbers in continued proportion in the ratio of A, C, B (VIII.2; here 4, 6, 9). Then D, F are squares (VIII.2 corollary). Since D, E, F are in the same ratio with A, C, B, and equal in multitude, ex aequali as A is to B, so is D to F. But D, F are squares. Therefore A has to B the ratio which a square number has to a square number."
