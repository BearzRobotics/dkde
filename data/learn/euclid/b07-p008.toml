[[step]]
text = "Let GH be made equal to AB. Then whatever parts GH is of CD, the same parts is AE of CF. Let GH be divided into the parts of CD, GK, KH, and AE into the parts of CF, AL, LE. Then the multitude of GK, KH is equal to the multitude of AL, LE. Since whatever part GK is of CD, the same part is AL of CF, and CD is greater than CF, GK is also greater than AL. Let GM be made equal to AL. Then whatever part GK is of CD, the same part is GM of CF. Therefore the remainder MK is the same part of the remainder FD that the whole GK is of the whole CD (VII.7). Again, whatever part KH is of CD, the same part is EL of CF; and CD is greater than CF, so KH is greater than EL. Let KN be made equal to EL. Then NH is the same part of FD that KH is of CD. So MK and NH are the same parts of FD that GH is of CD. But GH is equal to AB, and MK, NH together are equal to EB, since GM is equal to AL and KN to LE. Therefore EB is the same parts of FD that AB is of CD."
