id = "VII.8"
book = 7
order = 8
title = "Parts taken from parts"
statement = "If a number be the same parts of a number that a number taken away is of a number taken away, the remainder will also be the same parts of the remainder that the whole is of the whole."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let the number AB be the same parts of the number CD that AE taken away is of CF taken away. I say that the remainder EB is also the same parts of the remainder FD that the whole AB is of the whole CD."
draw = [
  "clear",
