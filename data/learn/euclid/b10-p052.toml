  "segment AB ab blue",
  "point BC 0 -0.9",
  "point bc 0.7 -0.9",
  "segment BC bc red",
  "point AC 0 -1.8",
  "point ac 1.912 -1.8",
  "segment AC ac green",
]

[[step]]
text = "Construction. Proceed as for the second with such numbers. Then the terms of the binomial are two rational straight lines commensurable in square only, with the stated relation to the assigned rational line and the stated excess of squares (X.29 and X.30 give the excess; X.6 and X.9 the commensurability). Then the sum is the fifth binomial straight line, as defined."
