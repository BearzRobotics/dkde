title = "To find the fifth binomial"
statement = "To find the fifth binomial straight line."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "The fifth binomial is the binomial with the lesser term commensurable in length with the assigned rational line, and the square on the greater exceeding the square on the less by the square on a line incommensurable with the greater. It is required to find one. (Example: the terms the square root of 3 and 1 (the difference of squares is 2); the whole is 2.732.)"
