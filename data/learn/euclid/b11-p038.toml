[[step]]
text = "Let DU, UE, BS, SG be joined. Since DO is parallel to PE, the alternate angles DOU, UPE are equal to one another (I.29). And since DO is equal to PE, and OU to UP, and they contain equal angles, the base DU is equal to the base UE, and the triangle DOU is equal to the triangle PUE, and the remaining angles are equal to the remaining angles. Therefore the angle OUD is equal to the angle PUE. Therefore DUE is a straight line (I.14). For the same reason BSG is also a straight line, and BS is equal to SG. Since CA is equal and parallel to DB, but CA is also equal and parallel to EG, DB is also equal and parallel to EG (XI.9). And the straight lines DE, BG join them. Therefore DE is parallel to BG (I.33). Therefore the angle EDT is equal to the angle BGT, for they are alternate (I.29), and the angle DTU is equal to the angle GTS (I.15). Therefore DTU, GTS are two triangles having two angles equal to two angles and one side equal to one side, namely that subtending one of the equal angles, DU equal to GS, for they are halves of DE, BG. Therefore they will also have the remaining sides equal to the remaining sides. Therefore DT is equal to TG, and UT to TS."
