id = "XI.38"
book = 11
order = 38
title = "Bisected faces of a cube"
statement = "If the sides of the opposite planes of a cube be bisected, and planes be carried through the points of section, the common section of the planes and the diameter of the cube bisect one another."
proof = "Therefore if the sides of the opposite planes of a cube be bisected, and planes be carried through the points of section, the common section of the planes and the diameter of the cube bisect one another. Q.E.D."

[[step]]
text = "For let the sides of the opposite planes CF, AH of the cube AF be bisected at the points K, L, M, N, O, Q, P, R, and let the planes KN, OR be carried through the points of section. Let US be the common section of the planes, and DG a diameter of the cube AF. I say that UT is equal to TS, and DT to TG."
