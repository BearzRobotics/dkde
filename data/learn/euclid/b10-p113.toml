[[step]]
text = "Let GH be the binomial whose terms are BC, CD. The product of the binomial and the apotome is the difference of the squares on BC, CD, a rational area. So the square on A has to it the ratio of a number to a number; the breadth EF has to the binomial GH the ratio of a number to a number, so EF is commensurable with GH, with terms commensurable with BC, CD in the same ratio. A line commensurable with a binomial is a binomial of the same order (X.66). Therefore EF is a binomial of the same order as the apotome."
