title = "A rational square applied to an apotome"
statement = "The square on a rational straight line, if applied to an apotome, produces as breadth a binomial whose terms are commensurable with the terms of the apotome and in the same ratio; and further the binomial so arising has the same order as the apotome."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let A be a rational straight line (1) and BD an apotome with the whole BC and annex CD (here 2 less the square root of 3). Apply to BD the rectangle equal to the square on A, producing the breadth EF. I say that EF is a binomial whose terms are commensurable with BC, CD in the same ratio, and of the same order (here 1 divided by 0.268 is 2 plus the square root of 3)."
draw = [
