[[step]]
text = "Since the two parallel planes BG, CE are cut by the plane AC, their common sections are parallel (XI.16). Therefore AB is parallel to DC. Again, since the two parallel planes BF, AE are cut by the plane AC, their common sections are parallel. Therefore BC is parallel to AD. But AB was also proved parallel to DC. Therefore AC is a parallelogram. Similarly we can prove that each of DE, FG, GB, BF, AE is a parallelogram."
draw = [
]

[[step]]
text = "Let AH, DF be joined. Since AB is parallel to DC, and BH to CF, the two straight lines AB, BH which meet one another are parallel to the two straight lines DC, CF which meet one another, not in the same plane. Therefore they will contain equal angles (XI.10). Therefore the angle ABH is equal to the angle DCF. Since the two sides AB, BH are equal to the two sides DC, CF (I.34), and the angle ABH is equal to the angle DCF, the base AH is equal to the base DF, and the triangle ABH is equal to the triangle DCF (I.4). And the parallelogram BG is double of the triangle ABH, and the parallelogram CE is double of the triangle DCF (I.34). Therefore the parallelogram BG is equal to the parallelogram CE. Similarly we can prove that AC is equal to GF, and AE to BF."
