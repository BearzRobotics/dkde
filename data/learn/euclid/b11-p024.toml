id = "XI.24"
book = 11
order = 24
title = "Opposite faces of a parallelepiped"
statement = "If a solid be contained by parallel planes, the opposite planes in it are equal and parallelogrammic."
proof = "Therefore if a solid be contained by parallel planes, the opposite planes in it are equal and parallelogrammic. Q.E.D."

[[step]]
text = "For let the solid CDHG be contained by the parallel planes AC, GF, AH, DF, BF, AE. I say that the opposite planes in it are equal and parallelogrammic."
