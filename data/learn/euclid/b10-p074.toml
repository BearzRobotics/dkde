title = "The first apotome of a medial"
statement = "If from a medial straight line there be subtracted a medial straight line which is commensurable with the whole in square only, and which contains with the whole a rational rectangle, the remainder is irrational; and let it be called a first apotome of a medial straight line."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB be a medial straight line and BC a medial straight line commensurable with it in square only, such that the rectangle AB, BC is rational (here the fourth root of 8 and the fourth root of 2, whose rectangle is 2). I say that the remainder AC is irrational, and is called a first apotome of a medial straight line (here 0.493)."
