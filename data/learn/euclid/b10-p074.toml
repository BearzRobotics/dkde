[[step]]
text = "AB, BC are incommensurable in length, so AC is incommensurable with AB (X.16). The square on AC is the squares on AB, BC less twice the rectangle AB, BC (II.7). The squares are medial, the twice-rectangle rational; a medial area less a rational area is irrational (X.26 and its companion: a medial does not exceed a rational by a medial... the difference of a medial and a rational is irrational). So the square on AC is irrational and AC is irrational: a first apotome of a medial."
