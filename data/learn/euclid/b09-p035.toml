[[step]]
text = "Let FK be made equal to BC, and FL equal to D. Since FK is equal to BC, and of these FH is equal to BG, the remainder HK is equal to the remainder GC. And since, as EF is to D, so is D to BC, and BC to A, and D is equal to FL, BC to FK, A to FH, as EF is to FL, so is LF to FK, and FK to FH. Separando, as EL is to LF, so is LK to FK, and KH to FH (VII.11). And as one of the antecedents is to one of the consequents, so are all the antecedents to all the consequents (VII.12). Therefore, as KH is to FH, so are EL, LK, KH to LF, FK, HF. But KH is equal to CG, FH to A, and LF, FK, HF to D, BC, A. Therefore, as CG is to A, so is EH to D, BC, A. Therefore, as the excess of the second is to the first, so is the excess of the last to all those before it."
