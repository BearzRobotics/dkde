id = "IX.35"
book = 9
order = 35
title = "The sum of a geometric progression"
statement = "If as many numbers as we please be in continued proportion, and there be subtracted from the second and the last numbers equal to the first, then, as the excess of the second is to the first, so will the excess of the last be to all those before it."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let there be as many numbers as we please in continued proportion, A, BC, D, EF, beginning from A (here 1, 3, 9, 27, 81), and let there be subtracted from BC and EF the numbers BG, FH, each equal to A. I say that, as GC is to A, so is EH to A, BC, D (that is, 2 to 1 as 80 to 1 + 3 + 9 + 27 = 40)."
