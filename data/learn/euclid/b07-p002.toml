[[step]]
text = "If CD measures AB, then, since it also measures itself, CD is a common measure of AB, CD, and it is the greatest, since no greater number than CD will measure CD. But if CD does not measure AB, then, some number being left over from AB, CD, the remainder will measure the one before it. For a unit will not be left, otherwise AB, CD would be prime to one another, which is contrary to the hypothesis. Let CD, measuring BE, leave EA less than itself, and EA, measuring DF, leave FC less than itself, and let CF measure AE. Since CF measures AE, and AE measures DF, CF will also measure DF. But it also measures itself. Therefore it will also measure the whole CD. And CD measures BE. Therefore CF also measures BE. And it also measures EA. Therefore it measures the whole BA. Therefore CF is a common measure of AB, CD. I say next that it is also the greatest. For if not, there is some number greater than CF which measures AB, CD. Let it be G. Since G measures CD, and CD measures BE, G also measures BE. But it also measures the whole BA. Therefore it will also measure the remainder AE. And AE measures DF; therefore G will also measure DF. But it also measures the whole DC. Therefore it will also measure the remainder CF, the greater the less, which is impossible. Therefore CF is the greatest common measure of AB, CD."
