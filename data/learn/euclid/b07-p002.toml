id = "VII.2"
book = 7
order = 2
title = "The greatest common measure of two numbers"
statement = "Given two numbers not prime to one another, to find their greatest common measure."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let AB, CD be the two given numbers not prime to one another (here 48 and 18). It is required to find the greatest common measure of AB, CD. Subtract the less from the greater in turn: 48 less 18 twice leaves 12; 18 less 12 leaves 6; and 6 measures 12 exactly."
