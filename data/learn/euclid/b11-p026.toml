[[step]]
text = "Let a point F be taken at random on DF, let FG be drawn from F perpendicular to the plane through ED, DC (XI.11), and let it meet the plane at G. Let DG be joined, and construct at A on AB the angle BAL equal to the angle EDC, and the angle BAK equal to EDG (I.23), in the plane of reference. Let AK be made equal to DG, and from the point K let KH be set up at right angles to the plane through BAL (XI.12), and let KH be made equal to GF. Let HA be joined. I say that the solid angle at A, contained by the angles BAL, BAH, HAL, is equal to the solid angle at D, contained by the angles EDC, EDF, FDC. For if AB, DE are cut off equal, and HB, KB, FE, GE joined, then KH is equal to GF and KA to GD, and the angles at K, G are right; so AH is equal to DF. Similarly the other corresponding straight lines and angles are equal, so the solid angles are equal."
