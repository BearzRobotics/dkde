id = "XI.26"
book = 11
order = 26
title = "A solid angle equal to a given one"
statement = "On a given straight line, and at a given point on it, to construct a solid angle equal to a given solid angle contained by three plane angles."
proof = "Therefore on the given straight line AB, and at the point A on it, the solid angle at A has been constructed equal to the solid angle at D. Being what it was required to do."

[[step]]
text = "Let AB be the given straight line, A the given point on it, and the solid angle at D contained by the plane angles EDC, EDF, FDC. It is required to construct on the straight line AB, and at the point A on it, a solid angle equal to the solid angle at D."
