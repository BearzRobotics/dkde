id = "X.98"
book = 10
order = 98
title = "The square on the first apotome of a medial straight line"
statement = "The square on the first apotome of a medial straight line, if applied to a rational straight line, produces as breadth the second apotome."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB be the first apotome of a medial straight line with the annex BC, and let a rational straight line DE be set out. Apply to DE the rectangle DF equal to the square on AB, producing DG as breadth. I say that DG is the second apotome. Example: (the fourth root of 8 less the fourth root of 2) squared is 3 times the square root of 2 less 4 (terms 4.243 and 4.000, the remainder 0.243)."
