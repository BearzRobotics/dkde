title = "The square on the straight line which produces with a rational area a medial whole"
statement = "The square on the straight line which produces with a rational area a medial whole, if applied to a rational straight line, produces as breadth the fifth apotome."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB be the straight line which produces with a rational area a medial whole with the annex BC, and let a rational straight line DE be set out. Apply to DE the rectangle DF equal to the square on AB, producing DG as breadth. I say that DG is the fifth apotome. Example: (1.554 less 0.644) squared is 2 times the square root of 2 less 2 (terms 2.828 and 2.000, the remainder 0.828)."
