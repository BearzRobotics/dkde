[[step]]
text = "For some multiple of C will, if multiplied, sometime be greater than AB (V, definition 4). Let it be DE, divided into the parts DF, FG, GE equal to C, and from AB let BH be subtracted greater than its half, from AH let HK be subtracted greater than its half, and so on until the divisions in AB are equal in multitude with those in DE. Now, since DE is greater than AB, and from DE there has been subtracted EG less than its half, while from AB there has been subtracted BH greater than its half, the remainder GD is greater than the remainder HA; and the same holds at each step. So the remainder at the last step, AK, is less than the corresponding part DF, which is equal to C. Therefore the magnitude AK left is less than C. (This is the principle used in the method of exhaustion in Book XII.)"
