title = "Exhaustion"
statement = "Two unequal magnitudes being set out, if from the greater there be subtracted a magnitude greater than its half, and from that which is left a magnitude greater than its half, and if this process be repeated continually, there will be left some magnitude which will be less than the lesser magnitude set out."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB, C be two unequal magnitudes of which AB is the greater (here 10 and 1.5). I say that if from AB there be subtracted a magnitude greater than its half, and from the remainder a magnitude greater than its half, and so on, there will be left some magnitude less than C."
