[[step]]
text = "Since A is greater than C, and B is some other magnitude, and the greater has to the same a greater ratio than the less has (V.8), A has to B a greater ratio than C has to B. But A:B = D:E, and, inversely, C:B = F:E. Therefore D has to E a greater ratio than F has to E (V.13). But of magnitudes which have a ratio to the same, that which has the greater ratio is greater (V.10). Therefore D is greater than F."
