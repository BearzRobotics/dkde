title = "Ex aequali: three magnitudes"
statement = "If there be three magnitudes, and others equal to them in multitude, which taken two and two together are in the same ratio, and if ex aequali the first be greater than the third, the fourth will also be greater than the sixth; if equal, equal; and if less, less."
proof = "Therefore if there be three magnitudes, and others equal to them in multitude, which taken two and two together are in the same ratio, and if ex aequali the first be greater than the third, the fourth will also be greater than the sixth; if equal, equal; and if less, less. Q.E.D."

[[step]]
text = "Let there be three magnitudes A, B, C, and others D, E, F equal to them in multitude, which taken two and two are in the same ratio, so that A:B = D:E and B:C = E:F, and let A be greater than C ex aequali. I say that D will also be greater than F; if A is equal to C, D equal to F; and if less, less."
