id = "VI.18"
book = 6
order = 18
title = "A similar figure on a given line"
statement = "On a given straight line to describe a rectilineal figure similar and similarly situated to a given rectilineal figure."
proof = "Therefore on the given straight line AB the rectilineal figure similar and similarly situated to the given figure CDKHG has been described. Being what it was required to do."

[[step]]
text = "Let AB be the given straight line and CDFEG (here ABCD stands for the given quadrilateral on AB) the given rectilineal figure. It is required to describe on the straight line EF a rectilineal figure similar and similarly situated to ABCD."
draw = [
  "clear",
  "point A 0 0",
  "point B 4 0",
  "point C 5 3",
  "point D 1 3.5",
  "point E 7 0",
  "point F 13 0",
  "polygon A B C D blue fill",
  "segment B D green",
  "segment E F red",
]

[[step]]
text = "Let DB be joined, and on the straight line EF, and at the points E, F on it, let the angle FEG be constructed equal to the angle at A, and the angle EFG equal to the angle ABD (I.23). Therefore the remaining angle at D is equal to the remaining angle at G, and the triangle ABD is equiangular with the triangle EGF. Therefore, proportionally, as AB is to EF, so is BD to FG, and so is AD to EG."
draw = [
  "point G 8.5 5.25",
  "segment E G red",
  "segment F G red",
]

[[step]]
text = "Again, on the straight line FG, and at the points F, G on it, let the angle GFH be constructed equal to the angle DBC, and the angle FGH equal to the angle BDC. Therefore the remaining angle at C is equal to the remaining angle at H, and the triangle BDC is equiangular with the triangle FGH. Therefore, as BD is to FG, so is BC to FH, and so is DC to GH. But BD is to FG as AD to EG and as AB to EF. Therefore the figure EFHG is equiangular with the figure ABCD, and has its sides about the equal angles proportional. Therefore EFHG is similar to ABCD."
draw = [
  "point H 14.5 4.5",
  "segment F H red",
  "segment G H red",
  "polygon E F H G red fill",
]
