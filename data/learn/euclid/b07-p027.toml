[[step]]
text = "For, since A, B are prime to one another, and A by multiplying itself has made C, C, B are prime to one another (VII.25). Since, then, C, B are prime to one another, and B by multiplying itself has made E, C, E are prime to one another. Again, since A, B are prime to one another, and B by multiplying itself has made E, A, E are prime to one another. Since, then, the two numbers A, C are prime to the two numbers B, E, both to each, the product of A, C is prime to the product of B, E (VII.26). And the product of A, C is D, and the product of B, E is F. Therefore D, F are prime to one another."
