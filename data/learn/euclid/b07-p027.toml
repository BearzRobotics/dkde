id = "VII.27"
book = 7
order = 27
title = "Squares and cubes of primes"
statement = "If two numbers be prime to one another, and each by multiplying itself make a certain number, the products will be prime to one another; and if the original numbers by multiplying the products make certain numbers, the latter will also be prime to one another, and this always happens with the extremes."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let A, B be two numbers prime to one another (here 2 and 3), and let A by multiplying itself make C, and by multiplying C make D, and let B by multiplying itself make E, and by multiplying E make F. I say that C, E are prime to one another, and D, F are prime to one another."
