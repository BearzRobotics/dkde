[[step]]
text = "Euclid takes the centre F, joins AF, FB, and cuts off FK a fourth of AF. Using the similar triangles ACL, AMF, he shows that DC is to CM as MF is to FK, and then, since the diagonal AC is cut in extreme and mean ratio with the side DC as its greater segment (XIII.8), that the square on the sum of DC and CM is five times the square on CM (XIII.1). From this the square on MB is five times the square on FK. Since the diameter is rational, FK is rational and MB is commensurable in square with it, though not in length, while the radius is rational."
draw = [
]

[[step]]
text = "Therefore the square on AB, being the sum of the squares on AM and MB, is made of a rational part and a medial part, so that AB is a minor irrational line (X.94). In modern terms: with radius 1, the side is the square root of (5 less the square root of 5) over 2, whose square is the rational 5/2 less the irrational half of the square root of 5, which is exactly the form of a minor line. Therefore the side of the pentagon is the irrational straight line called minor."
