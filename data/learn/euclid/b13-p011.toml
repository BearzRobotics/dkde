id = "XIII.11"
book = 13
order = 11
title = "The side of the pentagon is a minor line"
statement = "If in a circle which has its diameter rational an equilateral pentagon be inscribed, the side of the pentagon is the irrational straight line called minor."
proof = "Therefore the side of the pentagon is the irrational straight line called minor. Q.E.D."

[[step]]
text = "For in the circle ABCDE which has its diameter rational let the equilateral pentagon ABCDE be inscribed. I say that the side of the pentagon is the irrational straight line called minor (X.76)."
