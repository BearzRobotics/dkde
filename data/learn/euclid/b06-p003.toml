id = "VI.3"
book = 6
order = 3
title = "The angle bisector theorem"
statement = "If an angle of a triangle be bisected and the straight line cutting the angle cut the base also, the segments of the base will have the same ratio as the remaining sides of the triangle; and, if the segments of the base have the same ratio as the remaining sides of the triangle, the straight line drawn from the vertex to the point of section will bisect the angle of the triangle."
proof = "Therefore if an angle of a triangle be bisected and the straight line cutting the angle cut the base also, the segments of the base will have the same ratio as the remaining sides of the triangle; and, if the segments of the base have the same ratio as the remaining sides of the triangle, the straight line drawn from the vertex to the point of section will bisect the angle of the triangle. Q.E.D."

[[step]]
text = "Let ABC be a triangle, and let the angle BAC be bisected by the straight line AD. I say that, as BD is to CD, so is BA to AC."
draw = [
