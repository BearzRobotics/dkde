title = "The least numbers in a given ratio"
statement = "Given as many numbers as we please, to find the least of those which have the same ratio with them."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let A, B, C be the given numbers, as many as we please (here 6, 9, 15). It is required to find the least of those which have the same ratio with A, B, C."
