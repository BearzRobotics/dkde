id = "IX.11"
book = 9
order = 11
title = "In a progression from the unit, the less measures the greater"
statement = "If as many numbers as we please beginning from an unit be in continued proportion, the less measures the greater by some one of the numbers which have place among the proportional numbers."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let there be as many numbers as we please, B, C, D, E, beginning from the unit A in continued proportion (here 1, 2, 4, 8, 16). I say that B, the least of the numbers B, C, D, E, measures E by one of the numbers C, D, and in general any term measures a later term by a term of the series."
