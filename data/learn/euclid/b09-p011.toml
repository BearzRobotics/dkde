[[step]]
text = "Since the unit A measures B as often as D measures E (in the proportion A : B = D : E), alternately the unit A measures D as often as B measures E (VII.15). But the unit A measures D according to the units in D. Therefore B also measures E according to the units in D. Therefore B measures E by D, which is one of the numbers in the series (here 2 measures 16 by 8). Similarly any term measures a later term by a term of the series."
