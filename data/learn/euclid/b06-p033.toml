id = "VI.33"
book = 6
order = 33
title = "Angles are proportional to arcs"
statement = "In equal circles angles have the same ratio as the circumferences on which they stand, whether they stand at the centres or at the circumferences. And sectors also, being constructed at the centres, have the same ratio as the angles."
proof = "Therefore in equal circles angles have the same ratio as the circumferences on which they stand, whether they stand at the centres or at the circumferences. And sectors also, being constructed at the centres, have the same ratio as the angles. Q.E.D."

[[step]]
text = "Let ABC, DEF be equal circles, and let there be at their centres G, H the angles BGC, EHF, and at the circumferences the angles BAC, EDF. I say that, as the circumference BC is to the circumference EF, so is the angle BGC to the angle EHF, and the angle BAC to the angle EDF, and further the sector BGC to the sector EHF. (One circle is drawn here with the arcs BC, CD equal.)"
