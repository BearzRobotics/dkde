[[step]]
text = "Let any number of consecutive circumferences CK, KL be made equal to the circumference BC, and any number FM, MN equal to EF, and let GK, GL, HM, HN be joined. Since the circumferences BC, CK, KL are equal to one another, the angles BGC, CGK, KGL are also equal to one another (III.27). Therefore, whatever multiple the circumference BL is of BC, that multiple also is the angle BGL of the angle BGC. For the same reason, whatever multiple the circumference EN is of EF, that multiple also is the angle EHN of the angle EHF."
