[[step]]
text = "If the circumference BL is equal to the circumference EN, the angle BGL is also equal to the angle EHN (III.27); if the circumference BL is greater than the circumference EN, the angle BGL is also greater than the angle EHN; and if less, less. There being four magnitudes, two circumferences BC, EF and two angles BGC, EHF, equimultiples have been taken of the circumference BC and the angle BGC, namely the circumference BL and the angle BGL, and of the circumference EF and the angle EHF, namely the circumference EN and the angle EHN; and it has been proved that if the circumference BL exceeds the circumference EN, the angle BGL also exceeds the angle EHN; if equal, equal; if less, less. Therefore, as the circumference BC is to EF, so is the angle BGC to the angle EHF (V, definition 5). But the angle BGC is to the angle EHF as the angle BAC is to the angle EDF, for each is double of each (III.20). Therefore also, as the circumference BC is to the circumference EF, so is the angle BGC to the angle EHF, and the angle BAC to the angle EDF. And the sectors have the same ratio as the angles, by the same reasoning with the triangles BGC, CGK, KGL, equal and similar, and the segments."
