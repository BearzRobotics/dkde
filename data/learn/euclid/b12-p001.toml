[[step]]
text = "Let BE, AM, GK, FN be joined. Since the polygon ABCDE is similar to the polygon FGHKL, the angle BAE is equal to the angle GFL, and BA is to AE as GF is to FL (VI definition 1). Therefore the triangles BAE, GFL are equiangular (VI.6), so the angle AEB is equal to the angle FLG. But the angle AEB is equal to the angle AMB, for they stand on the same circumference (III.27); and the angle FLG to the angle FNG. Therefore the angle AMB is also equal to the angle FNG. But the right angle BAM is also equal to the right angle GFN (III.31). Therefore the remaining angle is equal to the remaining angle, and the triangle ABM is equiangular with the triangle FGN. Therefore, proportionally, as BM is to GN, so is BA to GF (VI.4). But the ratio of the square on BM to the square on GN is duplicate of the ratio of BM to GN, and the ratio of the polygon ABCDE to the polygon FGHKL is duplicate of the ratio of BA to GF (VI.20). Therefore, as the square on BM is to the square on GN, so is the polygon ABCDE to the polygon FGHKL."
