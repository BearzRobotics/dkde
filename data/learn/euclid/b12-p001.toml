id = "XII.1"
book = 12
order = 1
title = "Similar polygons in circles"
statement = "Similar polygons inscribed in circles are to one another as the squares on the diameters of the circles."
proof = "Therefore similar polygons inscribed in circles are to one another as the squares on the diameters of the circles. Q.E.D."

[[step]]
text = "Let ABC, FGH be circles, and in them let the similar polygons ABCDE, FGHKL be inscribed, and let BM, GN be diameters of the circles. I say that, as the square on BM is to the square on GN, so is the polygon ABCDE to the polygon FGHKL."
