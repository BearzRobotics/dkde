[[step]]
text = "Let AB be bisected at E, and on EB let the parallelogram BF be described similar and similarly situated to D (VI.18). Let the parallelogram GH be constructed equal to BF and C together, and similar and similarly situated to D (VI.25). Let KH correspond to FL and KG to FE. Since the parallelogram GH is greater than the parallelogram FB, KH is greater than FL and KG than FE. Let FL, FE be produced, and let FLM be equal to KH and FEN to KG, and let MN be completed. Then MN is equal and similar to GH. But GH is similar to EL. Therefore MN is similar to EL, so EL is about the same diameter with MN (VI.26). Let their diameter FO be drawn, and let the figure be described."
draw = [
]

[[step]]
text = "Since GH is equal to EL and C together, and GH is equal to MN, MN is also equal to EL and C together. Take away EL from each. Then the remaining gnomon XWV is equal to C. Since AE is equal to EB, AN is equal to NB (I.36), that is, to LP. Add EO to each. Then the whole AO is equal to the gnomon VXW. But the gnomon VXW is equal to C. Therefore AO is also equal to C. Therefore to the given straight line AB there has been applied the parallelogram AO equal to the given rectilineal figure C and exceeding by the parallelogram QP, which is similar to D, since PQ is also similar to EL."
