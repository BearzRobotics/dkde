id = "VI.29"
book = 6
order = 29
title = "Application exceeding by a similar figure"
statement = "To a given straight line to apply a parallelogram equal to a given rectilineal figure and exceeding by a parallelogrammic figure similar to a given one."
proof = "Therefore to the given straight line AB there has been applied the parallelogram AP equal to the given rectilineal figure C and exceeding by the parallelogrammic figure QB similar to D. Being what it was required to do."

[[step]]
text = "Let AB be the given straight line, C the given rectilineal figure to which the parallelogram to be applied to AB is to be equal, and D that to which the excess is to be similar. It is required to apply to the given straight line AB a parallelogram equal to the rectilineal figure C and exceeding by a parallelogrammic figure similar to D."
