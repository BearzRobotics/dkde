[[step]]
text = "From the points A, C let AG, CH be drawn at right angles to AB, CD, and let AG be made equal to F, and CH equal to E. Let the parallelograms BG, DH be completed. Since AB is to CD as E is to F, and E is equal to CH, and F to AG, AB is to CD as CH is to AG. Therefore in the parallelograms BG, DH the sides about the equal angles are reciprocally proportional. But equiangular parallelograms in which the sides about the equal angles are reciprocally proportional are equal (VI.14). Therefore the parallelogram BG is equal to the parallelogram DH. And BG is the rectangle contained by AB, F, for AG is equal to F; and DH is the rectangle contained by CD, E, for E is equal to CH. Therefore the rectangle contained by AB, F is equal to the rectangle contained by CD, E."
