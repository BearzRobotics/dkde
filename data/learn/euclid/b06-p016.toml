]

[[step]]
text = "Next, let the rectangle contained by AB, F be equal to the rectangle contained by CD, E. I say that the four straight lines will be proportional, so that AB is to CD as E is to F. With the same construction, since the rectangle AB, F is equal to the rectangle CD, E, the parallelogram BG is equal to the parallelogram DH, and they are equiangular. But in equal and equiangular parallelograms the sides about the equal angles are reciprocally proportional (VI.14). Therefore AB is to CD as CH is to AG. But CH is equal to E, and AG to F. Therefore AB is to CD as E is to F."
