id = "VI.16"
book = 6
order = 16
title = "Proportion and the rectangle"
statement = "If four straight lines be proportional, the rectangle contained by the extremes is equal to the rectangle contained by the means; and, if the rectangle contained by the extremes be equal to the rectangle contained by the means, the four straight lines will be proportional."
proof = "Therefore if four straight lines be proportional, the rectangle contained by the extremes is equal to the rectangle contained by the means; and, if the rectangle contained by the extremes be equal to the rectangle contained by the means, the four straight lines will be proportional. Q.E.D."

[[step]]
text = "Let the four straight lines AB, CD, E, F be proportional, so that AB is to CD as E is to F (here 6, 4, 3, 2). I say that the rectangle contained by AB, F is equal to the rectangle contained by CD, E."
draw = [
