id = "XIII.4"
book = 13
order = 4
title = "The whole and the lesser segment"
statement = "If a straight line be cut in extreme and mean ratio, the square on the whole and the square on the lesser segment together are triple of the square on the greater segment."
proof = "Therefore if a straight line be cut in extreme and mean ratio, the square on the whole and the square on the lesser segment together are triple of the square on the greater segment. Q.E.D."

[[step]]
text = "Let AB be a straight line, let it be cut in extreme and mean ratio at C, and let AC be the greater segment. I say that the squares on AB, BC are triple of the square on CA."
draw = [
