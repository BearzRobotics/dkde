id = "XI.10"
book = 11
order = 10
title = "Equal angles with parallel arms"
statement = "If two straight lines meeting one another be parallel to two straight lines meeting one another, not in the same plane, they will contain equal angles."
proof = "Therefore if two straight lines meeting one another be parallel to two straight lines meeting one another, not in the same plane, they will contain equal angles. Q.E.D."

[[step]]
text = "Let the two straight lines AB, BC meeting one another be parallel to the two straight lines DE, EF meeting one another, not in the same plane. I say that the angle ABC is equal to the angle DEF."
