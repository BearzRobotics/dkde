[[step]]
text = "Let BA, BC, ED, EF be cut off equal to one another, and let AD, CF, BE, AC, DF be joined. Since BA is equal and parallel to ED, AD is equal and parallel to BE (I.33). For the same reason CF is equal and parallel to BE. Therefore each of AD, CF is equal and parallel to BE. But straight lines parallel to the same straight line and not in the same plane with it are parallel to one another (XI.9). Therefore AD is parallel and equal to CF. And AC, DF join them. Therefore AC is also equal and parallel to DF (I.33). Since the two sides AB, BC are equal to the two sides DE, EF, and the base AC is equal to the base DF, the angle ABC is equal to the angle DEF (I.8)."
