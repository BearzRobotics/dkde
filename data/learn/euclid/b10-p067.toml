id = "X.67"
book = 10
order = 67
title = "Commensurable with the bimedial"
statement = "A straight line commensurable in length with a bimedial straight line is itself also bimedial and the same in order."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB be a bimedial straight line divided into its terms at E, and let CD be commensurable in length with AB (here the first bimedial and its double). I say that CD is bimedial and the same in order."
draw = [
  "clear",
  "point AB 0 0",
  "point ab 2.01 0",
  "segment AB ab blue",
  "point CD 0 -0.9",
  "point cd 4.019 -0.9",
  "segment CD cd red",
]

[[step]]
text = "Divide CD at F in the same ratio as AB is divided at E, so that AE is to EB as CF is to FD (VI.10). Then, as AB is to CD, so is AE to CF and EB to FD, so that AE is commensurable with CF and EB with FD (X.11). The squares on the parts are in the ratios of the squares on AE, EB; so CF, FD have the same commensurabilities in square and in length as AE, EB, and the same relation to the assigned rational line (X.12, X.13: lines commensurable with the same line are commensurable with one another, and incommensurable lines keep that quality), and the same excess relation between the squares (X.14). Therefore CD has the same form and the same order as AB."
