title = "A medial area subtracted from a rational area"
statement = "If from a rational area a medial area be subtracted, the side of the remainder becomes one of two irrational straight lines, either an apotome or a minor straight line."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let BC be a rational area and BD a medial area subtracted from it (here 4 and the square root of 3 in square units; the remainder is 2.268, with side 1.506). I say that the side of the remainder EC becomes either an apotome or a minor straight line."
draw = [
  "clear",
  "point BC 0 0",
  "point bc 1.4 0",
  "segment BC bc blue",
  "point BD 0 -0.9",
  "point bd 1.212 -0.9",
  "segment BD bd red",
  "point FG 0 -1.8",
