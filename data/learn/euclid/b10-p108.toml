  "segment FG fg green",
]

[[step]]
text = "Set out a rational straight line FG and apply to it the rectangle GH equal to BC and GK equal to BD. Then FH is rational and commensurable with FG, and FK is rational and incommensurable with FG (X.20, X.22). So FH, FK are commensurable in square only, and the remainder KH is an apotome (X.73), the annex being FK. The square on the whole FH exceeds that on the annex by the square on a line commensurable or incommensurable with FH. If commensurable, then the whole FH being commensurable with FG, KH is a first apotome, and the side of the area is an apotome (X.91). If incommensurable, KH is a fourth apotome, and the side of the area is minor (X.94). Therefore the side of the remainder is one of the two."
