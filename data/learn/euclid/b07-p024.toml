id = "VII.24"
book = 7
order = 24
title = "A product prime to a number"
statement = "If two numbers be prime to any number, their product also will be prime to the same."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "For let two numbers A, B be prime to any number C (here 3 and 5 are prime to 8), and let A by multiplying B make D. I say that C, D are prime to one another."
