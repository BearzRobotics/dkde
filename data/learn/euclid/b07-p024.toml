[[step]]
text = "For if C, D are not prime to one another, some number will measure C, D. Let E measure them. Now, since C, A are prime to one another, and some number E measures C, A, E are prime to one another (VII.23). Whatever number E measures D, let it measure D according to F. Then F also measures D according to the units in E. Therefore E by multiplying F has made D. But, further, A by multiplying B has made D. Therefore the product of E, F is equal to the product of A, B. But if the product of the extremes be equal to that of the means, the four numbers are proportional (VII.19). Therefore, as E is to A, so is B to F. But A, E are prime to one another, and numbers prime to one another are also the least of those which have the same ratio (VII.21), and the least numbers measure those which have the same ratio the same number of times (VII.20). Therefore E measures B. But it also measures C. Therefore E measures B, C, which are prime to one another, which is impossible. Therefore no number will measure the numbers C, D. Therefore C, D are prime to one another."
