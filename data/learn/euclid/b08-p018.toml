id = "VIII.18"
book = 8
order = 18
title = "Between two similar plane numbers"
statement = "Between two similar plane numbers there is one mean proportional number; and the plane number has to the plane number the ratio duplicate of that which the corresponding side has to the corresponding side."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let A, B be two similar plane numbers, and let the numbers C, D be the sides of A, and E, F the sides of B (here A = 4 by 6 = 24 and B = 6 by 9 = 54, with 4 : 6 = 6 : 9). I say that between A, B there is one mean proportional number, and A has to B the ratio duplicate of that which C has to E, or D to F."
