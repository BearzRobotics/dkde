[[step]]
text = "Since A, B are similar plane numbers, C is to D as E is to F, so C is to E as D is to F (VII.13). Let G be D by E (6 times 6 = 36). Then, since C by D makes A and C by E makes... as C is to E, so is A to G (VII.17: C by D is A, C by... ) and as D is to F so is G to B (VII.18). Since C is to E as D is to F, A is to G as G is to B. Therefore between A, B there is one mean proportional number G (36). And since A, G, B are in continued proportion, A has to B the ratio duplicate of that which A has to G, that is, which C has to E."
