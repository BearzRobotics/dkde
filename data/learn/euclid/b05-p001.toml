id = "V.1"
book = 5
order = 1
title = "Equimultiples add"
statement = "If any number of magnitudes be equimultiples of as many others, each of each, whatever multiple one of the magnitudes is of one, that multiple also will all be of all."
proof = "Therefore, whatever multiple AB is of E, that multiple also is AB, CD together of E, F together. Q.E.D. (In algebra: ma + mb + ... = m(a + b + ...).)"

[[step]]
text = "Let any number of magnitudes AB, CD be equimultiples of as many magnitudes E, F, each of each (here AB is three times E, and CD three times F, with E = 2 and F = 3). I say that whatever multiple AB is of E, that multiple will AB, CD together be of E, F together."
