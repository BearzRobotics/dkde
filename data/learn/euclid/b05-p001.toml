[[step]]
text = "Since AB is the same multiple of E that CD is of F, as many magnitudes as there are in AB equal to E, so many are there in CD equal to F. Divide AB into magnitudes AG, GB equal to E, and CD into CH, HK equal to F. Then the multitude of AG, GB, ... will be equal to the multitude of CH, HK, ...."
draw = [
]

[[step]]
text = "Since AG is equal to E, and CH to F, AG and CH together are equal to E and F together. For the same reason each further pair is equal to E and F together. Therefore as many as there are in AB equal to E, so many are there in AB, CD together equal to E, F together. Therefore, whatever multiple AB is of E, that multiple also is AB, CD together of E, F together."
