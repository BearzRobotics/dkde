[[step]]
text = "For if the angle BGC is unequal to the angle EHF, one of them is greater. Let BGC be greater, and on the straight line BG, at the point G on it, let the angle BGK be constructed equal to the angle EHF (I.23). But equal angles stand on equal circumferences when they are at the centres (III.26). Therefore the circumference BK is equal to the circumference EF. But EF is equal to BC. Therefore BK is equal to BC, the less to the greater, which is impossible. Therefore the angle BGC is not unequal to the angle EHF; therefore it is equal to it. And the angle at A is half of the angle BGC, and the angle at D is half of the angle EHF (III.20). Therefore the angle at A is also equal to the angle at D."
