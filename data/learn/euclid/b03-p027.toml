id = "III.27"
book = 3
order = 27
title = "Equal arcs: equal angles"
statement = "In equal circles angles standing on equal circumferences are equal to one another, whether they stand at the centres or at the circumferences."
proof = "Therefore in equal circles angles standing on equal circumferences are equal to one another, whether they stand at the centres or at the circumferences. Q.E.D."

[[step]]
text = "In the equal circles ABC, DEF let the angles BGC, EHF at the centres G, H, and BAC, EDF at the circumferences, stand on the equal circumferences BC, EF. I say that the angle BGC is equal to the angle EHF, and the angle BAC to the angle EDF."
