[[step]]
text = "As in the last proposition, AB, AF are rational and commensurable in square only. Convertendo, as CD is to DE, so is the square on AB to the square on BF. But CD has not to DE the ratio of a square number to a square number. So AB is incommensurable in length with BF (X.9). And the square on AB is greater than the square on AF by the square on BF."
