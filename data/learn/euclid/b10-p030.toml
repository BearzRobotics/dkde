title = "Two rational lines: the fourth binomial type"
statement = "To find two rational straight lines commensurable in square only and such that the square on the greater is greater than the square on the less by the square on a straight line incommensurable in length with the greater."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let there be set out a rational straight line AB and two numbers CE, ED such that the sum CD has not to either of them the ratio of a square number to a square number. On AB describe the semicircle AFB, and let it be that, as DC is to CE, so is the square on BA to the square on AF. I say that AB, AF are rational straight lines commensurable in square only, and that the square on AB is greater than the square on AF by the square on FB incommensurable in length with AB. (Here take AB = 2 and AF = the square root of 2: the difference of the squares is 2, the square on a line incommensurable with 2.)"
