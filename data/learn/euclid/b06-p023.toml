id = "VI.23"
book = 6
order = 23
title = "Compounded ratios of parallelograms"
statement = "Equiangular parallelograms have to one another the ratio compounded of the ratios of their sides."
proof = "Therefore equiangular parallelograms have to one another the ratio compounded of the ratios of their sides. Q.E.D."

[[step]]
text = "Let AC, CF be equiangular parallelograms having the angle BCD equal to the angle ECG. I say that the parallelogram AC has to the parallelogram CF the ratio compounded of the ratios of the sides."
