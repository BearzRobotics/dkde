[[step]]
text = "Since C has to D a greater ratio than E to F, there exist some equimultiples of C, E and other equimultiples of D, F such that the multiple of C exceeds the multiple of D, while the multiple of E does not exceed the multiple of F (definition 7). Let them be taken, and let them be G, H of C, E and K, L of D, F, so that G exceeds K but H does not exceed L. Let G be the same multiple of C that M is of A, and K the same multiple of D that N is of B."
draw = [
]

[[step]]
text = "Since A:B = C:D, and M, G are equimultiples of A, C and N, K of B, D, then if M exceeds N, G exceeds K; if equal, equal; if less, less. But G exceeds K. Therefore M exceeds N. But H does not exceed L. And M, H are equimultiples of A, E, and N, L of B, F. Therefore A has to B a greater ratio than E has to F."
