id = "V.13"
book = 5
order = 13
title = "A greater ratio"
statement = "If a first magnitude have to a second the same ratio as a third to a fourth, and the third have to the fourth a greater ratio than a fifth has to a sixth, the first will also have to the second a greater ratio than the fifth to the sixth."
proof = "Therefore if a first magnitude have to a second the same ratio as a third to a fourth, and the third have to the fourth a greater ratio than a fifth has to a sixth, the first will also have to the second a greater ratio than the fifth to the sixth. Q.E.D."

[[step]]
text = "For let a first magnitude A have to a second B the same ratio as a third C to a fourth D, and let the third C have to the fourth D a greater ratio than a fifth E has to a sixth F. I say that the first A will also have to the second B a greater ratio than the fifth E to the sixth F."
