[[step]]
text = "Since the straight line KL touches the circle ABCDE at C, and FC has been joined from the centre to the point of contact, FC is perpendicular to KL (III.18). Therefore each of the angles at C is right. For the same reason the angles at the points B, D are right. Since the angle FCK is right, the square on FK is equal to the squares on FC, CK (I.47). For the same reason the square on FK is also equal to the squares on FB, BK. Therefore the squares on FC, CK are equal to the squares on FB, BK, of which the square on FC is equal to the square on FB. Therefore the remaining square on CK is equal to the remaining square on BK, so BK is equal to CK. Since FB is equal to FC, and FK is common, the two sides BF, FK are equal to the two sides CF, FK, and the base BK is equal to the base CK. Therefore the angle BFK is equal to the angle KFC (I.8), and the angle BKF to the angle FKC. Therefore the angle BFC is double of the angle KFC, and the angle BKC is double of the angle FKC. For the same reason the angle CFD is double of the angle CFL, and the angle DLC is double of the angle FLC. Since the circumference BC is equal to CD, the angle BFC is equal to the angle CFD (III.27). And BFC is double of KFC, CFD of CFL. Therefore the angle KFC is equal to the angle CFL. But the angle FCK is also equal to the angle FCL, since both are right. Therefore FKC, FLC are two triangles having two angles equal to two angles, and one side equal to one side, namely FC, which is common. Therefore they will also have the remaining sides equal to the remaining sides (I.26). Therefore CK is equal to CL, and the angle FKC is equal to the angle FLC. Since CK is equal to CL, KL is double of KC. In the same way it can be proved that HK is double of BK. And BK is equal to KC. Therefore HK is also equal to KL. Similarly each of the straight lines HG, GM, ML can be proved equal to each of HK, KL. Therefore the pentagon GHKLM is equilateral. And since the angle FKC is equal to the angle FLC, and the angle HKL was proved double of FKC, and the angle KLM double of FLC, the angle HKL is also equal to the angle KLM. Similarly each of the angles KHG, HGM, GML can be proved equal to each of HKL, KLM. Therefore the five angles are equal to one another, and the pentagon GHKLM is equiangular."
