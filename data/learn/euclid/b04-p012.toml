id = "IV.12"
book = 4
order = 12
title = "Circumscribe a pentagon about a circle"
statement = "About a given circle to circumscribe an equilateral and equiangular pentagon."
proof = "Therefore about the given circle the equilateral and equiangular pentagon GHKLM has been circumscribed. Being what it was required to do."

[[step]]
text = "Let ABCDE be the given circle, and let the points A, B, C, D, E be the angular points of an inscribed equilateral and equiangular pentagon (IV.11), so that the circumferences AB, BC, CD, DE, EA are equal. It is required to circumscribe an equilateral and equiangular pentagon about the circle."
