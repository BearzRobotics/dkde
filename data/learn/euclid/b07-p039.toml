id = "VII.39"
book = 7
order = 39
title = "The least number with given parts"
statement = "To find the number which is the least that will have given parts."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let A, B, C be the given parts (here a half, a third and a quarter; the numbers naming them are 2, 3, 4). It is required to find the number which is the least that will have the parts A, B, C."
