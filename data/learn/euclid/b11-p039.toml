id = "XI.39"
book = 11
order = 39
title = "Prisms on a parallelogram and a triangle"
statement = "If there be two prisms of equal height, and one have a parallelogram as base and the other a triangle, and if the parallelogram be double of the triangle, the prisms will be equal."
proof = "Therefore if there be two prisms of equal height, and one have a parallelogram as base and the other a triangle, and if the parallelogram be double of the triangle, the prisms will be equal. Q.E.D."

[[step]]
text = "Let ABCDEF, GHKLMN be two prisms of equal height, let one have the parallelogram AF as base and the other the triangle GHK, and let the parallelogram AF be double of the triangle GHK. I say that the prism ABCDEF is equal to the prism GHKLMN."
