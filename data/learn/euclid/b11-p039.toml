[[step]]
text = "Let the solids AG, GP be completed. Since the parallelogram AF is double of the triangle GHK, and the parallelogram HK is also double of the triangle GHK (I.34), the parallelogram AF is equal to the parallelogram HK. But parallelepipedal solids which are on equal bases and of the same height are equal to one another (XI.31). Therefore the solid AG is equal to the solid GP. But the solid AG is double of the prism ABCDEF, and the solid GP is double of the prism GHKLMN (XI.28). Therefore the prism ABCDEF is equal to the prism GHKLMN."
