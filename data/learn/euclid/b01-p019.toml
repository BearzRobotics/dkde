id = "I.19"
book = 1
order = 20
title = "The greater angle is subtended by the greater side"
statement = "In any triangle the greater angle is subtended by the greater side."
proof = "Therefore in any triangle the greater angle is subtended by the greater side. Q.E.D."

[[step]]
text = "Let ABC be a triangle having the angle ABC greater than the angle BCA. I say that the side AC is also greater than the side AB."
draw = [
  "clear",
  "point A 1 3",
  "point B 0 0",
  "point C 5 0",
  "polygon A B C blue",
  "angle A B C red fill",
  "angle A C B green fill",
]

[[step]]
text = "For if not, AC is either equal to AB or less. AC is not equal to AB, for then the angle ABC would be equal to the angle ACB (I.5), which it is not."
draw = [
  "segment A B black",
]

[[step]]
text = "Nor is AC less than AB, for then the angle ABC would be less than the angle ACB (I.18), which it is not. But it was proved not equal either."
draw = [
  "segment A C black",
]

[[step]]
text = "Therefore AC is greater than AB."
draw = [
  "segment A C red",
]
