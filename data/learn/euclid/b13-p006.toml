[[step]]
text = "Let BA be produced, and let AD be half of BA. Since the straight line AB has been cut in extreme and mean ratio, and to the greater segment AC the half of AB, namely AD, has been added, the square on CD is five times the square on DA (XIII.1). Therefore the square on CD has to the square on DA the ratio which a number has to a number. Therefore the square on CD is commensurable with the square on DA (X.6). But the square on DA is rational, for DA is rational, being half of AB, which is rational. Therefore the square on CD is also rational. Therefore CD is also rational. And since the square on CD has not to the square on DA the ratio which a square number has to a square number, CD is incommensurable in length with DA (X.9). Therefore CD, DA are rational straight lines commensurable in square only. Therefore AC is an apotome (X.73). Again, since AB has been cut in extreme and mean ratio, and AC is the greater segment, the rectangle AB, BC is equal to the square on AC. Therefore the square on the apotome AC, if applied to the rational straight line AB, produces as breadth BC. But the square on an apotome, if applied to a rational straight line, produces as breadth a first apotome (X.97). Therefore CB is a first apotome. And AC was proved to be an apotome."
