id = "XIII.6"
book = 13
order = 6
title = "The segments of a rational line cut in extreme and mean ratio"
statement = "If a rational straight line be cut in extreme and mean ratio, each of the segments is the irrational straight line called apotome."
proof = "Therefore if a rational straight line be cut in extreme and mean ratio, each of the segments is the irrational straight line called apotome. Q.E.D."

[[step]]
text = "Let AB be a rational straight line cut in extreme and mean ratio at C, and let AC be the greater segment. I say that each of the straight lines AC, CB is the irrational straight line called apotome."
