[[step]]
text = "For let the circle ABCDE be circumscribed about the pentagon ABCDE (IV.14). Then, since the two straight lines EA, AB are equal to the two AB, BC, and they contain equal angles, the base BE is equal to the base AC, the triangle ABE is equal to the triangle ABC, and the remaining angles will be equal to the remaining angles, namely those which the equal sides subtend (I.4). Therefore the angle BAC is equal to the angle ABE. Therefore the angle AHE is double of the angle BAH (I.32). But the angle EAC is also double of the angle BAC, since the circumference EDC is also double of the circumference CB (III.28, VI.33). Therefore the angle HAE is equal to the angle AHE. Hence the straight line HE is also equal to EA, that is, to AB (I.6). And since the straight line BA is equal to AE, the angle ABE is also equal to the angle AEB (I.5). But the angle ABE was proved equal to the angle BAH. Therefore the angle BEA is also equal to the angle BAH. And the angle ABE is common to the two triangles ABE and ABH. Therefore the remaining angle BAE is equal to the remaining angle AHB (I.32). Therefore the triangle ABE is equiangular with the triangle ABH. Therefore, proportionally, as EB is to BA, so is AB to BH (VI.4). But BA is equal to EH. Therefore, as BE is to EH, so is EH to HB. But BE is greater than EH. Therefore EH is also greater than HB. Therefore BE has been cut in extreme and mean ratio at H, and the greater segment HE is equal to the side of the pentagon. Similarly we can prove that AC has also been cut in extreme and mean ratio at H, and its greater segment CH is equal to the side of the pentagon."
