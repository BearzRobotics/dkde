id = "XIII.8"
book = 13
order = 8
title = "Diagonals of a pentagon"
statement = "If in an equilateral and equiangular pentagon straight lines subtend two angles taken in order, they cut one another in extreme and mean ratio, and their greater segments are equal to the side of the pentagon."
proof = "Therefore if in an equilateral and equiangular pentagon straight lines subtend two angles taken in order, they cut one another in extreme and mean ratio, and their greater segments are equal to the side of the pentagon. Q.E.D."

[[step]]
text = "For in the equilateral and equiangular pentagon ABCDE let the straight lines AC, BE, subtending two angles taken in order, those at A, B, cut one another at the point H. I say that each of them has been cut in extreme and mean ratio at the point H, and their greater segments are equal to the side of the pentagon."
