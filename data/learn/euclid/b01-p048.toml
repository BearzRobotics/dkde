id = "I.48"
book = 1
order = 49
title = "The converse of Pythagoras"
statement = "If in a triangle the square on one of the sides be equal to the squares on the remaining two sides of the triangle, the angle contained by the remaining two sides of the triangle is right."
proof = "Therefore if in a triangle the square on one of the sides be equal to the squares on the remaining two sides of the triangle, the angle contained by the remaining two sides of the triangle is right. Q.E.D."

[[step]]
text = "Let the square on BC, one of the sides of the triangle ABC, be equal to the squares on BA, AC. I say that the angle BAC is right."
draw = [
  "clear",
  "point A 0 0",
  "point B 3 0",
  "point C 0 4",
  "polygon A B C blue",
]

[[step]]
text = "Let AD be drawn from the point A at right angles to the straight line AC (I.11), let AD be made equal to BA (I.3), and let DC be joined."
draw = [
  "point D -3 0",
  "segment A D orange",
  "segment D C orange",
]

[[step]]
text = "Since DA is equal to AB, the square on DA is also equal to the square on AB. Add the square on AC to each. Then the squares on DA, AC are equal to the squares on BA, AC. But the square on DC is equal to the squares on DA, AC, for the angle DAC is right (I.47). And the square on BC is equal to the squares on BA, AC by hypothesis. Therefore the square on DC is equal to the square on BC, so DC is equal to BC."
draw = [
  "segment B C red",
  "segment D C red",
]

[[step]]
text = "Since DA is equal to AB, and AC is common, the two sides DA, AC are equal to the two sides BA, AC. And the base DC is equal to the base BC. Therefore the angle DAC is equal to the angle BAC (I.8). But the angle DAC is right. Therefore the angle BAC is also right."
draw = [
  "angle D A C green fill",
  "angle B A C green fill",
]
