[[step]]
text = "Since the angle EGB is equal to the angle GHD, and the angle EGB is equal to the angle AGH (I.15), the angle AGH is equal to the angle GHD. And they are alternate."
draw = [
  "angle A G H green fill",
  "angle G H D green fill",
]

[[step]]
text = "Therefore AB is parallel to CD (I.27)."
draw = [
]

[[step]]
text = "Again, suppose the angles BGH, GHD are equal to two right angles. Since the angles AGH, BGH are equal to two right angles (I.13), the angles AGH, BGH are equal to the angles BGH, GHD. Take away BGH from each. Then the angle AGH is equal to the angle GHD, and they are alternate. Therefore AB is parallel to CD (I.27)."
draw = [
  "angle B G H purple fill",
  "angle G H D purple fill",
]
