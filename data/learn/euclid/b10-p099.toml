[[step]]
text = "The square on AB is the squares on AC, CB (the whole and the annex) less twice the rectangle AC, CB (II.7). Apply to DE the areas equal to the squares and to twice the rectangle: the breadth for the squares is a sum of two terms, and the breadth for the twice-rectangle is the annex to it. As in X.60 to X.65 the breadths are rational lines with the commensurabilities with DE and the excess relations belonging to the third apotome (X.20, X.22, X.14); their difference is an apotome (X.73) of the third kind. Therefore DG is the third apotome."
