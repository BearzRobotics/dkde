title = "The square on the second apotome of a medial straight line"
statement = "The square on the second apotome of a medial straight line, if applied to a rational straight line, produces as breadth the third apotome."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB be the second apotome of a medial straight line with the annex BC, and let a rational straight line DE be set out. Apply to DE the rectangle DF equal to the square on AB, producing DG as breadth. I say that DG is the third apotome. Example: (1.457 less 1.189) squared is 2.5 times the square root of 2 less 2 times the square root of 3 (terms 3.536 and 3.464, the remainder 0.071)."
