id = "VIII.11"
book = 8
order = 11
title = "Between two squares"
statement = "Between two square numbers there is one mean proportional number, and the square has to the square the ratio duplicate of that which the side has to the side."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let A, B be square numbers, and let C be the side of A and D the side of B (here 9 and 16, sides 3 and 4). I say that between A, B there is one mean proportional number, and A has to B the ratio duplicate of that which C has to D."
