[[step]]
text = "Let C by multiplying D make E. Since A is a square and C is its side, C by multiplying itself has made A. For the same reason D by multiplying itself has made B. Since C by multiplying C, D has made A, E, C is to D as A is to E (VII.17). For the same reason, as C is to D, so is E to B (VII.18). Therefore, as A is to E, so is E to B. Therefore between the square numbers A, B there is one mean proportional number E (12). I say next that A has also to B the ratio duplicate of that which the side C has to the side D. For, since A, E, B are proportional, A has to B the ratio duplicate of that which A has to E (V definition 9). But A is to E as C is to D. Therefore A has to B the ratio duplicate of that which the side C has to the side D."
