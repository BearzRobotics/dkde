id = "XI.17"
book = 11
order = 17
title = "Parallel planes cut lines proportionally"
statement = "If two straight lines be cut by parallel planes, they will be cut in the same ratios."
proof = "Therefore if two straight lines be cut by parallel planes, they will be cut in the same ratios. Q.E.D."

[[step]]
text = "Let the two straight lines AB, CD be cut by the parallel planes GH, KL, MN at the points A, E, B and C, F, D. I say that, as the straight line AE is to EB, so is CF to FD."
