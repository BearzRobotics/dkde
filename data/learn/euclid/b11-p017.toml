[[step]]
text = "Let AC, AD, BD be joined, let AD meet the plane KL at O, and let EO, OF be joined. Since the two parallel planes KL, MN are cut by the plane EBDO, their common sections EO, BD are parallel (XI.16). For the same reason, since the two parallel planes GH, KL are cut by the plane AODC, their common sections AC, OF are parallel. And since EO has been drawn parallel to BD, one of the sides of the triangle ABD, as AE is to EB, so is AO to OD (VI.2). Again, since OF has been drawn parallel to AC, one of the sides of the triangle ADC, as AO is to OD, so is CF to FD. But it was proved that as AO is to OD, so is AE to EB. Therefore also, as AE is to EB, so is CF to FD (V.11)."
