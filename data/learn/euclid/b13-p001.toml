[[step]]
text = "Describe the squares AE, DF on AB, AD and draw the figure. Since AB has been cut in extreme and mean ratio at C, the rectangle AB, BC is equal to the square on AC (VI.17). Since BA is double of AD, the square on AB is four times the square on AD. The square AE is the rectangle AB, BC together with the rectangle AB, AC; and AB, BC equals the square on AC. So the square on AB is equal to the square on AC together with the rectangle AB, AC."
