id = "XIII.1"
book = 13
order = 1
title = "The square on the greater segment"
statement = "If a straight line be cut in extreme and mean ratio, the square on the greater segment added to the half of the whole is five times the square on the half."
proof = "Therefore if a straight line be cut in extreme and mean ratio, the square on the greater segment added to the half of the whole is five times the square on the half. Q.E.D."

[[step]]
text = "Let the straight line AB be cut in extreme and mean ratio at the point C, AC being the greater segment, and let AD be the half of AB. I say that the square on the straight line made up of CA and AD is five times the square on AD."
