[[step]]
text = "Therefore the square on CA, AD taken as one line is the square on CA, together with twice the rectangle CA, AD, together with the square on AD (II.4). Twice the rectangle CA, AD is the rectangle CA, AB, since AB is double of AD. So the square on CA, AD is the square on CA plus the rectangle CA, AB plus the square on AD, that is, the square on AB plus the square on AD. But the square on AB is four times the square on AD. Therefore the square on CA, AD is five times the square on AD."
