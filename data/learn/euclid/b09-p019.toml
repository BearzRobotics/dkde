id = "IX.19"
book = 9
order = 19
title = "A fourth proportional to three numbers"
statement = "Given three numbers, to investigate when it is possible to find a fourth proportional to them."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let A, B, C be the given three numbers (here 2, 6 and 3), and let it be required to investigate when it is possible to find a fourth proportional to them, a number D with A to B as C to D."
draw = [
  "clear",
  "point A 0 0",
  "point a 0.7 0",
  "segment A a blue",
  "point B 0 -0.9",
  "point b 2.1 -0.9",
  "segment B b red",
  "point C 0 -1.8",
  "point c 1.05 -1.8",
  "segment C c green",
  "point D 0 -2.7",
  "point d 3.15 -2.7",
  "segment D d orange",
]

[[step]]
text = "If a fourth proportional D exists, then the product of A and D equals the product of B and C (VII.19). So A must measure the product of B and C. If A, B, C are in continued proportion and the extremes A, C are prime to one another, no fourth proportional exists (IX.17). If they are not in continued proportion, and A, C are prime, then too it is impossible. In general the test is this."
draw = [
]

[[step]]
text = "Let B by multiplying C make E (here 18). If A measures E, say according to D (here 9), then A by multiplying D makes E, which is B times C; so A is to B as C is to D (VII.19), and D is the fourth proportional. If A does not measure E, then there is no number D with A times D equal to E, and so no fourth proportional can be found."
