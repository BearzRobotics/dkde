]

[[step]]
text = "D is medial (X.21). Since B is to C as D is to E, and B, C are commensurable in square only, D, E are commensurable in square only (the ratio of squares is the ratio of the squares on B, C), and E is commensurable with a medial line... so E is medial (X.23). Further, since B is to C as D is to E, alternately as B is to D so is C to E; but B is to D as D is to A; therefore, as D is to A, so is C to E, so the rectangle A, C is equal to the rectangle D, E. But the rectangle A, C is medial (X.21), as the rectangle of rational lines commensurable in square only. So the rectangle D, E is medial (here its area is the square root of 3)."
