id = "X.28"
book = 10
order = 28
title = "Medial lines containing a medial rectangle"
statement = "To find medial straight lines commensurable in square only which contain a medial rectangle."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let there be set out three rational straight lines A, B, C commensurable in square only (1, the square root of 2, the square root of 3), and let D be taken a mean proportional between A, B (D = the fourth root of 2), and let it be that, as B is to C, so is D to E. I say that D, E are medial straight lines commensurable in square only which contain a medial rectangle."
