id = "VII.3"
book = 7
order = 3
title = "The greatest common measure of three numbers"
statement = "Given three numbers not prime to one another, to find their greatest common measure."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let A, B, C be the three given numbers not prime to one another (here 24, 36, 60). It is required to find the greatest common measure of A, B, C. Let the greatest common measure of the two numbers A, B be taken (VII.2), and let it be D (here 12)."
