[[step]]
text = "Then D either measures C or does not. First let it measure it. Since it measures A, B, it is a common measure of A, B, C. And it is the greatest, for D is the greatest common measure of A, B. But if D does not measure C, then, since C, D are not prime to one another (each is measured by some number, since A, B, C are not prime to one another and anything measuring A, B, C measures D), let the greatest common measure E of C, D be taken. Since E measures D, and D measures A, B, E also measures A, B. But it also measures C. Therefore E is a common measure of A, B, C. I say next that it is also the greatest. For if not, let some number F, greater than E, measure A, B, C. Since F measures A, B, it measures the greatest common measure D of A, B. But it also measures C. Therefore F measures C, D, and so measures the greatest common measure E of C, D, the greater the less, which is impossible. Therefore E is the greatest common measure of A, B, C."
