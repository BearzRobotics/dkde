title = "Two lines: medial sum, medial rectangle, incommensurable"
statement = "To find two straight lines incommensurable in square which make the sum of the squares on them medial and the rectangle contained by them medial and moreover incommensurable with the sum of the squares on them."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let there be set out two medial straight lines AB, BC commensurable in square only and containing a medial rectangle, such that the square on AB is greater than the square on BC by the square on a straight line incommensurable with AB (as in X.28: here AB = 1.457 and BC = 1.189, whose rectangle is the square root of 3, and the square on AB exceeds the square on BC by the square on a line incommensurable with AB). On AB describe the semicircle ADB, and do the rest as in X.34. I say that AD, DB are incommensurable in square, and make the sum of the squares on them medial and the rectangle contained by them medial and incommensurable with the sum of the squares."
