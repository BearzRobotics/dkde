]

[[step]]
text = "Since AB is incommensurable with BC, AF is incommensurable with FB, so AD, DB are incommensurable in square. The sum of the squares on them is the square on AB, which is medial. The rectangle AD, DB equals the rectangle AB, DF, and the rectangle AB, BE... since AB, BC contain a medial rectangle, so does the rectangle AB, BE, and the rectangle AD, DB is medial. And since the square on AB is incommensurable with the rectangle AB, BC (AB is incommensurable with BC), the sum of the squares on AD, DB is incommensurable with the rectangle AD, DB."
