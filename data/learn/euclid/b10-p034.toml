id = "X.34"
book = 10
order = 34
title = "Two lines: medial sum of squares, rational rectangle"
statement = "To find two straight lines incommensurable in square which make the sum of the squares on them medial but the rectangle contained by them rational."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let there be set out two medial straight lines AB, BC commensurable in square only and containing a rational rectangle, such that the square on AB is greater than the square on BC by the square on a straight line incommensurable with AB (X.32). On AB describe the semicircle ADB, bisect BC at E, apply to AB a parallelogram equal to the square on BE and deficient by a square, namely the rectangle AF, FB, and draw FD at right angles to AB and join AD, DB. I say that AD, DB are incommensurable in square, that the sum of the squares on them is medial, and that the rectangle contained by them is rational."
draw = [
