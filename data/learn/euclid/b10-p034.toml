]

[[step]]
text = "Since AF is incommensurable with FB (X.18), the squares on AD, DB, which are in that ratio, are incommensurable (as in X.33), so AD, DB are incommensurable in square. The sum of the squares on AD, DB is the square on AB, which is medial (AB is medial). The rectangle AD, DB equals the rectangle AB, DF (as before). Now DF is the mean of AF, FB and the rectangle AB, DF equals the rectangle AB, BE... equal to half of the rectangle AB, BC, which is rational. So the rectangle contained by AD, DB is rational."
