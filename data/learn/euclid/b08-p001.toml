[[step]]
text = "If not, let E, F, G, H be less than A, B, C, D and in the same ratio. Since A, B, C, D are in the same ratio with E, F, G, H and are equal to them in multitude, ex aequali A is to D as E is to H (VII.14). But A, D are prime to one another, and numbers prime to one another are the least of those which have the same ratio (VII.21), and the least measure those which have the same ratio the same number of times, the greater the greater and the less the less (VII.20). So A measures E, the greater the less, which is impossible. Therefore there are no numbers less than A, B, C, D in the same ratio; they are the least."
