id = "VIII.1"
book = 8
order = 1
title = "Continued proportion with prime extremes"
statement = "If there be as many numbers as we please in continued proportion, and the extremes of them be prime to one another, the numbers are the least of those which have the same ratio with them."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let A, B, C, D be as many numbers as we please in continued proportion (here 8, 12, 18, 27), and let A, D be prime to one another. I say that A, B, C, D are the least of those which have the same ratio with them."
