id = "III.7"
book = 3
order = 7
title = "Distances from a point on a diameter"
statement = "If on the diameter of a circle a point be taken which is not the centre of the circle, and from the point straight lines fall upon the circle, that will be greatest on which the centre is, the remainder of the same diameter will be least, and of the rest the nearer to the straight line through the centre is always greater than the more remote, and only two equal straight lines will fall from the point on the circle, one on each side of the least straight line."
proof = "Therefore if on the diameter of a circle a point be taken which is not the centre of the circle, and from the point straight lines fall upon the circle, that will be greatest on which the centre is, the remainder of the same diameter will be least, and of the rest the nearer to the straight line through the centre is always greater than the more remote, and only two equal straight lines will fall from the point on the circle, one on each side of the least straight line. Q.E.D."

[[step]]
text = "Let ABCD be a circle and AD a diameter of it. On AD let a point F be taken which is not the centre of the circle, and let E be the centre. From F let certain straight lines FB, FC, FG fall on the circle. I say that FA is greatest, FD least, and of the others FB is greater than FC, and FC than FG."
