  "segment F C black",
  "segment F G black",
]

[[step]]
text = "Let BE, CE, GE be joined. Since in any triangle two sides are greater than the remaining one (I.20), EB, EF are greater than BF. But EB is equal to AE. Therefore AE, EF, that is AF, is greater than BF. Therefore AF is greater than BF."
draw = [
  "segment E B green",
  "segment E C green",
  "segment E G green",
  "segment F A red",
]

[[step]]
text = "Again, since BE is equal to CE, and FE is common, the two sides BE, EF are equal to the two sides CE, EF. But the angle BEF is greater than the angle CEF. Therefore the base BF is greater than the base CF (I.24). For the same reason CF is greater than GF."
draw = [
  "angle B E F orange fill",
  "angle C E F orange fill",
]

[[step]]
text = "Again, GF, FE are greater than EG (I.20), and EG is equal to ED. Therefore GF, FE are greater than ED. Take away EF from each. Then GF is greater than FD. Therefore FA is greatest, FD least, and FB greater than FC, FC than FG. I say also that from the point F only two equal straight lines will fall on the circle, one on each side of the least FD. For if a third FH were equal to FG, then the angle on one side would have to be equal to the angle on the other, FH being nearer or farther than FG, which is impossible (I.24)."
draw = [
  "segment F D green",
]
