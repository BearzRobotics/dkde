id = "I.18"
book = 1
order = 19
title = "The greater side subtends the greater angle"
statement = "In any triangle the greater side subtends the greater angle."
proof = "Therefore in any triangle the greater side subtends the greater angle. Q.E.D."

[[step]]
text = "Let ABC be a triangle having the side AC greater than AB. I say that the angle ABC is also greater than the angle BCA."
draw = [
  "clear",
  "point A 1 3",
  "point B 0 0",
  "point C 5 0",
  "polygon A B C blue",
  "segment A C red",
]

[[step]]
text = "Since AC is greater than AB, let AD be made equal to AB (I.3), and let BD be joined."
draw = [
  "point D 3.53 1.103",
  "segment B D orange",
]

[[step]]
text = "Since the angle ADB is an exterior angle of the triangle BCD, it is greater than the interior and opposite angle DCB (I.16). But the angle ADB is equal to the angle ABD, since the side AB is equal to AD (I.5). Therefore the angle ABD is greater than the angle ACB."
draw = [
  "angle A D B orange fill",
  "angle D C B green fill",
]

[[step]]
text = "Therefore the angle ABC is much greater than the angle ACB."
draw = [
  "angle A B C red fill",
  "angle A C B green fill",
]
