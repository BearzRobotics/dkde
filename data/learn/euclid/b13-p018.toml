[[step]]
text = "Let the diameter AB of the given sphere be set out and cut at C so that AC is equal to CB, and again at D so that AD is double DB. On AB describe the semicircle AEB, draw from C, D the straight lines CE, DF at right angles to AB, and join AF, FB, EB. Since AD is double DB, AB is triple of DB; and, by conversion, BA is to AD as three to two. But as BA is to AD, so is the square on BA to the square on AF (VI.8 corollary). Therefore the square on BA is one and a half times the square on AF. But the square on the diameter of the sphere is also one and a half times the square on the side of the pyramid (XIII.13). Therefore AF is equal to the side of the pyramid. Again, since AC is equal to CB, AB is double of BC; as AB is to BC, so is the square on AB to the square on BE, so the square on AB is double the square on BE. But the square on the diameter of the sphere is double the square on the side of the octahedron (XIII.14). Therefore EB is equal to the side of the octahedron. Let a straight line GH be set out equal to AB, cut at K so that GK is double KH. Then the square on GH is triple of the square on GK... so GK is equal to the side of the cube (XIII.15). Since the square on AB is five times the square on BC... and so on, the remaining two sides are the minor and the apotome lines: the side of the icosahedron is the minor line (XIII.16) and that of the dodecahedron the apotome (XIII.17). Comparing them: the side of the tetrahedron, AF, is greater than that of the octahedron, EB, which is greater than that of the cube, GK, which is greater than that of the icosahedron, which is greater than that of the dodecahedron. In numbers, with the sphere's radius 1, the sides are: tetrahedron 1.633, octahedron 1.414, cube 1.155, icosahedron 1.051, dodecahedron 0.714."
