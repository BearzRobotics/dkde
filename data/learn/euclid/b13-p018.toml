[[step]]
text = "Corollary. I say that no other figure, besides the said five figures, can be constructed which is contained by equilateral and equiangular figures equal to one another. For a solid angle cannot be made with two triangles, or indeed two planes (XI definition 11). With three triangles the angle of the pyramid is made, with four that of the octahedron, and with five that of the icosahedron; but a solid angle cannot be formed by six equilateral and equiangular triangles placed together at one point, for, the angle of the equilateral triangle being two thirds of a right angle, the six would be equal to four right angles, which is impossible, since every solid angle is contained by angles less than four right angles (XI.21). For the same reason a solid angle cannot be constructed by more than six plane angles. By three squares the angle of the cube is contained; by four squares it is impossible, for they would again be four right angles. By three equilateral and equiangular pentagons the angle of the dodecahedron is contained; by four it is impossible, for the angle of the pentagon being a right angle and a fifth, four would be greater than four right angles, which is impossible. Neither will a solid angle be contained by other polygonal figures by reason of the same absurdity. Therefore no other figure, besides the said five figures, can be constructed which is contained by equilateral and equiangular figures."
