id = "XIII.18"
book = 13
order = 18
title = "The five solids compared"
statement = "To set out the sides of the five figures and to compare them with one another."
proof = "Therefore the sides of the five figures have been set out and compared. Corollary: no other figure, besides the said five figures, can be constructed which is contained by equilateral and equiangular figures equal to one another."

[[step]]
text = "The five regular solids, drawn in the same sphere (left to right): the tetrahedron, the octahedron, the cube, the icosahedron and the dodecahedron."
