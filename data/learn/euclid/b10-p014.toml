  "segment F f teal",
]

[[step]]
text = "Since A is to B as C is to D, the square on A is to the square on B as the square on C is to the square on D. Componendo/convertendo, the square on A is to the square on E as the square on C is to the square on F, where F² = C² − D². Hence A is to E as C is to F. Since A is commensurable with E, C is commensurable with F (X.11). The incommensurable case follows in the same way: A incommensurable with E gives C incommensurable with F."
