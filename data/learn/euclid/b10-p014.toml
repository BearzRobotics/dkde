id = "X.14"
book = 10
order = 14
title = "Squares on proportional lines"
statement = "If four straight lines be proportional, and the square on the first be greater than the square on the second by the square on a straight line commensurable with the first, the square on the third will also be greater than the square on the fourth by the square on a straight line commensurable with the third. And, if the square on the first be greater than the square on the second by the square on a straight line incommensurable with the first, the square on the third will also be greater than the square on the fourth by the square on a straight line incommensurable with the third."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let A, B, C, D be four proportional straight lines (here 5, 3, 10, 6), and let the square on A be greater than the square on B by the square on E (E = 4, since 25 less 9 is 16), where E is commensurable with A. I say that the square on C is greater than the square on D by the square on a line F commensurable with C (F = 8)."
