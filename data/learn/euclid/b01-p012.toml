id = "I.12"
book = 1
order = 13
title = "A perpendicular from a point not on the line"
statement = "To draw a straight line perpendicular to a given infinite straight line from a given point that is not on it."
proof = "Therefore the straight line CH has been drawn perpendicular to the given infinite straight line AB from the given point C which is not on it. Being what it was required to do."

[[step]]
text = "Let AB be the given infinite straight line, and C the given point not on it. It is required to draw from C a perpendicular to AB."
draw = [
  "clear",
  "point A -4 0",
  "point B 4 0",
  "point C 1 3",
  "line A B blue",
]

[[step]]
text = "Let a point D be taken at random on the other side of AB from C. With centre C and distance CD let the circle EFG be described (postulate 3). It meets AB at F and G."
draw = [
  "point D 2 -2.2",
  "circle C D orange",
  "cross F lc A B C D 0",
  "cross G lc A B C D 1",
]

[[step]]
text = "Let FG be bisected at H (I.10), and let CF, CH, CG be joined."
draw = [
  "point H 1 0",
  "segment C F black",
  "segment C G black",
  "segment C H red",
]

[[step]]
text = "Since FH is equal to HG, and HC is common, the two sides FH, HC are equal to the two sides GH, HC respectively. And the base CF is equal to the base CG. Therefore the angle CHF is equal to the angle CHG (I.8), and they are adjacent, so each is right (definition 10). Therefore CH is perpendicular to AB."
draw = [
  "angle C H F green fill",
  "angle G H C green fill",
]
