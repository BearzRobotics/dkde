id = "VII.13"
book = 7
order = 13
title = "Alternately"
statement = "If four numbers be proportional, they will also be proportional alternately."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let the four numbers A, B, C, D be proportional, so that A is to B as C is to D. I say that they will also be proportional alternately, so that A is to C as B is to D. (Here 2 : 3 = 4 : 6 and 2 : 4 = 3 : 6.)"
