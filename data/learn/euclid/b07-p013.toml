  "point C 0 -1.8",
  "point c 2 -1.8",
  "segment C c green",
  "point D 0 -2.7",
  "point d 3 -2.7",
  "segment D d orange",
]

[[step]]
text = "Since A is to B as C is to D, A is the same part or parts of B that C is of D. Therefore, alternately, A is the same part or parts of C that B is of D (VII.9, 10). Therefore, as A is to C, so is B to D."
