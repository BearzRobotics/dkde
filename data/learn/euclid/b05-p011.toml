[[step]]
text = "Let equimultiples G, H, K be taken of A, C, E, and other equimultiples L, M, N of B, D, F. Since A:B = C:D, and G, H are equimultiples of A, C and L, M of B, D, then if G exceeds L, H exceeds M; if equal, equal; if less, less. Again, since C:D = E:F, and H, K are equimultiples of C, E and M, N of D, F, then if H exceeds M, K exceeds N; if equal, equal; if less, less."
draw = [
]

[[step]]
text = "But we saw that if H exceeds M, G exceeds L; if equal, equal; if less, less. Therefore also if G exceeds L, K exceeds N; if equal, equal; if less, less. And G, K are equimultiples of A, E, and L, N of B, F. Therefore A:B = E:F."
