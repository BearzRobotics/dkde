id = "V.11"
book = 5
order = 11
title = "Ratios the same as the same ratio"
statement = "Ratios which are the same with the same ratio are the same with one another."
proof = "Therefore ratios which are the same with the same ratio are the same with one another. Q.E.D."

[[step]]
text = "For let A be to B as C is to D, and C to D as E to F. I say that A is to B as E is to F."
