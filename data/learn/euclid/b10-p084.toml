id = "X.84"
book = 10
order = 84
title = "Only one annex"
statement = "To that which produces with a medial area a medial whole only one straight line can be annexed which is incommensurable in square with the whole straight line and which with the whole makes the sum of the squares on them medial and the rectangle contained by them medial and also incommensurable with the sum of the squares on them."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Take a straight line AB which produces with a medial area a medial whole. I say that no second straight line of the same kind can be annexed to it."
draw = [
  "clear",
  "point AB 0 0",
  "point ab 0.188 0",
  "segment AB ab blue",
  "point BC 0 -0.9",
  "point bc 1.212 -0.9",
  "segment BC bc red",
  "point BD 0 -1.8",
  "point bd 0.84 -1.8",
  "segment BD bd green",
]

[[step]]
text = "Suppose two such annexes BC, BD. Applying the equal areas to a rational line leads to two different binomials' terms, which is impossible, since an apotome admits one annex only (X.79, with X.81 for the medial case): the breadths would give an apotome with two rational annexes. Impossible."
