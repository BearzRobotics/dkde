[[step]]
text = "By the preceding proposition, a rational square applied to the apotome produces as breadth a binomial commensurable with CD, with terms in the same ratio. So the rectangle contained by the apotome and the binomial CD has to the rational square the ratio of a number to a number, so it is a rational area (X.6). Therefore the side of the square equal to it is rational. (Corollary: a rational area can be contained by irrational straight lines.)"
