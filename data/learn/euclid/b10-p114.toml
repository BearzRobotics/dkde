title = "An apotome and a binomial: the area is rational"
statement = "If an area be contained by an apotome and the binomial the terms of which are commensurable with the terms of the apotome and in the same ratio, the side of the area is rational."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let the area be contained by the apotome AB (here 2 less the square root of 3) and the binomial CD (2 plus the square root of 3) whose terms are commensurable with the terms of the apotome and in the same ratio. I say that the side of the area is rational (here the area is 1 and the side 1)."
