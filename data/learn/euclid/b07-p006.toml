id = "VII.6"
book = 7
order = 6
title = "The same parts of the sum"
statement = "If a number be parts of a number, and another be the same parts of another, the sum will also be the same parts of the sum that the one is of the one."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let the number AB be parts of the number C, and another number DE the same parts of another number F that AB is of C. I say that the sum of AB, DE is also the same parts of the sum of C, F that AB is of C. (Here 9 is three fifths of 15, and 12 is three fifths of 20; and so 21 is three fifths of 35.)"
