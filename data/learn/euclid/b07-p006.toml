]

[[step]]
text = "Since AB is parts of C, AB is divided into as many parts of C as AB is parts of C. Let AB be divided into the parts of C, AG, GB, and DE into the parts of F, DH, HE. Then the multitude of AG, GB is equal to the multitude of DH, HE. Since whatever part AG is of C, the same part is DH of F, whatever part AG is of C, the same part is the sum of AG, DH of the sum of C, F (VII.5). For the same reason, whatever part GB is of C, the same part is the sum of GB, HE of the sum of C, F. Therefore whatever parts AB is of C, the same parts is the sum of AB, DE of the sum of C, F."
