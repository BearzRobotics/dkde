id = "XI.23"
book = 11
order = 23
title = "To construct a solid angle"
statement = "To construct a solid angle out of three plane angles, two of which, taken together in any manner, are greater than the remaining one: thus the three angles must be less than four right angles."
proof = "Therefore out of the three plane angles ABC, DEF, GHK the solid angle at O has been constructed. Being what it was required to do."

[[step]]
text = "Let the three given plane angles be ABC, DEF, GHK, of which two, taken together in any manner, are greater than the remaining one, and also all three together are less than four right angles. It is required to construct a solid angle out of angles equal to ABC, DEF, GHK."
