[[step]]
text = "Since whatever part A is of BC, the same part is D of EF, as many numbers as there are in BC equal to A, so many are there in EF equal to D. Let BC be divided into the numbers equal to A, namely BG, GC, and EF into the numbers equal to D, namely EH, HF. Then the multitude of BG, GC will be equal to the multitude of EH, HF. And since BG is equal to A, and EH to D, BG, EH together are equal to A, D together. For the same reason GC, HF together are equal to A, D together. Therefore as many numbers as there are in BC equal to A, so many are there in BC, EF together equal to A, D together. Therefore whatever part A is of BC, the same part is the sum of A, D of the sum of BC, EF."
