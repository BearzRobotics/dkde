id = "VII.5"
book = 7
order = 5
title = "The same part of the sum"
statement = "If a number be part of a number, and another be the same part of another, the sum will also be the same part of the sum that the one is of the one."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "For let a number A be a part of BC, and another D the same part of another EF that A is of BC. I say that the sum of A, D is also the same part of the sum of BC, EF that A is of BC. (Here A = 4 is a third of BC = 12, and D = 5 is a third of EF = 15; and so 9 is a third of 27.)"
