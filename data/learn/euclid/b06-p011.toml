id = "VI.11"
book = 6
order = 11
title = "A third proportional"
statement = "To two given straight lines to find a third proportional."
proof = "Therefore to the two given straight lines A, B a third proportional C has been found. Being what it was required to do."

[[step]]
text = "Let BA, AC be the two given straight lines, and let them be placed so as to contain any angle. It is required to find a third proportional to BA, AC. Let them be produced to the points D, E, and let BD be made equal to AC (I.3). Let BC be joined, and through D let DE be drawn parallel to it."
