[[step]]
text = "Since BC has been drawn parallel to DE, one of the sides of the triangle ADE, proportionally, as AB is to BD, so is AC to CE (VI.2). But BD is equal to AC. Therefore, as AB is to AC, so is AC to CE. Therefore to the two given straight lines AB, AC a third proportional CE has been found."
