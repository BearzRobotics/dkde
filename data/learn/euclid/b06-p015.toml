[[step]]
text = "Let them be placed so that CA is in a straight line with AD; therefore EA is also in a straight line with AB (I.14). Let BD be joined. Since the triangle ABC is equal to the triangle ADE, and BAD is another area, the triangle CAB is to the triangle BAD as the triangle EAD is to the triangle BAD (V.7). But the triangle CAB is to BAD as CA is to AD (VI.1), and EAD is to BAD as EA is to AB. Therefore CA is to AD as EA is to AB. The converse is proved by reversing the argument."
