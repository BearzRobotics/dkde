id = "VI.15"
book = 6
order = 15
title = "Equal triangles: reciprocal sides"
statement = "Equal triangles which have one angle equal to one angle have the sides about the equal angles reciprocally proportional; and those triangles which have one angle equal to one angle, and the sides about the equal angles reciprocally proportional, are equal."
proof = "Therefore equal triangles which have one angle equal to one angle have the sides about the equal angles reciprocally proportional; and those triangles which have one angle equal to one angle, and the sides about the equal angles reciprocally proportional, are equal. Q.E.D."

[[step]]
text = "Let ABC, ADE be equal triangles having one angle equal to one angle, namely the angle BAC to the angle DAE. (Here ABC has sides 4 and 3, and ADE has sides 6 and 2.) I say that in the triangles ABC, ADE the sides about the equal angles are reciprocally proportional, that is, CA is to AD as EA is to AB."
