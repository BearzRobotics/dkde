title = "The side of a rational plus a medial area"
statement = "If two straight lines incommensurable in square, which make the sum of the squares on them medial but the rectangle contained by them rational, be added together, the whole straight line is irrational; and let it be called the side of a rational plus a medial area."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let the two straight lines AB, BC incommensurable in square, making the sum of the squares on them medial and the rectangle contained by them rational, be added together (as found in X.34: here 1.554 and 0.644). I say that AC is irrational, and is called the side of a rational plus a medial area (its length is 2.198)."
draw = [
  "clear",
  "point AB 0 0",
  "point ab 1.088 0",
  "segment AB ab blue",
  "point BC 0 -0.9",
  "point bc 0.451 -0.9",
  "segment BC bc red",
  "point AC 0 -1.8",
  "point ac 1.539 -1.8",
  "segment AC ac green",
]

[[step]]
text = "The square on AC is the squares on AB, BC (medial) together with twice the rectangle AB, BC (rational). A medial area plus a rational area is irrational, since a medial area cannot exceed a rational one by a rational (X.26 and the corresponding fact). So the square on AC is irrational and AC is irrational. It is so called because its square is made of a rational and a medial area."
