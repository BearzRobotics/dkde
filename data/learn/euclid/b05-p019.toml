[[step]]
text = "Since AB:CD = AE:CF, alternately BA:AE = DC:CF (V.16). Since the magnitudes are proportional componendo, they will also be proportional separando (V.17), that is, BE:EA = DF:FC. Alternately BE:DF = EA:FC. But AE:CF = AB:CD by hypothesis."
draw = [
]

[[step]]
text = "Therefore the remainder BE is also to the remainder FD as the whole AB is to the whole CD. Corollary: if magnitudes are proportional componendo, they are also proportional convertendo, that is, (a + b) : a = (c + d) : c."
draw = [
]
