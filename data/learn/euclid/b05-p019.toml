id = "V.19"
book = 5
order = 19
title = "Subtraction of proportions"
statement = "If, as a whole is to a whole, so is a part subtracted to a part subtracted, the remainder will also be to the remainder as whole to whole."
proof = "Therefore if, as a whole is to a whole, so is a part subtracted to a part subtracted, the remainder will also be to the remainder as whole to whole. Q.E.D."

[[step]]
text = "For, as the whole AB is to the whole CD, so let the part subtracted AE be to the part subtracted CF. I say that the remainder EB will also be to the remainder FD as the whole AB to the whole CD."
draw = [
