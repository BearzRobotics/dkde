]

[[step]]
text = "Construction. Take numbers A, B, C so that the ratios are as for the third, with the first not to the second as a square. Then the terms of the binomial are two rational straight lines commensurable in square only, with the stated relation to the assigned rational line and the stated excess of squares (X.29 and X.30 give the excess; X.6 and X.9 the commensurability). Then the sum is the sixth binomial straight line, as defined."
