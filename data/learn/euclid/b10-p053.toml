title = "To find the sixth binomial"
statement = "To find the sixth binomial straight line."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "The sixth binomial is the binomial with neither term commensurable in length with the assigned rational line, and the square on the greater exceeding the square on the less by the square on a line incommensurable with the greater. It is required to find one. (Example: the terms the square root of 3 and the square root of 2 (the difference of squares is 1); the whole is 3.146.)"
