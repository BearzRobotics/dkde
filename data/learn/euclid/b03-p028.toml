title = "Equal chords cut off equal arcs"
statement = "In equal circles equal straight lines cut off equal circumferences, the greater equal to the greater and the less to the less."
proof = "Therefore in equal circles equal straight lines cut off equal circumferences, the greater equal to the greater and the less to the less. Q.E.D."

[[step]]
text = "Let ABC, DEF be equal circles, and in them let AB, DE be equal straight lines cutting off BC, EF as the greater circumferences and BG, EH as the less. I say that the greater circumference BAC is equal to the greater circumference EDF, and the less circumference BGC to EHF."
