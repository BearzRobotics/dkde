[[step]]
text = "Let the centres K, L of the circles be taken, and let AK, KB, DL, LE be joined. Since the circles are equal, the radii are equal. Thus the two sides AK, KB are equal to the two sides DL, LE, and the base AB is equal to the base DE. Therefore the angle AKB is equal to the angle DLE (I.8). But equal angles stand on equal circumferences when they are at the centres (III.26). Therefore the circumference AGB is equal to DHE. But the whole circle ABC is also equal to the whole circle DEF. Therefore the remaining circumference ACB is also equal to the remaining circumference DFE."
