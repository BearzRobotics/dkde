[[step]]
text = "For if the cylinder is not triple of the cone, the cylinder will be either greater than triple or less than triple of the cone. First let it be greater than triple, and let the square ABCD be inscribed in the circle ABCD (IV.6). The square ABCD is greater than the half of the circle ABCD. On the square ABCD let there be set up a prism of the same height as the cylinder. The prism so set up is greater than the half of the cylinder, since, if we circumscribe a square about the circle ABCD (IV.7) and set up on it a prism of the same height, the inscribed prism is half of the circumscribed, and the cylinder is less than the circumscribed prism. Bisect the circumferences AB, BC, CD, DA at the points E, F, G, H, and join AE, EB, BF, FC, CG, GD, DH, HA. Then each of the triangles AEB, BFC, CGD, DHA is greater than the half of the segment of the circle about it (XII.2). On each of the triangles set up prisms of the same height as the cylinder. Each of the prisms so set up is greater than the half of the part of the cylinder about it. Thus, by bisecting the circumferences that are left and joining straight lines, setting up on the triangles prisms of the same height as the cylinder, and doing this continually, we shall leave some segments of the cylinder which will be less than the excess by which the cylinder exceeds triple the cone (X.1). Let such segments be left, and let them be those on AE, EB, BF, FC, CG, GD, DH, HA. Therefore the remainder, the prism of which the polygon AEBFCGDH is the base and the height is the same as that of the cylinder, is greater than triple the cone."
