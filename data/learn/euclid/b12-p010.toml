id = "XII.10"
book = 12
order = 10
title = "A cone is a third of its cylinder"
statement = "Any cone is a third part of the cylinder which has the same base with it and equal height."
proof = "Therefore any cone is a third part of the cylinder which has the same base with it and equal height. Q.E.D."

[[step]]
text = "For let a cone have the same base as a cylinder, namely the circle ABCD, and equal height. I say that the cone is a third part of the cylinder, that is, that the cylinder is triple of the cone."
