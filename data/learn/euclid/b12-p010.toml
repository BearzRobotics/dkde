[[step]]
text = "But the prism of which the polygon AEBFCGDH is the base and the height the same as that of the cylinder is triple of the pyramid of which the polygon AEBFCGDH is the base and the vertex is the same as that of the cone (XII.7 corollary). Therefore the pyramid of which the polygon AEBFCGDH is the base and the vertex is the same as that of the cone is greater than the cone which has the circle ABCD as base, which is absurd, since it is inscribed in it. Therefore the cylinder is not greater than triple of the cone. I say next that neither is the cylinder less than triple of the cone. For, if possible, let the cylinder be less than triple of the cone. Then, inversely, the cone is greater than a third part of the cylinder. Let the square ABCD be inscribed in the circle ABCD; then the pyramid of which the square is the base and the vertex the same as that of the cone is greater than the half of the cone (as above, with the circumscribed square). Bisect the circumferences and so on until we leave some segments of the cone which are less than the excess by which the cone exceeds the third part of the cylinder. Then the pyramid with the polygon as base is greater than the third part of the cylinder. But the pyramid is a third part of the prism, which is inscribed in the cylinder. Therefore the prism inscribed in the cylinder is greater than the cylinder, which is absurd. Therefore the cylinder is neither greater nor less than triple of the cone; therefore it is triple of it."
