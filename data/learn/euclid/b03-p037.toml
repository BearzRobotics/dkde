id = "III.37"
book = 3
order = 37
title = "The converse: a tangent"
statement = "If a point be taken outside a circle and from the point there fall on the circle two straight lines, if one of them cut the circle, and the other fall on it, and if further the rectangle contained by the whole of the straight line which cuts the circle and the straight line intercepted on it outside between the point and the convex circumference be equal to the square on the straight line which falls on the circle, the straight line which falls on it will touch the circle."
proof = "Therefore if a point be taken outside a circle and from the point there fall on the circle two straight lines, if one of them cut the circle, and the other fall on it, and if further the rectangle contained by the whole of the straight line which cuts the circle and the straight line intercepted on it outside between the point and the convex circumference be equal to the square on the straight line which falls on the circle, the straight line which falls on it will touch the circle. Q.E.D."

[[step]]
text = "Let a point D be taken outside the circle ABC, and from D let the two straight lines DCA, DB fall on the circle ABC, DCA cutting it and DB falling on it, and let the rectangle AD, DC be equal to the square on DB. I say that DB touches the circle ABC."
