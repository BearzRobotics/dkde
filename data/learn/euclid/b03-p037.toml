[[step]]
text = "Let DE be drawn touching the circle ABC (III.17), let the centre F be taken, and let FE, FB, FD be joined. Then the angle FED is right (III.18). Since DE touches the circle ABC and DCA cuts it, the rectangle AD, DC is equal to the square on DE (III.36). But the rectangle AD, DC was also equal to the square on DB. Therefore the square on DE is equal to the square on DB, so DE is equal to DB. But FE is equal to FB. Therefore the two sides DE, EF are equal to the two sides DB, BF, and the base FD is common. Therefore the angle DEF is equal to the angle DBF (I.8). But the angle DEF is right. Therefore the angle DBF is also right. And FB produced is a diameter. But the straight line drawn at right angles to the diameter of a circle from its extremity touches the circle (III.16). Therefore DB touches the circle ABC."
