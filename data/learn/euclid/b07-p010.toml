id = "VII.10"
book = 7
order = 10
title = "Alternately, parts"
statement = "If a number be parts of a number, and another be the same parts of another, alternately also, whatever parts or part the first is of the third, the same parts or the same part will the second be of the fourth."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let the number AB be parts of the number C, and another number DE the same parts of another F. I say that, alternately also, whatever parts or part AB is of DE, the same parts or the same part is C of F. (Here 6 is two thirds of 9, and 8 is two thirds of 12; alternately 6 is three quarters of 8, and 9 is three quarters of 12.)"
