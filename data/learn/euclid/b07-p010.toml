[[step]]
text = "Since AB is the same parts of C that DE is of F, as many parts of C as there are in AB, so many parts of F are there in DE. Let AB be divided into the parts of C, AG, GB, and DE into the parts of F, DH, HE. Then the multitude of AG, GB is equal to the multitude of DH, HE. Since whatever part AG is of C, the same part is DH of F, alternately, whatever part or parts AG is of DH, the same part or the same parts is C of F (VII.9). For the same reason, whatever part or parts GB is of HE, the same part or the same parts is C of F. Therefore, whatever part or parts the whole AB is of the whole DE, the same part or the same parts is C of F (VII.5, 6)."
