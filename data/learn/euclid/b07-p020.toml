id = "VII.20"
book = 7
order = 20
title = "The least numbers in a ratio"
statement = "The least numbers of those which have the same ratio with them measure those which have the same ratio the same number of times, the greater the greater and the less the less."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let CD, EF be the least numbers of those which have the same ratio with A, B (here CD = 3, EF = 2; A = 9, B = 6). I say that CD measures A the same number of times that EF measures B."
