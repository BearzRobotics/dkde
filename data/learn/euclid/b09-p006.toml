id = "IX.6"
book = 9
order = 6
title = "A number whose square is a cube"
statement = "If a number by multiplying itself make a cube number, it will itself also be a cube."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "For let the number A by multiplying itself make the cube number B (here 8 times 8 is 64). I say that A is itself a cube."
draw = [
  "clear",
  "point A 0 0",
  "point a 2.8 0",
  "segment A a blue",
  "point B 0 -0.9",
  "point b 22.4 -0.9",
  "segment B b red",
  "point C 0 -1.8",
  "point c 179.2 -1.8",
  "segment C c green",
]

[[step]]
text = "Let A by multiplying B make C (512). Then the unit, A, B, C are in continued proportion (A is the multiplier throughout), so C, the fourth from the unit, is a cube (IX.8). Now A by multiplying the cube B has made the cube C. Therefore A is a cube (IX.5)."
