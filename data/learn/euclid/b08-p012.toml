[[step]]
text = "Let C by multiplying itself make E, and by multiplying D make F; let D by multiplying itself make G, and let C, D by multiplying F make H, K. Since A is a cube and C its side, and C by multiplying itself has made E, C by multiplying E has made A. For the same reason D by multiplying G has made B. Since C by multiplying C, D has made E, F, C is to D as E is to F; for the same reason as F is to G. Again, since C by multiplying E, F has made A, H, E is to F as A is to H; and so as C is to D. Since C, D by multiplying F make H, K, C is to D as H is to K. Since D by multiplying F, G has made K, B, F is to G as K is to B, and F is to G as C is to D. Therefore A, H, K, B (8, 12, 18, 27) are in continued proportion in the ratio of C to D. Therefore between A, B there are two mean proportional numbers H, K, and A has to B the ratio triplicate of that which the side C has to the side D (V definition 10)."
