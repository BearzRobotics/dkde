id = "VIII.12"
book = 8
order = 12
title = "Between two cubes"
statement = "Between two cube numbers there are two mean proportional numbers, and the cube has to the cube the ratio triplicate of that which the side has to the side."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let A, B be cube numbers, and let C be the side of A and D of B (here 8 and 27, sides 2 and 3). I say that between A, B there are two mean proportional numbers, and A has to B the ratio triplicate of that which C has to D."
