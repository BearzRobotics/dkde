[[step]]
text = "Given the ratios C to E and D to F, take the least numbers G, H, K in continued proportion in those ratios (VIII.4), so that C is to E as G is to H and D is to F as H is to K. Now C by multiplying D makes A, and E by multiplying F makes B. Since C by D makes A and C by F makes L, D is to F as A is to L (VII.17); but D is to F as H is to K. Also, since C by F makes L and E by F makes B, C is to E as L is to B (VII.18); and C is to E as G is to H. Therefore, as A is to L so is H to K, and as L is to B so is G to H. Ex aequali A is to B as G is to K. But G has to K the ratio compounded of the ratios of G to H and H to K, that is, of C to E and D to F. Therefore A has to B the ratio compounded of the ratios of the sides."
