id = "VIII.5"
book = 8
order = 5
title = "Plane numbers"
statement = "Plane numbers have to one another the ratio compounded of the ratios of their sides."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let A, B be plane numbers, and let the numbers C, D be the sides of A, and E, F the sides of B (here A = 2 times 3 = 6, B = 3 times 5 = 15). I say that A has to B the ratio compounded of the ratios of C to E and D to F."
