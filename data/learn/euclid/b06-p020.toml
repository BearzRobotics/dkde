id = "VI.20"
book = 6
order = 20
title = "Similar polygons"
statement = "Similar polygons are divided into similar triangles, and into triangles equal in multitude and in the same ratio as the wholes, and the polygon has to the polygon a ratio duplicate of that which the corresponding side has to the corresponding side."
proof = "Therefore similar polygons are divided into similar triangles, and into triangles equal in multitude and in the same ratio as the wholes, and the polygon has to the polygon a ratio duplicate of that which the corresponding side has to the corresponding side. Q.E.D."

[[step]]
text = "Let ABCDE, FGHKL be similar polygons, and let AB correspond to FG. I say that the polygons ABCDE, FGHKL are divided into similar triangles, equal in multitude and in the same ratio as the wholes, and the polygon ABCDE has to the polygon FGHKL a ratio duplicate of that which AB has to FG."
