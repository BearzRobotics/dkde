[[step]]
text = "Let BE, EC, GL, LH be joined. Since the polygon ABCDE is similar to the polygon FGHKL, the angle BAE is equal to the angle GFL, and BA is to AE as GF is to FL. Therefore the triangles ABE, FGL are equiangular (VI.6), and so similar; so the angle ABE is equal to the angle FGL. But the whole angle ABC is equal to the whole angle FGH, so the remaining angle EBC is equal to the angle LGH. And since the triangles ABE, FGL are similar, EB is to BA as LG is to GF; and by the similarity of the polygons, AB is to BC as FG is to GH. Therefore, ex aequali, EB is to BC as LG is to GH, and the sides about the equal angles EBC, LGH are proportional. Therefore the triangle EBC is equiangular with the triangle LGH (VI.6), and so similar. For the same reason the triangle ECD is also similar to the triangle LHK."
