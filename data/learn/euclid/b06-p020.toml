  "segment G L green",
  "segment L H green",
]

[[step]]
text = "Therefore the similar polygons ABCDE, FGHKL have been divided into similar triangles, and equal in multitude. I say that they are also in the same ratio as the wholes, that is, the triangles are proportional, the antecedents being ABE, EBC, ECD and their consequents FGL, LGH, LHK, and the polygon has to the polygon a ratio duplicate of that of the corresponding side. Since the triangle ABE is similar to the triangle FGL, the triangle ABE has to the triangle FGL a ratio duplicate of that which BE has to GL (VI.19). Similarly the triangle BEC has to the triangle GLH a ratio duplicate of that which BE has to GL. Therefore, as the triangle ABE is to the triangle FGL, so is the triangle BEC to the triangle GLH, and so is the triangle ECD to the triangle LHK. Therefore, as one of the antecedents is to one of the consequents, so are all the antecedents to all the consequents (V.12). Therefore, as the triangle ABE is to the triangle FGL, so is the polygon ABCDE to the polygon FGHKL. But the triangle ABE has to the triangle FGL a ratio duplicate of that which the corresponding side AB has to the corresponding side FG. Therefore the polygon ABCDE also has to the polygon FGHKL a ratio duplicate of that which the corresponding side AB has to the corresponding side FG."
