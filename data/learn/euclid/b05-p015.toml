  "segment F f orange",
]

[[step]]
text = "Since AB is the same multiple of C that DE is of F, there are as many magnitudes in AB equal to C as there are in DE equal to F. Let AB be divided into the magnitudes AG, GH, HB equal to C, and DE into DK, KL, LE equal to F. Then the multitude of AG, GH, HB is equal to the multitude of DK, KL, LE."
draw = [
]

[[step]]
text = "Since AG, GH, HB are equal to one another, and DK, KL, LE are also equal to one another, AG is to DK as GH is to KL and as HB is to LE (V.7). Therefore, as one of the antecedents is to one of the consequents, so are all the antecedents to all the consequents (V.12). Therefore AG:DK = AB:DE. But AG is equal to C, and DK to F. Therefore C:F = AB:DE."
