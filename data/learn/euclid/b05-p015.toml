id = "V.15"
book = 5
order = 15
title = "Parts have the same ratio as their multiples"
statement = "Parts have the same ratio as their equimultiples."
proof = "Therefore parts have the same ratio as their equimultiples. Q.E.D."

[[step]]
text = "For let AB be the same multiple of C that DE is of F. I say that C is to F as AB is to DE."
draw = [
  "clear",
  "point AB 0 0",
  "point ab 6 0",
  "segment AB ab blue",
  "point DE 0 -0.9",
  "point de 9 -0.9",
