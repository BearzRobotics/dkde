[[step]]
text = "Beginning from E take as many numbers in double proportion as there are in 1, 2, 4: these are 7, 14, 28. Then, ex aequali, the unit is to the last, 4, as 7 is to 28 (VII.14); so the product of the unit and 28 equals the product of 7 and 4, which is FG. This is how FG = 28 comes out as the last of the second row."
draw = [
]

[[step]]
text = "The parts (divisors) of 28 are 1, 2, 4 and 7, 14: the first row up to the last, and the second row before the last. By IX.35 the sum of the first row 1 + 2 + 4 is 7 (the excess of 8 over the unit), which is the first of the second row, E; and the sum of the second row before the last, 7 + 14, is 21 which is 3 times 7, and by IX.35 equals the excess 28 - 7. Hence 1 + 2 + 4 + 7 + 14 = 28. And 28 has no other parts: any other divisor would be measured by a prime other than 2 and 7, which is impossible (IX.14 and IX.13, the first row being measured by 2 only, and 7 being prime). Therefore 28 is equal to its own parts: it is perfect."
