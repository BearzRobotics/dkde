id = "IX.36"
book = 9
order = 36
title = "Perfect numbers"
statement = "If as many numbers as we please beginning from an unit be set out in double proportion, until the sum of all becomes prime, and if the sum multiplied into the last make some number, the product will be perfect."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let numbers beginning from the unit be set out in double proportion until their sum is prime: 1, 2, 4 have the sum 7, which is prime. Let the sum E = 7 be multiplied into the last, 4, to make FG = 28. I say that 28 is perfect, that is, equal to its own parts."
