[[step]]
text = "First let GB be equal to E. I say that HD is also equal to F. Make CK equal to F. Since AG is the same multiple of E that CH is of F, and GB is equal to E, and KC to F, AB is the same multiple of E that KH is of F (V.2). But AB is the same multiple of E that CD is of F by hypothesis. Therefore KH is the same multiple of F that CD is of F. Since each of KH, CD is the same multiple of F, KH is equal to CD. Take away CH from each. Then the remainder KC is equal to the remainder HD. But KC is equal to F. Therefore HD is also equal to F. Hence if GB is equal to E, HD is equal to F. Similarly we can prove that, even if GB be a multiple of E, HD is the same multiple of F."
