id = "V.6"
book = 5
order = 6
title = "Equimultiples diminished"
statement = "If two magnitudes be equimultiples of two magnitudes, and any magnitudes subtracted from them be equimultiples of the same, the remainders also are either equal to the same or equimultiples of them."
proof = "Therefore if two magnitudes be equimultiples of two magnitudes, and any magnitudes subtracted from them be equimultiples of the same, the remainders also are either equal to the same or equimultiples of them. Q.E.D."

[[step]]
text = "Let two magnitudes AB, CD be equimultiples of two magnitudes E, F, and let AG, CH subtracted from them be equimultiples of the same E, F. I say that the remainders GB, HD are either equal to E, F or equimultiples of them."
