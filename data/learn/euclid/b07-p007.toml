id = "VII.7"
book = 7
order = 7
title = "A part taken from a part"
statement = "If a number be that part of a number which a number taken away is of a number taken away, the remainder will also be the same part of the remainder that the whole is of the whole."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "For let the number AB be that part of the number CD which AE taken away is of CF taken away (here AB = 15 and CD = 9 are in the ratio 5 : 3, and AE = 10 and CF = 6 likewise; the numbers are drawn as bars). Let AB be that part of CD that AE is of CF. I say that the remainder EB is also the same part of the remainder FD that the whole AB is of the whole CD."
