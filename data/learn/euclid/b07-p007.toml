[[step]]
text = "Whatever part AE is of CF, the same part let EB be of CG. Then, since AE is the same part of CF that EB is of CG, AE is the same part of CF that AB is of GF (VII.5). But AE is the same part of CF that AB is of CD, by hypothesis. Therefore AB is the same part of GF that it is of CD. Therefore GF is equal to CD. Take away CF from each. Then GC is equal to FD. Since AE is the same part of CF that EB is of GC, and GC is equal to FD, AE is the same part of CF that EB is of FD. But AE is the same part of CF that AB is of CD. Therefore EB is the same part of FD that AB is of CD."
