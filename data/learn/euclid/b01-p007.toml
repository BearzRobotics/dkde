id = "I.7"
book = 1
order = 8
title = "Two triangles on one base cannot share two pairs of sides"
statement = "Given two straight lines constructed on a straight line (from its extremities) and meeting in a point, there cannot be constructed on the same straight line (from its extremities), and on the same side of it, two other straight lines meeting in another point and equal to the former two respectively, namely each to that which has the same extremity with it."
proof = "Therefore, given two straight lines constructed on a straight line from its extremities and meeting in a point, there cannot be constructed on the same straight line, and on the same side of it, two other straight lines meeting in another point and equal to the former two respectively. Q.E.D."

[[step]]
text = "Let AC, CB be two straight lines constructed on the straight line AB and meeting at the point C. Suppose, if possible, that two other straight lines AD, DB, meeting in another point D on the same side of AB, were equal to them: AD equal to CA (with the same extremity A), and DB equal to CB (with the same extremity B)."
draw = [
  "clear",
  "point A -2 0",
  "point B 2 0",
  "point C 0.500 3",
  "segment A B",
  "segment A C blue",
  "segment C B red",
  "point D 0.058 3.319",
  "segment A D blue",
  "segment D B red",
]

[[step]]
text = "Let CD be joined. Since AC is equal to AD, the angle ACD is equal to the angle ADC (I.5). Therefore the angle ADC is greater than the angle DCB, and so the angle CDB is much greater than the angle DCB."
draw = [
  "segment C D black",
  "angle D C A orange fill",
  "angle C D A orange fill",
]

[[step]]
text = "Again, since CB is equal to DB, the angle CDB is equal to the angle DCB (I.5). But it was also proved much greater than it, which is impossible."
draw = [
  "angle C D B green fill",
  "angle D C B green fill",
]

[[step]]
text = "Therefore no such point D exists: given two straight lines on a base meeting in a point, no other two lines, equal to them respectively, can meet in another point on the same side."
draw = [
  "polygon A B C purple",
]
