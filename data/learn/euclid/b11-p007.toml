id = "XI.7"
book = 11
order = 7
title = "The join of two parallels is in their plane"
statement = "If there be two parallel straight lines, and points be taken at random on each of them, the straight line joining the two points is in the same plane with the parallel straight lines."
proof = "Therefore if there be two parallel straight lines, and points be taken at random on each of them, the straight line joining the two points is in the same plane with the parallel straight lines. Q.E.D."

[[step]]
text = "Let AB, CD be two parallel straight lines, and let points E, F be taken at random on them respectively. I say that the straight line joined from E to F is in the same plane with the parallels."
