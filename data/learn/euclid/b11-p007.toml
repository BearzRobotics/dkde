[[step]]
text = "For suppose it is not, but, if possible, let it be elevated, as EGF, and through EGF let a plane be drawn. It will make a section in the plane of the parallels, a straight line (XI.3). Let it be EF. Then two straight lines EGF, EF will enclose an area, which is impossible. Therefore the straight line joined from E to F is not elevated, and so lies in the plane through the parallels AB, CD."
