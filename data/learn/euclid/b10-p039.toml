[[step]]
text = "The square on AC is the squares on AB, BC (rational) together with twice the rectangle AB, BC (medial). A rational plus a medial area is irrational, since otherwise a medial area would equal a rational area less a rational area, i.e. be rational. So the square on AC is irrational and AC is irrational. It is called major."
