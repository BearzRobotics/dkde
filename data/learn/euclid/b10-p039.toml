id = "X.39"
book = 10
order = 39
title = "The major line"
statement = "If two straight lines incommensurable in square, which make the sum of the squares on them rational but the rectangle contained by them medial, be added together, the whole straight line is irrational; and let it be called major."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let the two straight lines AB, BC incommensurable in square, making the sum of the squares on them rational and the rectangle contained by them medial, be added together (as found in X.33: here AB = 1.848, BC = 0.765, the sum of squares is 4 and the rectangle is the square root of 2). I say that AC is irrational, and is called major (its length is 2.613)."
draw = [
