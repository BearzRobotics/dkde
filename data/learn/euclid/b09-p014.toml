[[step]]
text = "For, if possible, let it be measured by the prime number E, and let E not be the same with any one of B, C, D. Since E measures A, let it do so F times. Then E by multiplying F makes A. And A is measured by the primes B, C, D. But if two numbers by multiplying one another make some number, and any prime measures the product, it measures one of the original numbers (VII.30). So B, C, D each measure F (E is a different prime, so none of them measures E). Therefore F is measured by B, C, D, and F is less than A. But A was the least number measured by B, C, D. Therefore F cannot be measured by B, C, D, which is impossible. Therefore A is not measured by any other prime."
