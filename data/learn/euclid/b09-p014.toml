id = "IX.14"
book = 9
order = 14
title = "The least number measured by given primes"
statement = "If a number be the least that is measured by prime numbers, it will not be measured by any other prime number except those originally measuring it."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "For let the number A be the least that is measured by the prime numbers B, C, D (here 30 by 2, 3, 5). I say that A will not be measured by any other prime number except B, C, D."
draw = [
