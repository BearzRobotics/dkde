[[step]]
text = "Let the centre be K, and let KE, KF, KC be joined. Since AK is equal to EK, add KD to each. Then AD is equal to EK, KD. But EK, KD are greater than ED (I.20). Therefore AD is greater than ED. Again, since EK is equal to FK, and KD is common, EK, KD are equal to FK, KD; and the angle EKD is greater than the angle FKD. Therefore the base ED is greater than the base FD (I.24). Similarly FD is greater than CD. Therefore DA is greatest, DE greater than DF, DF than DC."
