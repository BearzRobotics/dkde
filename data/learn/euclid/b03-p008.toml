id = "III.8"
book = 3
order = 8
title = "Distances from a point outside"
statement = "If a point be taken outside a circle and from the point straight lines be drawn through to the circle, one of which passes through the centre and the others are drawn at random, then, of the straight lines which fall on the concave circumference, that which passes through the centre is greatest, while of the rest the nearer to that through the centre is always greater than the more remote; but of the straight lines falling on the convex circumference that between the point and the diameter is least, and of the rest the nearer to the least is always less than the more remote, and only two equal straight lines will fall on the circle from the point, one on each side of the least."
proof = "Therefore if a point be taken outside a circle, and from the point straight lines be drawn through to the circle, one of which passes through the centre and the others are drawn at random, then of the straight lines falling on the concave circumference that through the centre is greatest, of the rest the nearer to that through the centre is always greater than the more remote, and of the straight lines falling on the convex circumference that between the point and the diameter is least, and of the rest the nearer to the least is always less than the more remote, and only two equal straight lines will fall on the circle from the point, one on each side of the least. Q.E.D."

[[step]]
text = "Let ABC be a circle, let a point D be taken outside it, and from D let straight lines DA, DE, DF, DC be drawn through, DA being through the centre. I say that DA is greatest, and DE greater than DF, DF than DC; of the lines falling on the convex circumference, DG between the point and the diameter is least."
