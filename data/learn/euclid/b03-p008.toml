  "segment K E green",
  "segment K F green",
  "segment K C green",
]

[[step]]
text = "Again, since MK, KD are greater than DM (I.20), and MK is equal to KG, the remainder KD is greater than the remainder GD, that is, GD is less than KD, so GD is least of all. And since on one side of KD, the triangle KDM... the lines drawn to the convex arc nearer to DG are less than those more remote (I.21, I.24). And only two equal lines fall from D on the circle, one on each side of the least DG, by the angle construction of I.23."
draw = [
  "segment D G red",
]
