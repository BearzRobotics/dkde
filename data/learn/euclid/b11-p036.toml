id = "XI.36"
book = 11
order = 36
title = "Three proportional lines and a solid"
statement = "If three straight lines be proportional, the parallelepipedal solid formed out of the three straight lines is equal to the parallelepipedal solid on the mean, if it be equilateral and equiangular with the aforesaid solid."
proof = "Therefore if three straight lines be proportional, the parallelepipedal solid formed out of the three straight lines is equal to the parallelepipedal solid on the mean, if it be equilateral and equiangular with the aforesaid solid. Q.E.D."

[[step]]
text = "Let A, B, C be three proportional straight lines, so that A is to B as B is to C (here 2, 4, 8, so the solid 2 by 4 by 8 has volume 64, and the cube on 4 has volume 64). I say that the solid formed out of A, B, C is equal to the equilateral solid on B equiangular with it."
