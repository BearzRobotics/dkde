[[step]]
text = "Let there be set out the solid angle at E contained by the angles DEG, GEF, FED, and let DE, GE, EF be each equal to B. Let the parallelepipedal solid EK be completed. Let LM be equal to A, and on the straight line LM, and at the point L on it, let a solid angle be constructed equal to the solid angle at E (XI.26), and let LN be made equal to B and LO equal to C. Since A is to B as B is to C, and A is equal to LM, B to each of LN, ED, and C to LO, therefore, as LM is to EG, so is DE to LO. Therefore the sides about the equal angles NLM, DEG are reciprocally proportional. Therefore the parallelogram MN is equal to the parallelogram DG (VI.14). Since the two plane angles DEG, NLM are equal and the elevated straight lines LO, EF are equal and contain equal angles with the original straight lines, the perpendiculars from O, F to the planes through NLM, DEG are equal to one another (XI.35). Therefore the solids LH, EK are of the same height. But parallelepipedal solids on equal bases and of the same height are equal to one another (XI.31). Therefore the solid HL is equal to the solid EK. And LH is the solid formed out of A, B, C, and EK the solid on B."
