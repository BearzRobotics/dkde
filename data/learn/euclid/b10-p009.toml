[[step]]
text = "Since A, B are commensurable in length, A has to B the ratio which a number has to a number (X.5), say that of C to D. Since A is to B as C is to D, the square on A is to the square on B as the square on C is to the square on D (the ratio is duplicated: VI.20, VIII.11). So the squares on A, B have the ratio of the square numbers. Conversely, if the squares are in the ratio of square numbers, the sides are in the ratio of the numbers, since between two squares there falls one mean and the sides are as the ratio of the roots (VIII.11), so the sides are commensurable (X.6). If the sides are incommensurable, then A is not to B as a number to a number (X.7), and so the squares are not as square numbers; for otherwise the sides would be as numbers. And the converse is proved in the same way."
