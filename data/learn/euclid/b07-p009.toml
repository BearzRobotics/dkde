  "segment EF ef orange",
]

[[step]]
text = "Since whatever part A is of BC, the same part is D of EF, as many numbers as there are in BC equal to A, so many are there in EF equal to D. Let BC be divided into BG, GC equal to A, and EF into EH, HF equal to D. Then the multitude of BG, GC is equal to the multitude of EH, HF. Now since BG, GC are equal to one another, and EH, HF are also equal to one another, and the multitude of BG, GC is equal to the multitude of EH, HF, whatever part or parts BG is of EH, the same part or the same parts is GC of HF, so that also the sum BC is the same part or the same parts of the sum EF that BG is of EH (VII.5, 6). But BG is equal to A, and EH to D. Therefore whatever part or parts A is of D, the same part or the same parts is BC of EF."
