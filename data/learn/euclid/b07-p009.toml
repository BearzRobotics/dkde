id = "VII.9"
book = 7
order = 9
title = "Alternately, a part"
statement = "If a number be a part of a number, and another be the same part of another, alternately also, whatever part or parts the first is of the third, the same part, or the same parts, will the second be of the fourth."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "For let a number A be a part of a number BC, and another number D the same part of another EF that A is of BC. I say that, alternately also, whatever part or parts A is of D, the same part or parts is BC of EF."
draw = [
