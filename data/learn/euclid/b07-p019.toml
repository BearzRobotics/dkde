id = "VII.19"
book = 7
order = 19
title = "Proportion and products"
statement = "If four numbers be proportional, the number produced from the first and fourth will be equal to the number produced from the second and third; and, if the number produced from the first and fourth be equal to that produced from the second and third, the four numbers will be proportional."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let A, B, C, D be four numbers in proportion, so that A is to B as C is to D, and let A by multiplying D make E, and B by multiplying C make F. I say that E is equal to F. (Here 2 times 6 is 12 and 3 times 4 is 12.)"
