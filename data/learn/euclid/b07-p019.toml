[[step]]
text = "Let A by multiplying C make G. Since A by multiplying C has made G, and by multiplying D has made E, the number A by multiplying the two numbers C, D has made G, E. Therefore, as C is to D, so is G to E (VII.17). But as C is to D, so is A to B. Therefore also, as A is to B, so is G to E. Again, since A by multiplying C has made G, but, further, B by multiplying C has made F, the two numbers A, B by multiplying a certain number C have made G, F. Therefore, as A is to B, so is G to F (VII.18). But, further, as A is to B, so is G to E. Therefore G has the same ratio to each of the numbers E, F. Therefore E is equal to F. Conversely, let E be equal to F. I say that A is to B as C is to D. With the same construction, since E is equal to F, G has to E the same ratio as it has to F. But, as G is to E, so is C to D, and, as G is to F, so is A to B. Therefore, as A is to B, so is C to D."
