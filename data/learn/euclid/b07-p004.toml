id = "VII.4"
book = 7
order = 4
title = "A part or parts"
statement = "Any number is either a part or parts of any number, the less of the greater."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let A, BC be two numbers, and let BC be the less. I say that BC is either a part or parts of A. For A, BC are either prime to one another or not. (Here A is 9 and BC is 3 on one pair; 12 and 4 on another.)"
