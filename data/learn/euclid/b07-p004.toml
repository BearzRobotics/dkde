[[step]]
text = "First let A, BC be prime to one another. Then if BC be divided into the units in it, each unit in BC will be some part of A. So that BC is parts of A. Next let A, BC not be prime to one another. Then BC either measures A or does not. If BC measures A, BC is a part of A. If not, let the greatest common measure D of A, BC be taken (VII.2), and let BC be divided into numbers equal to D, namely BE, EF, FC. Now since D measures A, D is a part of A. But D is equal to each of BE, EF, FC. Therefore each of BE, EF, FC is also a part of A. So that BC is parts of A. Therefore any number is either a part or parts of any number, the less of the greater."
