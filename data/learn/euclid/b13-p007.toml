id = "XIII.7"
book = 13
order = 7
title = "Equiangular pentagons"
statement = "If three angles of an equilateral pentagon, taken either in order or not in order, be equal, the pentagon will be equiangular."
proof = "Therefore if three angles of an equilateral pentagon, taken either in order or not in order, be equal, the pentagon will be equiangular. Q.E.D."

[[step]]
text = "For let three angles of the equilateral pentagon ABCDE, first those at A, B, C, which are in order, be equal to one another. I say that the pentagon ABCDE is equiangular."
