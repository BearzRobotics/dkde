id = "V.12"
book = 5
order = 12
title = "Sums of proportionals"
statement = "If any number of magnitudes be proportional, as one of the antecedents is to one of the consequents, so will all the antecedents be to all the consequents."
proof = "Therefore, as one of the antecedents is to one of the consequents, so will all the antecedents be to all the consequents. Q.E.D."

[[step]]
text = "Let any number of magnitudes A, B, C, D, E, F be proportional, so that A:B = C:D = E:F. I say that as A is to B, so are A, C, E together to B, D, F together."
