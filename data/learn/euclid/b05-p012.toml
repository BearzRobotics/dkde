[[step]]
text = "Let equimultiples G, H, K be taken of A, C, E, and other equimultiples L, M, N of B, D, F. Then since A:B = C:D = E:F, if G exceeds L, H exceeds M and K exceeds N; if equal, equal; if less, less. Therefore if G exceeds L, then G, H, K together exceed L, M, N together; if equal, equal; if less, less."
draw = [
]

[[step]]
text = "But G and G, H, K together are equimultiples of A and A, C, E together (V.1), and L and L, M, N together are equimultiples of B and B, D, F together. Therefore A:B = A, C, E together : B, D, F together."
