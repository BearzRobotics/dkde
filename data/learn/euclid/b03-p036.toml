id = "III.36"
book = 3
order = 36
title = "Tangent and secant"
statement = "If a point be taken outside a circle and from it there fall on the circle two straight lines, and if one of them cut the circle and the other touch it, the rectangle contained by the whole of the straight line which cuts the circle and the straight line intercepted on it outside between the point and the convex circumference will be equal to the square on the tangent."
proof = "Therefore if a point be taken outside a circle and from it there fall on the circle two straight lines, and if one of them cut the circle and the other touch it, the rectangle contained by the whole of the straight line which cuts the circle and the straight line intercepted on it outside between the point and the convex circumference will be equal to the square on the tangent. Q.E.D."

[[step]]
text = "Let D be a point taken outside the circle ABC, and from D let the two straight lines DCA, DB fall on the circle ABC, of which DCA cuts the circle and DB touches it. I say that the rectangle AD, DC is equal to the square on DB."
