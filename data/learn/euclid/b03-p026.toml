[[step]]
text = "Let BC, EF be joined. Since the circles ABC, DEF are equal, the radii are equal. Thus the two straight lines BG, GC are equal to the two straight lines EH, HF, and the angle at G is equal to the angle at H. Therefore the base BC is equal to the base EF (I.4)."
draw = [
  "segment B G green",
  "segment G C green",
  "segment E H green",
  "segment H F green",
]

[[step]]
text = "And since the angle at A is equal to the angle at D, the segment BAC is similar to the segment EDF (definition 11), and they are on equal straight lines BC, EF. But similar segments of circles on equal straight lines are equal to one another (III.24). Therefore the segment BAC is equal to the segment EDF. But the whole circle ABC is also equal to the whole circle DEF. Therefore the remaining circumference BKC is equal to the remaining circumference ELF."
