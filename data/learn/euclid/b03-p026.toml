id = "III.26"
book = 3
order = 26
title = "Equal angles stand on equal arcs"
statement = "In equal circles equal angles stand on equal circumferences, whether they stand at the centres or at the circumferences."
proof = "Therefore in equal circles equal angles stand on equal circumferences, whether they stand at the centres or at the circumferences. Q.E.D."

[[step]]
text = "Let ABC, DEF be equal circles, and in them let there be equal angles, BGC, EHF at the centres G, H, and BAC, EDF at the circumferences. I say that the circumference BKC is equal to the circumference ELF."
