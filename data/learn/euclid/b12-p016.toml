id = "XII.16"
book = 12
order = 16
title = "A polygon in a circle, clear of an inner circle"
statement = "Given two circles about the same centre, to inscribe in the greater circle an equilateral polygon with an even number of sides which does not touch the lesser circle."
proof = "Therefore in the greater circle ABCD there has been inscribed an equilateral polygon with an even number of sides which does not touch the lesser circle. Being what it was required to do."

[[step]]
text = "Let there be two circles ABCD, EFGH about the same centre K. It is required to inscribe in the greater circle ABCD an equilateral polygon with an even number of sides which does not touch the circle EFGH."
