[[step]]
text = "Let the straight line BKD be drawn through the centre K, and from G let GA be drawn at right angles to the straight line BD and carried through to C. Therefore AC touches the circle EFGH (III.16 corollary). Bisect the circumference BAD, bisect the half of it, and do this continually until there is left a circumference less than AD (X.1). Let it be LD, and from L let LM be drawn perpendicular to BD and carried through to N, and let LD, DN be joined. Then LN is parallel to AC (I.28). Since AC touches the circle EFGH, LN, which is parallel to AC, does not touch the circle EFGH. A fortiori LD, DN do not touch the circle EFGH. If, then, we fit into the circle ABCD straight lines equal to LD and continuous with it, an equilateral polygon with an even number of sides will have been inscribed in the circle ABCD which does not touch the lesser circle EFGH. (A twelve-sided figure is drawn here.)"
