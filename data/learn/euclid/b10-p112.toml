[[step]]
text = "Let GH be the apotome with the same terms as the binomial, that is, with the whole BD and annex DC. The product of a binomial and the corresponding apotome is the difference of the squares on the terms (II.5: (BD + DC)(BD - DC) = square on BD less square on DC), which is a rational area, since the squares are rational. So the square on A has to this rational area the ratio of a rational area to a rational area, that is, of a number to a number (X.6, X.19). Therefore the breadth EF has to the apotome GH the ratio of a number to a number: EF is commensurable with GH, and so its terms are commensurable with BD, DC in the same ratio. A line commensurable with an apotome is an apotome of the same order (X.103). Therefore EF is an apotome of the same order as the binomial."
