id = "X.112"
book = 10
order = 112
title = "A rational square applied to a binomial"
statement = "The square on a rational straight line applied to the binomial produces as breadth an apotome whose terms are commensurable with the terms of the binomial and moreover in the same ratio; and further the apotome so arising has the same order as the binomial."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let A be a rational straight line (here 1) and BC a binomial divided into its terms at D (here 2 plus the square root of 3). Apply to BC the rectangle equal to the square on A, producing the breadth EF. I say that EF is an apotome whose terms are commensurable with BD, DC in the same ratio, and of the same order (here EF = 1 divided by 3.732, which is 2 less the square root of 3)."
