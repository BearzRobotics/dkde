[[step]]
text = "For let there be applied to AB the parallelogram AF deficient by the parallelogrammic figure FB similar and similarly situated to DB. I say that AD is greater than AF. Since the parallelogram DB is similar to the parallelogram FB, they are about the same diameter (VI.26). Let their diameter DB be drawn, and let the figure be described. Since the complement CF is equal to the complement FE (I.43), and FB is common, the whole CH is equal to the whole KE. But CH is equal to CG, since AC is equal to CB. Therefore GC is also equal to EK. Add CF to each. Then the whole AF is equal to the gnomon CHL. Therefore the parallelogram DB, that is AD, is greater than the parallelogram AF."
