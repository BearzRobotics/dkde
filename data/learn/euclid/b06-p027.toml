id = "VI.27"
book = 6
order = 27
title = "The greatest parallelogram applied to a line"
statement = "Of all the parallelograms applied to the same straight line and deficient by parallelogrammic figures similar and similarly situated to that described on the half of the straight line, that parallelogram is greatest which is applied to the half of the straight line and is similar to the difference."
proof = "Therefore, of all the parallelograms applied to the same straight line and deficient by parallelogrammic figures similar and similarly situated to that described on the half of the straight line, that parallelogram is greatest which is applied to the half of the straight line and is similar to the difference. Q.E.D."

[[step]]
text = "Let AB be a straight line, and let it be bisected at C. Let there be applied to the straight line AB the parallelogram AD deficient by the parallelogrammic figure DB described on the half of AB, that is CB. (Rectangles are drawn here.) I say that, of all the parallelograms applied to AB and deficient by parallelogrammic figures similar and similarly situated to DB, AD is greatest."
