  "point AD 0 -2.7",
  "point ad 5.25 -2.7",
  "segment AD ad orange",
]

[[step]]
text = "Let the unit DE be subtracted from CD. Then the remainder CE is even (VII definition 7). But CA is also even (IX.22). Therefore the whole AE is also even (IX.21). And DE is a unit. Therefore AD is odd (VII definition 7)."
