id = "IX.23"
book = 9
order = 23
title = "An odd number of odd numbers"
statement = "If as many odd numbers as we please be added together, and their multitude be odd, the whole will also be odd."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "For let as many odd numbers as we please, AB, BC, CD, the multitude of which is odd, be added together (3, 5, 7). I say that the whole AD is also odd (15)."
draw = [
