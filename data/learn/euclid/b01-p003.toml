id = "I.3"
book = 1
order = 6
title = "Cutting off a line equal to a shorter one"
statement = "Given two unequal straight lines, to cut off from the greater a straight line equal to the less."
proof = "Therefore, given the two unequal straight lines AB, C, there has been cut off from AB the greater a straight line AE equal to C the less. (Being) what it was required to do."

[[step]]
text = "Let AB and C be the two given unequal straight lines, and let AB be the greater. It is required to cut off from AB the greater a straight line equal to C the less."
draw = [
  "clear",
  "point A -4.5 -1.5",
  "point B 3.5 -1.5",
  "point C1 -4.5 3",
  "point C2 -1 3",
  "segment A B blue",
  "segment C1 C2 red",
]

[[step]]
text = "At the point A let AD be placed equal to the straight line C (I.2)."
draw = [
  "point D -2.025 0.975",
  "segment A D red",
]

[[step]]
text = "With centre A and distance AD let the circle DEF be described (postulate 3). It cuts AB at E."
draw = [
  "circle A D orange",
  "cross E lc A B A D 1",
]

[[step]]
text = "Then AE is equal to C. A is the centre of the circle DEF, so AE is equal to AD. But C is also equal to AD. Therefore each of the straight lines AE, C is equal to AD, so AE is equal to C (common notion 1)."
draw = [
  "segment A E green",
]
