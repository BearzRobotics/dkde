id = "XIII.5"
book = 13
order = 5
title = "Adding the greater segment"
statement = "If a straight line be cut in extreme and mean ratio, and there be added to it a straight line equal to the greater segment, the whole straight line has been cut in extreme and mean ratio, and the original straight line is the greater segment."
proof = "Therefore if a straight line be cut in extreme and mean ratio, and there be added to it a straight line equal to the greater segment, the whole straight line has been cut in extreme and mean ratio, and the original straight line is the greater segment. Q.E.D."

[[step]]
text = "For let the straight line AB be cut in extreme and mean ratio at the point C, AC being the greater segment, and let AD be equal to AC. I say that the straight line DB has been cut in extreme and mean ratio at A, and the original straight line AB is the greater segment."
