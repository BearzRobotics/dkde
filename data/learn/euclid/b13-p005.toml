]

[[step]]
text = "The rectangle BD, DA is (DA + AB) by DA. Since DA is equal to AC, this is the square on AC together with the rectangle AB, AC. But that was just shown equal to the square on AB. Therefore the rectangle BD, DA is equal to the square on AB. Therefore, as DB is to BA, so is BA to AD (VI.17). But DB is greater than BA. Therefore BA is also greater than AD (V.14). Therefore DB has been cut in extreme and mean ratio at A, and AB is the greater segment."
