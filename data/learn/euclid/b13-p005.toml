[[step]]
text = "Since AB has been cut in extreme and mean ratio at C, the rectangle AB, BC is equal to the square on AC (VI.17), and AB is the sum of AC and CB, so the square on AB is the rectangle AB, AC together with the rectangle AB, BC, that is, the rectangle AB, AC together with the square on AC."
