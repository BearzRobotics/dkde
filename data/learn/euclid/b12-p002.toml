[[step]]
text = "For if the circle ABCD is not to the circle EFGH as the square on BD is to the square on FH, then, as the square on BD is to the square on FH, so will the circle ABCD be either to some less area than the circle EFGH, or to a greater. First let it be to a less, S. Inscribe in the circle EFGH the square EFGH (IV.6). This square is greater than the half of the circle EFGH, since, if through the points E, F, G, H we draw tangents to the circle, the square EFGH is half the square circumscribed about the circle, and the circle is less than the circumscribed square. Bisect the circumferences EF, FG, GH, HE at the points K, L, M, N, and join EK, KF, FL, LG, GM, MH, HN, NE. Then each of the triangles EKF, FLG, GMH, HNE is greater than the half of the segment of the circle about it. Thus, bisecting the remaining circumferences and joining, and doing this continually, we shall leave some segments of the circle which will be less than the excess by which the circle EFGH exceeds the area S (X.1). Let the segments be left, and let the segments of the circle EFGH on EK, KF, FL, LG, GM, MH, HN, NE be less than the excess. Therefore the remaining polygon EKFLGMHN is greater than the area S."
draw = [
]

[[step]]
text = "Inscribe in the circle ABCD a polygon AXBOCPDR similar to the polygon EKFLGMHN. Therefore, as the square on BD is to the square on FH, so is the polygon AXBOCPDR to the polygon EKFLGMHN (XII.1). But also, as the square on BD is to the square on FH, so is the circle ABCD to the area S. Therefore also, as the circle ABCD is to the area S, so is the polygon AXBOCPDR to the polygon EKFLGMHN. Therefore, alternately, as the circle ABCD is to the polygon in it, so is the area S to the polygon EKFLGMHN. But the circle ABCD is greater than the polygon in it. Therefore the area S is also greater than the polygon EKFLGMHN. But it is also less, which is impossible. Therefore, as the square on BD is to the square on FH, so is not the circle ABCD to some area less than the circle EFGH. Similarly we can prove that neither is the circle EFGH to some area less than the circle ABCD as the square on FH is to the square on BD. I say next that neither is the circle ABCD to some area greater than the circle EFGH as the square on BD is to the square on FH. For, if possible, let it be so to a greater, S. Then, inversely, as the square on FH is to the square on BD, so is the area S to the circle ABCD. But as the area S is to the circle ABCD, so is the circle EFGH to some area less than the circle ABCD (since S is greater than EFGH). Therefore, as the square on FH is to the square on BD, so is the circle EFGH to some area less than the circle ABCD, which was proved impossible. Therefore, as the square on BD is to the square on FH, so is the circle ABCD to the circle EFGH."
