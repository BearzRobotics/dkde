id = "XII.2"
book = 12
order = 2
title = "Circles are as the squares on their diameters"
statement = "Circles are to one another as the squares on the diameters."
proof = "Therefore circles are to one another as the squares on the diameters. Q.E.D."

[[step]]
text = "Let ABCD, EFGH be circles, and BD, FH their diameters. I say that, as the circle ABCD is to the circle EFGH, so is the square on BD to the square on FH."
