id = "X.97"
book = 10
order = 97
title = "The square on the apotome"
statement = "The square on an apotome, if applied to a rational straight line, produces as breadth the first apotome."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB be an apotome with the annex BC, and let a rational straight line DE be set out. Apply to DE the rectangle DF equal to the square on AB, producing DG as breadth. I say that DG is the first apotome. Example: (2 less the square root of 3) squared is 7 less 4 times the square root of 3 (terms 7.000 and 6.928, the remainder 0.072)."
