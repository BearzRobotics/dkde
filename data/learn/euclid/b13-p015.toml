[[step]]
text = "Euclid builds the solid from a circle and the square, hexagon or pentagon in it and compares the sides with the diameter of the sphere by the squares on them. What is to be shown: the square on the diameter is triple the square on the side."
draw = [
]

[[step]]
text = "Let the diameter AB of the given sphere be set out and cut at C so that AC is double CB. On AB describe the semicircle ADB, draw CD at right angles to AB, join DB, and let the square EFGH have each side equal to DB. From E, F, G, H draw EK, FL, GM, HN at right angles to the plane of the square and equal to EF, and join KL, LM, MN, NK. The cube FN is contained by six equal squares. Join KG, and let the diameters of the cube meet at a common middle point; each is equal to KG. Now since GE is the diagonal of the square, the square on GE is double the square on EF, and the square on KG is the squares on KE, EG, that is, three times the square on EF. But the square on AB is triple of the square on BD (since AC is double of CB, the square on AB is three times the square on BD, by the like reasoning). Therefore AB is equal to KG. Therefore the cube is comprehended in the sphere, and the square on the diameter of the sphere is triple the square on the side of the cube."
draw = [
]
