id = "XIII.15"
book = 13
order = 15
title = "The cube in a sphere"
statement = "To construct a cube and comprehend it in a sphere, like the pyramid; and to prove that the square on the diameter of the sphere is triple of the square on the side of the cube."
proof = "Therefore the figure has been constructed and comprehended in the given sphere, and the stated relation proved. Being what it was required to do."

