id = "XI.8"
book = 11
order = 8
title = "A parallel to a perpendicular is perpendicular"
statement = "If two straight lines be parallel, and one of them be at right angles to any plane, the remaining one will also be at right angles to the same plane."
proof = "Therefore if two straight lines be parallel, and one of them be at right angles to any plane, the remaining one will also be at right angles to the same plane. Q.E.D."

[[step]]
text = "Let AB, CD be two parallel straight lines, and let one of them, AB, be at right angles to the plane of reference. I say that the remaining one, CD, will also be at right angles to the same plane."
