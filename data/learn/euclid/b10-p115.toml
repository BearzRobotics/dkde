[[step]]
text = "Set out a rational straight line B, and let the square on C be equal to the rectangle B, A (VI.13, a mean proportional). Then C is irrational, since the rectangle of a rational and an irrational line is irrational. It is not the same as any preceding line: for the square on C, applied to B, produces A as breadth, and a medial line A is not the same as the preceding lines of which the squares produce rational breadths (the squares on the apotome and binomial lines produce binomials and apotomes, X.60 to X.65 and X.97 to X.102; the square on a medial produces a rational breadth, X.22). Again, let the square on D be equal to the rectangle B, C: D is irrational, different from all the preceding ones, and so on without end. Therefore from a medial straight line there arise irrational straight lines infinite in number, and none of them is the same as any preceding. (In the figure: the fourth root of 2, its square root, and so on: the eighth, sixteenth roots of 2 are all irrational and all different.)"
