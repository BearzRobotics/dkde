title = "Infinitely many irrational lines from a medial"
statement = "From a medial straight line there arise irrational straight lines infinite in number, and none of them is the same as any preceding."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let A be a medial straight line (the fourth root of 2, 1.189). I say that from A there arise irrational straight lines infinite in number, and none of them is the same as any preceding."
