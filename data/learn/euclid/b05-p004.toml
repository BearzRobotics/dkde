id = "V.4"
book = 5
order = 4
title = "The same ratio: equimultiples"
statement = "If a first magnitude have to a second the same ratio as a third to a fourth, any equimultiples whatever of the first and third will also have the same ratio to any equimultiples whatever of the second and fourth respectively, taken in corresponding order."
proof = "Therefore if a first magnitude have to a second the same ratio as a third to a fourth, any equimultiples whatever of the first and third will also have the same ratio to any equimultiples whatever of the second and fourth respectively, taken in corresponding order. Q.E.D."

[[step]]
text = "Let a first magnitude A have to a second B the same ratio as a third C to a fourth D, and let equimultiples E, F be taken of A, C, and other equimultiples G, H of B, D. I say that E:G = F:H."
