[[step]]
text = "Take equimultiples K, L of E, F, and other equimultiples M, N of G, H. Since E is the same multiple of A that F is of C, and K, L are equimultiples of E, F, K is the same multiple of A that L is of C (V.3). For the same reason M is the same multiple of B that N is of D."
draw = [
]

[[step]]
text = "Since A:B = C:D, and equimultiples K, L have been taken of A, C, and equimultiples M, N of B, D, then if K exceeds M, L exceeds N; if equal, equal; and if less, less (definition 5). But K, L are equimultiples of E, F and M, N of G, H. Therefore E:G = F:H (definition 5)."
