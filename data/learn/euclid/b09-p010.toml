[[step]]
text = "For, if possible, let D be square. But C is also square (IX.8). So C has to D the ratio which a square has to a square. And as C is to D, so is B to C. Therefore B has to C the ratio which a square number has to a square number, so that B, C are similar plane numbers (VIII.26 converse). But C is square. Therefore B is also square (VIII.24), which is contrary to the hypothesis. Therefore D is not square. Similarly we can prove that no other number, except the third from the unit and those which leave out one, is square. The cube case is proved in the same way using VIII.25."
