id = "IX.10"
book = 9
order = 10
title = "Non-squares and non-cubes in a progression from the unit"
statement = "If as many numbers as we please beginning from an unit be in continued proportion, and the number after the unit be not square, neither will any other be square except the third from the unit and all those which leave out one; and, if the number after the unit be not cube, neither will any other be cube except the fourth from the unit and all those which leave out two."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let as many numbers as we please beginning from an unit be in continued proportion A, B, C, D, E (here 1, 3, 9, 27, 81), and let the number after the unit, B, be not square. I say that neither will any other be square except the third from the unit (C = 9) and those which leave out one (E = 81)."
