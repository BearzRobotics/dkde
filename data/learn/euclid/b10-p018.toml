[[step]]
text = "As in the preceding proposition, the square on BC exceeds the square on A by the square on BD less DC. Since BD, DC are incommensurable, BD less DC is incommensurable with BC (X.16). Therefore the line whose square is the excess is incommensurable with BC. The converse follows by reversing the argument. (Note that the preceding example, with the same proof, had commensurable parts and a commensurable excess.)"
