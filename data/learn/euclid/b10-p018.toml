id = "X.18"
book = 10
order = 18
title = "Application deficient by a square: incommensurable parts"
statement = "If there be two unequal straight lines, and to the greater there be applied a parallelogram equal to the fourth part of the square on the less and deficient by a square figure, and if it divide it into parts which are incommensurable, then the square on the greater will be greater than the square on the less by the square on a straight line incommensurable with the greater. And, if the square on the greater be greater than the square on the less by the square on a straight line incommensurable with the greater, and if there be applied to the greater a parallelogram equal to the fourth part of the square on the less and deficient by a square figure, it divides it into parts which are incommensurable."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let A, BC be two unequal straight lines, BC being the greater (here BC = 4 and A = 2), and apply to BC a parallelogram equal to the fourth part of the square on A and deficient by a square figure: BD times DC = 1 with BD + DC = 4, so BD = 2 + the square root of 3 and DC = 2 less the square root of 3. These are incommensurable. I say that the square on BC exceeds the square on A by the square on a line incommensurable with BC (here 16 less 4 = 12, the square on 2 times the square root of 3)."
