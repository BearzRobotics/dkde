[[step]]
text = "As before, AB, BC are incommensurable in length, so AC is incommensurable with each (X.16). The square on AC is the squares on AB, BC with twice the rectangle AB, BC. The squares on AB, BC are medial and commensurable; twice the rectangle is medial; and the squares are incommensurable with the rectangle (since AB is incommensurable with BC). Let a rational line DE be set out and apply to it the areas: the breadths are rational and incommensurable with DE (X.22), and one of the two summands is incommensurable with the other. Then the sum is a binomial's breadth, which is irrational (X.36); so the square on AC is irrational and AC is irrational. It is called a second bimedial."
