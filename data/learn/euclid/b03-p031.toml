id = "III.31"
book = 3
order = 31
title = "The angle in a semicircle"
statement = "In a circle the angle in the semicircle is right, that in a greater segment less than a right angle, and that in a less segment greater than a right angle."
proof = "Therefore in a circle the angle in the semicircle is right, that in a greater segment less than a right angle, and that in a less segment greater than a right angle. Q.E.D."

[[step]]
text = "Let ABCD be a circle, let BC be its diameter and E its centre, and let BA, AC, AD, DC be joined. I say that the angle BAC in the semicircle BAC is right."
