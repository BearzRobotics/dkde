[[step]]
text = "Let the centre D of the circle ABC be taken, let AD be joined and carried through to E, and let BE be joined. Since the triangle ABC is equilateral, the circumference BEC is a third part of the circumference of the circle ABC. Therefore the circumference BE is a sixth part of the circumference of the circle. Therefore the chord BE belongs to the hexagon. Therefore it is equal to the radius DE (IV.15 corollary). And since AE is double of DE, the square on AE is four times the square on ED, that is, four times the square on BE. But the square on AE is equal to the squares on AB, BE (III.31, I.47). Therefore the squares on AB, BE are four times the square on BE. Therefore, taking away the square on BE, the square on AB is triple of the square on BE. But BE is equal to DE. Therefore the square on AB is triple of the square on DE."
