id = "XIII.12"
book = 13
order = 12
title = "The equilateral triangle in a circle"
statement = "If an equilateral triangle be inscribed in a circle, the square on the side of the triangle is triple of the square on the radius of the circle."
proof = "Therefore if an equilateral triangle be inscribed in a circle, the square on the side of the triangle is triple of the square on the radius of the circle. Q.E.D."

[[step]]
text = "Let there be a circle ABC, and let the equilateral triangle ABC be inscribed in it. I say that the square on one side of the triangle ABC is triple of the square on the radius of the circle ABC."
