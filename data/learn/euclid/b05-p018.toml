[[step]]
text = "For if AB is not to BE as CD to DF, then AB is to BE as CD is to some magnitude either less than DF or greater. Let it be to DG, less than DF. Since AB:BE = CD:DG, they are proportional componendo, and so separando (V.17). Therefore AE:EB = CG:GD. But by hypothesis AE:EB = CF:FD. Therefore CG:GD = CF:FD. But CG is greater than CF, and so GD is greater than FD (V.14). But it is also less, which is impossible."
draw = [
]

[[step]]
text = "Similarly we can prove that it is not to a greater magnitude either. Therefore AB:BE = CD:DF."
draw = [
]
