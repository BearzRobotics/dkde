id = "V.18"
book = 5
order = 18
title = "Componendo"
statement = "If magnitudes be proportional separando, they will also be proportional componendo."
proof = "Therefore if magnitudes be proportional separando, they will also be proportional componendo. Q.E.D. (In algebra: if a : b = c : d then (a + b) : b = (c + d) : d.)"

[[step]]
text = "Let AE, EB, CF, FD be magnitudes proportional separando, so that AE:EB = CF:FD. I say that they will also be proportional componendo, that is, AB:BE = CD:DF."
