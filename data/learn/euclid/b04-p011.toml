id = "IV.11"
book = 4
order = 11
title = "Inscribe a regular pentagon"
statement = "In a given circle to inscribe an equilateral and equiangular pentagon."
proof = "Therefore in the given circle the equilateral and equiangular pentagon FCGHD has been inscribed. Being what it was required to do."

[[step]]
text = "Let ABCDE be the given circle. It is required to inscribe in the circle an equilateral and equiangular pentagon. Let the isosceles triangle FGH be set out having each of the angles at G, H double of the angle at F (IV.10), and let there be inscribed in the circle the triangle ACD equiangular with the triangle FGH, so that the angle CAD is equal to the angle at F and each of the angles at C, D is equal to each of the angles at G, H (IV.2). Therefore each of the angles ACD, CDA is also double of the angle CAD."
