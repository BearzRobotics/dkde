[[step]]
text = "Since each of the angles ACD, CDA is double of the angle CAD, and they have been bisected by the straight lines CE, DB, the five angles DAC, ACE, ECD, CDB, BDA are equal to one another. But equal angles stand on equal circumferences (III.26). Therefore the five circumferences AB, BC, CD, DE, EA are equal to one another. But equal circumferences are subtended by equal straight lines (III.29). Therefore the five straight lines AB, BC, CD, DE, EA are equal to one another. Therefore the pentagon ABCDE is equilateral. I say next that it is also equiangular. For since the circumference AB is equal to the circumference DE, add BCD to each. Then the whole circumference ABCD is equal to the whole circumference EDCB. And the angle AED stands on the circumference ABCD, and the angle BAE on the circumference EDCB. Therefore the angle BAE is also equal to the angle AED (III.27). For the same reason each of the angles ABC, BCD, CDE is also equal to each of the angles BAE, AED. Therefore the pentagon ABCDE is equiangular. And it was also proved equilateral."
