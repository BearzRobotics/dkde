[[step]]
text = "That each of the numbers B, C, D is even-times even is manifest, for it is doubled from an even number. I say that it is also even-times even only. For let a unit be set out. Since as many numbers as we please beginning from a unit are in continued proportion, and the number A after the unit is prime, the greatest of the numbers A, B, C, D, namely D, will not be measured by any number except A, B, C (IX.13). And each of the numbers A, B, C is even. Therefore D is even-times even only. Similarly each of B, C is even-times even only."
