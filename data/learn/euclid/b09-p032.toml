id = "IX.32"
book = 9
order = 32
title = "Doubling from a dyad"
statement = "Each of the numbers which are continually doubled beginning from a dyad is even-times even only."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "For let as many numbers as we please, B, C, D, be continually doubled beginning from the dyad A (2, 4, 8, 16). I say that B, C, D are even-times even only."
