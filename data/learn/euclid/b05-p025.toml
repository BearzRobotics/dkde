  "segment CH ch teal",
]

[[step]]
text = "Let AG be made equal to E, and CH equal to F. Since AB:CD = E:F, and E is equal to AG, and F to CH, AB:CD = AG:CH. And since the whole AB is to the whole CD as the part taken away AG is to the part taken away CH, the remainder GB will also be to the remainder HD as the whole AB is to the whole CD (V.19). But AB is greater than CD. Therefore GB is also greater than HD."
draw = [
]

[[step]]
text = "Since AG is equal to E, and CH to F, AG, F are equal to CH, E. And if equals be added to unequals, the wholes are unequal: if GB, HD, which are unequal, GB being the greater, be added to AG, F and to CH, E respectively, it follows that AB, F are greater than CD, E."
