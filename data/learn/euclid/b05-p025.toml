id = "V.25"
book = 5
order = 25
title = "The greatest and least"
statement = "If four magnitudes be proportional, the greatest and the least are greater than the remaining two."
proof = "Therefore if four magnitudes be proportional, the greatest and the least are greater than the remaining two. Q.E.D. (In algebra: if a : b = c : d, with a the greatest and d the least, then a + d > b + c.)"

[[step]]
text = "Let the four magnitudes AB, CD, E, F be proportional, so that AB:CD = E:F, and let AB be the greatest of them and F the least. I say that AB, F are greater than CD, E."
draw = [
  "clear",
  "point AB 0 0",
