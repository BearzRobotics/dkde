[[step]]
text = "For suppose it is not, but, if possible, let the diameter of ABCD be AHC, and let GF be produced to H, and through H let HK be drawn parallel to either AD or BC. Since ABCD is about the same diameter AC as KG, ABCD is similar to KG (VI.24). Therefore DA is to AB as GA is to AK. But, because ABCD and EG are similar, DA is to AB as GA is to AF. Therefore GA has the same ratio to each of AK, AF, so AK is equal to AF, the less to the greater, which is impossible. Therefore ABCD is not not about the same diameter with AF; therefore the parallelogram ABCD is about the same diameter with AF."
