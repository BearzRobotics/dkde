id = "VI.26"
book = 6
order = 26
title = "A similar parallelogram on the same diameter"
statement = "If from a parallelogram there be taken away a parallelogram similar and similarly situated to the whole and having a common angle with it, it is about the same diameter with the whole."
proof = "Therefore if from a parallelogram there be taken away a parallelogram similar and similarly situated to the whole and having a common angle with it, it is about the same diameter with the whole. Q.E.D."

[[step]]
text = "From the parallelogram ABCD let there be taken away the parallelogram AF similar and similarly situated to ABCD, having the angle DAB common with it. I say that ABCD is about the same diameter with AF."
