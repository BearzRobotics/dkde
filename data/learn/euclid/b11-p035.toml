[[step]]
text = "Let AH be made equal to DM, and through H let HK be drawn parallel to GL. But GL is perpendicular to the plane through BAC. Therefore HK is also perpendicular to the plane through BAC (XI.8). From the points K, N let KC, NF, KB, NE be drawn perpendicular to the straight lines AC, DF, AB, DE, and let HC, CB, MF, FE be joined. Since the square on HA is equal to the squares on HK, KA, and the square on KA is equal to the squares on KC, CA, the square on HA is equal to the squares on HK, KC, CA. But the square on HC is equal to the squares on HK, KC. Therefore the square on HA is equal to the squares on HC, CA. Therefore the angle HCA is right. For the same reason the angle DFM is also right. Therefore the angle ACH is equal to the angle DFM. But the angle HAC is also equal to the angle MDF. Therefore MDF, HAC are two triangles having two angles equal to two angles and one side equal to one side, namely that subtending one of the equal angles, HA equal to DM. Therefore they will also have the remaining sides equal to the remaining sides (I.26). Therefore AC is equal to DF. Similarly we can prove that AB is equal to DE. Therefore the base BC is equal to the base EF, and the triangle ABC to the triangle DEF, so that the angle ABC is equal to the angle DEF. Similarly the angle ABK is equal to the angle DEN, and AK equal to DN, and hence KH equal to NM. Therefore the two sides AH, HK are equal to the two sides DM, MN, and contain right angles. Therefore the angle HAK is equal to the angle MDN. But HAK is the angle GAL, since HK is parallel to GL. Therefore the angle GAL is equal to the angle MDN."
