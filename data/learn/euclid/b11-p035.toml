id = "XI.35"
book = 11
order = 35
title = "Elevated lines containing equal angles"
statement = "If there be two equal plane angles, and on their vertices there be set up elevated straight lines containing equal angles with the original straight lines respectively, and if on the elevated straight lines points be taken at random and perpendiculars be drawn from them to the planes in which the original angles are, and from the points so arising in the planes straight lines be joined to the vertices of the original angles, they will contain with the elevated straight lines equal angles."
proof = "Therefore if there be two equal plane angles, and on their vertices there be set up elevated straight lines containing equal angles with the original straight lines respectively, and if on the elevated straight lines points be taken at random and perpendiculars be drawn from them to the planes in which the original angles are, and from the points so arising in the planes straight lines be joined to the vertices of the original angles, they will contain with the elevated straight lines equal angles. Q.E.D."

[[step]]
text = "Let BAC, EDF be two equal rectilineal angles, and from the points A, D let the elevated straight lines AG, DM be set up containing equal angles with BA, AC and ED, DF respectively, namely the angle MDE equal to the angle GAB, and MDF equal to GAC. Let points G, M be taken at random on AG, DM, let GL, MN be drawn from G, M perpendicular to the planes through BAC, EDF, meeting the planes at L, N, and let LA, ND be joined. I say that the angle GAL is equal to the angle MDN."
