id = "VII.1"
book = 7
order = 1
title = "Prime to one another (the Euclidean algorithm)"
statement = "Two unequal numbers being set out, and the less being continually subtracted in turn from the greater, if the number which is left never measures the one before it until an unit is left, the original numbers will be prime to one another."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "Let two unequal numbers AB, CD be set out (here 17 and 5), and let the less be continually subtracted in turn from the greater. 17 less 5 three times leaves 2; 5 less 2 twice leaves 1, and a unit is left. I say that AB, CD are prime to one another, that is, that an unit alone measures both AB and CD."
