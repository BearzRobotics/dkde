[[step]]
text = "For if AB, CD are not prime to one another, some number will measure them. Let a number E measure them. Then CD, measuring BF, leaves AF less than itself; AF, measuring DG, leaves GC less than itself; and GC, measuring FH, leaves a unit HA. Since E measures CD, and CD measures BF, E also measures BF. But E measures the whole AB. Therefore it will also measure the remainder AF. And AF measures DG; therefore E also measures DG. But it measures the whole DC. Therefore it will also measure the remainder CG. And CG measures FH; therefore E also measures FH. But it measures the whole FA. Therefore it will also measure the remaining unit AH, though it is a number, which is impossible. Therefore no number measures the numbers AB, CD. Therefore AB, CD are prime to one another."
