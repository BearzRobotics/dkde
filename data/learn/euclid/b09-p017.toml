[[step]]
text = "For, if possible, as A is to B, so let D be to E. Then, alternately, as A is to D, so is B to E. But A, D are prime, and prime numbers are least of those having the same ratio, and the least measure the others equally (VII.21, VII.20). Therefore A measures B. So (VIII.7 in reverse) A measures all the later terms, and in particular A measures D. But A, D are prime to one another, which is impossible. Therefore D is not to any other number as A is to B."
