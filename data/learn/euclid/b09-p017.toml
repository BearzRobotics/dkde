id = "IX.17"
book = 9
order = 17
title = "No continued proportion beyond prime extremes"
statement = "If there be as many numbers as we please in continued proportion, and the extremes of them be prime to one another, the last will not be to any other number as the first to the second."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let there be as many numbers as we please in continued proportion A, B, C, D (8, 12, 18, 27), and let the extremes A, D be prime to one another. I say that D is not to any other number as A is to B."
draw = [
