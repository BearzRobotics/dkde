id = "VIII.2"
book = 8
order = 2
title = "To find numbers in continued proportion"
statement = "To find numbers in continued proportion, as many as may be prescribed, and the least that are in a given ratio."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let the given ratio in least numbers be that of A to B (here 2 to 3). It is required to find four numbers in continued proportion in the ratio of A to B, and the least that are so."
