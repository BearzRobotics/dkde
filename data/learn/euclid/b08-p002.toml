[[step]]
text = "Let A by multiplying itself make C, and by multiplying B make D; let B by multiplying itself make E; again let A by multiplying C, D, E make F, G, H, and B by multiplying E make K. Since A by multiplying itself has made C and by multiplying B has made D, A is to B as C is to D (VII.17). Again, as A is to B, so is D to E (VII.18). So C, D, E are in the ratio of A to B. In the same way F, G, H, K (8, 12, 18, 27) are in that ratio. Since A, B are least, and least numbers are prime to one another (VII.22), the extremes F, K are prime to one another (VII.27). Therefore F, G, H, K are the least in continued proportion (VIII.1). Corollary: if three numbers in continued proportion are the least in their ratio, the extremes are squares; if four, cubes."
