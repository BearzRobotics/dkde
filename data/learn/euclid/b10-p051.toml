]

[[step]]
text = "Construction. Take two numbers whose sum is not a square, and proceed as for the first. Then the terms of the binomial are two rational straight lines commensurable in square only, with the stated relation to the assigned rational line and the stated excess of squares (X.29 and X.30 give the excess; X.6 and X.9 the commensurability). Then the sum is the fourth binomial straight line, as defined."
