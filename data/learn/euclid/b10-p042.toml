[[step]]
text = "For, if possible, let it also be divided at E, so that AE, EB are rational and commensurable in square only. Then the squares on AD, DB differ from the squares on AE, EB by a quantity which is a difference of two rational areas, and by twice the rectangles AE, EB and AD, DB (II.4, since both sums equal the square on AB). Since twice the rectangle AD, DB and twice the rectangle AE, EB are both medial, and the squares on each pair are rational, the difference of the rational sums would be the difference of two medial areas, a rational area; but a medial area does not exceed a medial area by a rational area (X.26). This is impossible. So a binomial is divided into its terms at one point only."
