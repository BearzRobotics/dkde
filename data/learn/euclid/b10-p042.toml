title = "A binomial is divided at one point only"
statement = "A binomial straight line is divided into its terms at one point only."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB be a binomial straight line divided into its terms at D, so that AD, DB are rational and commensurable in square only (here 2 and the square root of 3, with the whole 3.732). I say that AB is not divided at any other point into two rational straight lines commensurable in square only."
