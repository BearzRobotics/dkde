[[step]]
text = "Therefore in the parallelograms ABCD, AEGF the sides about the common angle at A are proportional. Since GF is parallel to DC, the angle AFG is equal to the angle ADC, and the angle DCB is equal to the angle FGA, and the angle at A is common. Therefore the parallelogram ABCD is equiangular with the parallelogram AEGF. Therefore ABCD is similar to AEGF. For the same reason ABCD is also similar to the parallelogram GHCK. Therefore each of AEGF, GHCK is similar to ABCD. But figures similar to the same rectilineal figure are also similar to one another (VI.21). Therefore the parallelogram AEGF is also similar to the parallelogram GHCK."
