[[step]]
text = "Since EG has been drawn parallel to BC, one of the sides of the triangle ABC, BE is to EA as CG is to GA (VI.2). Again, since GF has been drawn parallel to CD, one of the sides of the triangle ACD, CG is to GA as DF is to FA. But CG is to GA as BE is to EA. Therefore as BE is to EA, so is DF to FA. Therefore, componendo, as BA is to AE, so is DA to AF (V.18), and alternately as BA is to AD, so is EA to AF."
