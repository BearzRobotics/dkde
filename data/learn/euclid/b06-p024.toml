id = "VI.24"
book = 6
order = 24
title = "Parallelograms about the diameter"
statement = "In any parallelogram the parallelograms about the diameter are similar both to the whole and to one another."
proof = "Therefore in any parallelogram the parallelograms about the diameter are similar both to the whole and to one another. Q.E.D."

[[step]]
text = "Let ABCD be a parallelogram, and AC its diameter, and let EG, HK be parallelograms about AC. I say that each of the parallelograms EG, HK is similar to the whole ABCD and they are similar to one another."
