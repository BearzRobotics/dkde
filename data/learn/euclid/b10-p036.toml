[[step]]
text = "Since AB is incommensurable in length with BC (they are commensurable in square only), AB, BC are incommensurable, so AC is incommensurable with each of them (X.16). But then, also, the rectangle AB, BC is irrational (X.21), and the square on AC is the squares on AB, BC together with twice the rectangle AB, BC (II.4). The squares on AB, BC are rational; twice the rectangle is irrational (medial). A rational plus an irrational is irrational: for if the sum were rational, the irrational part, being the excess of a rational area over a rational one, would be rational (X.19 and its converse). So the square on AC is irrational, and AC is irrational. It is called binomial because it is made of two names, AB and BC."
