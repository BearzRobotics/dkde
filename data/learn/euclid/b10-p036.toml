title = "The binomial"
statement = "If two rational straight lines commensurable in square only be added together, the whole is irrational; and let it be called binomial."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let the two rational straight lines AB, BC commensurable in square only be added together (here 2 and the square root of 3). I say that the whole AC is irrational, and that it is called a binomial straight line (here its length is 3.732)."
