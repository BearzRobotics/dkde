  "segment C c green",
]

[[step]]
text = "Take the least numbers D, E in the ratio of A, B, C (here 2 and 3). Then A is D times D, C is E times E, and B is D times E (VIII.2); and D, E are prime to one another (VII.22). So the sum D + E is prime to each of D, E (VII.28)."
draw = [
]

[[step]]
text = "A + B is D times (D + E), and C is E times E: D and (D + E) are each prime to E, so the product of D, D + E is prime to E, and to E times E (VII.24, 25, 26). So A + B is prime to C. In the same way B + C = E times (D + E) is prime to A = D times D. And A + C, the sum of the squares of D and E, is prime to D (a common measure would measure E times E, which is prime to D) and to E, so it is prime to D times E, that is, to B (VII.24)."
