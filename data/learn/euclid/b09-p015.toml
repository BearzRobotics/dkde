id = "IX.15"
book = 9
order = 15
title = "Three least numbers in continued proportion"
statement = "If three numbers in continued proportion be the least of those which have the same ratio with them, any two whatever added together will be prime to the remaining number."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let A, B, C be three numbers in continued proportion, the least of those which have the same ratio with them (here 4, 6, 9). I say that any two of them added together are prime to the remaining one."
draw = [
  "clear",
  "point A 0 0",
  "point a 1.4 0",
  "segment A a blue",
  "point B 0 -0.9",
  "point b 2.1 -0.9",
  "segment B b red",
