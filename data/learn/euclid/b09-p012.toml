id = "IX.12"
book = 9
order = 12
title = "Prime measures of the last term"
statement = "If as many numbers as we please beginning from an unit be in continued proportion, by however many prime numbers the last is measured, by the same the next to the unit will also be measured."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let there be as many numbers as we please beginning from an unit in continued proportion A, B, C, D (here 1, 6, 36, 216), and let D be measured by some prime number E (here 2). I say that E measures B."
