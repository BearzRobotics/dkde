[[step]]
text = "For suppose E does not measure B. Then E, being prime, is prime to B (VII.29). Since E measures D, let it do so F times. Then E by multiplying F makes D. Further, B by multiplying C (the term before D) makes D, because B measures D by C (IX.11). Therefore the product of E, F equals the product of B, C. So E is to B as C is to F (VII.19). But E, B are prime to one another, so they are the least in their ratio (VII.21), and the least measure the others equally (VII.20): E measures C. Again, in the same way E measures the term before C, and so on, down to the number next the unit: so E measures B, which contradicts the supposition. Therefore E measures B."
