id = "X.59"
book = 10
order = 59
title = "The area on the sixth binomial"
statement = "If an area be contained by a rational straight line and the sixth binomial, the side of the square equal to the area is the irrational straight line which is called side of the sum of two medial areas."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let the area be contained by the rational straight line AB (here 1) and the sixth binomial AD, divided into its terms at E, AE being the greater (here AD = 3.146). I say that the side of the square equal to the area is the side of the sum of two medial areas (here 1.774)."
draw = [
  "clear",
  "point R 0 0",
  "point r 0.7 0",
  "segment R r blue",
  "point AD 0 -0.9",
  "point ad 2.202 -0.9",
  "segment AD ad red",
  "point AB 0 -1.8",
  "point ab 1.242 -1.8",
  "segment AB ab green",
]

[[step]]
text = "Bisect ED at F, and apply to AE a rectangle AG, GE equal to the square on EF and deficient by a square (VI.28). Let x be the side of the square equal to the rectangle AB, AG, and y the side of the square equal to the rectangle AB, GE. Then x squared plus y squared is the rectangle AB, AE, and twice xy is twice AB times EF, which is the rectangle AB, ED. So the square on x + y is the rectangle AB, AE plus the rectangle AB, ED, that is, the rectangle AB, AD: the side of the square equal to the area is x + y. Here x and y are incommensurable in square, the sum of their squares is medial, xy is medial and incommensurable with the sum of the squares, so x + y is the side of the sum of two medial areas (X.41). Therefore the side of the area is the side of the sum of two medial areas."
