id = "VI.31"
book = 6
order = 31
title = "Similar figures on the sides of a right triangle"
statement = "In right-angled triangles the figure on the side subtending the right angle is equal to the similar and similarly described figures on the sides containing the right angle."
proof = "Therefore in right-angled triangles the figure on the side subtending the right angle is equal to the similar and similarly described figures on the sides containing the right angle. Q.E.D."

[[step]]
text = "Let ABC be a right-angled triangle having the angle BAC right. I say that the figure on BC is equal to the similar and similarly described figures on BA, AC. (Squares are drawn here; any similar figures work.)"
