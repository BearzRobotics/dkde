[[step]]
text = "Let the perpendicular AD be drawn. Since in the right-angled triangle ABC the perpendicular AD has been drawn from the right angle at A to the base BC, the triangles ABD, ADC adjoining the perpendicular are similar to the whole ABC and to one another (VI.8). Since ABC is similar to ABD, as CB is to BA, so is BA to BD (VI.4). And since three straight lines are proportional, as the first is to the third, so is the figure on the first to the similar and similarly described figure on the second (VI.19 corollary). Therefore, as CB is to BD, so is the figure on CB to the similar and similarly described figure on BA. For the same reason, as BC is to CD, so is the figure on BC to that on CA. Hence, as BC is to BD, DC together, so is the figure on BC to the similar and similarly described figures on BA, AC together. But BC is equal to BD, DC together. Therefore the figure on BC is also equal to the similar and similarly described figures on BA, AC."
