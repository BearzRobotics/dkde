id = "VI.4"
book = 6
order = 4
title = "Equiangular triangles have proportional sides"
statement = "In equiangular triangles the sides about the equal angles are proportional, and those are corresponding sides which subtend the equal angles."
proof = "Therefore in equiangular triangles the sides about the equal angles are proportional, and those are corresponding sides which subtend the equal angles. Q.E.D."

[[step]]
text = "Let ABC, DCE be equiangular triangles having the angle ABC equal to the angle DCE, the angle BAC to the angle CDE, and the angle ACB to the angle CED. I say that in the triangles ABC, DCE the sides about the equal angles are proportional, and those are corresponding sides which subtend the equal angles."
draw = [
  "clear",
  "point A 1 3",
  "point B 0 0",
  "point C 4 0",
  "point D 5.5 4.5",
  "point E 10 0",
  "polygon A B C blue",
  "polygon D C E red",
  "segment B E black",
]

[[step]]
text = "Let BC be placed in a straight line with CE. Since the angles ABC, ACB are less than two right angles (I.17), and the angle ACB is equal to the angle DEC, the angles ABC, DEC are less than two right angles. Therefore BA, ED, when produced, will meet (postulate 5). Let them be produced and meet at F."
draw = [
  "point F 2.5 7.5",
  "line B A black",
  "line E D black",
]

[[step]]
text = "Since the angle DCE is equal to the angle ABC, BF is parallel to CD (I.28). Again, since the angle ACB is equal to the angle DEC, AC is parallel to FE. Therefore FACD is a parallelogram, so FA is equal to DC, and AC to FD (I.34). Since AC has been drawn parallel to FE, one of the sides of the triangle FBE, BA is to AF as BC is to CE (VI.2). But AF is equal to CD. Therefore BA is to CD as BC is to CE, and alternately AB is to BC as DC is to CE. Again, since CD is parallel to BF, BC is to CE as FD is to DE. But FD is equal to AC. Therefore BC is to CE as AC is to DE, and alternately BC is to CA as CE is to ED. Since it was proved that AB is to BC as DC is to CE, and BC is to CA as CE is to ED, ex aequali BA is to AC as CD is to DE (V.22)."
draw = [
  "segment A F green",
  "segment D F green",
  "polygon F A C D teal fill",
]
