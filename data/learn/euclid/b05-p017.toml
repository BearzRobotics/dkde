[[step]]
text = "Take equimultiples GH, HK, LM, MN of AE, EB, CF, FD, and other equimultiples KO, NP of EB, FD. Since GH is the same multiple of AE that HK is of EB, GH is the same multiple of AE that GK is of AB (V.1). But GH is the same multiple of AE that LM is of CF. Therefore GK is the same multiple of AB that LM is of CF. Again, since LM is the same multiple of CF that MN is of FD, LM is the same multiple of CF that LN is of CD. Therefore GK, LN are equimultiples of AB, CD."
draw = [
]

[[step]]
text = "Again, since HK is the same multiple of EB that MN is of FD, and KO is the same multiple of EB that NP is of FD, the sum HO is the same multiple of EB that MP is of FD (V.2). Since AB:BE = CD:DF, and GK, LN are equimultiples of AB, CD, and HO, MP of BE, DF, then if GK exceeds HO, LN exceeds MP; if equal, equal; if less, less. Take away HK from GK and MN from LN; then if GH exceeds KO, LM exceeds NP; and so on. Therefore AE:EB = CF:FD."
