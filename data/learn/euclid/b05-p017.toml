id = "V.17"
book = 5
order = 17
title = "Separando"
statement = "If magnitudes be proportional componendo, they will also be proportional separando."
proof = "Therefore if magnitudes be proportional componendo, they will also be proportional separando. Q.E.D. (In algebra: if (a + b) : b = (c + d) : d then a : b = c : d.)"

[[step]]
text = "Let AB, BE, CD, DF be magnitudes proportional componendo, so that AB:BE = CD:DF. I say that they will also be proportional separando, that is, AE:EB = CF:FD."
