id = "XI.34"
book = 11
order = 34
title = "Equal solids: reciprocal bases and heights"
statement = "In equal parallelepipedal solids the bases are reciprocally proportional to the heights; and those parallelepipedal solids in which the bases are reciprocally proportional to the heights are equal."
proof = "Therefore in equal parallelepipedal solids the bases are reciprocally proportional to the heights; and those parallelepipedal solids in which the bases are reciprocally proportional to the heights are equal. Q.E.D."

[[step]]
text = "Let AB, CD be equal parallelepipedal solids (here one is 3 by 2 by 4 and the other 2 by 2 by 6). I say that in the parallelepipedal solids AB, CD the bases are reciprocally proportional to the heights, that is, that as the base EH is to the base NQ, so is the height of the solid CD to the height of the solid AB."
