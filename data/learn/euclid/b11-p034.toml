[[step]]
text = "First let the edges which stand up be at right angles to their bases. I say that as the base EH is to the base NQ, so is CM to AG. If the base EH is equal to the base NQ, then, since the solid AB is equal to the solid CD, CM is equal to AG, for parallelepipedal solids of the same height are to one another as their bases (XI.32). And, as the base EH is to the base NQ, so is CM to AG. If the bases are unequal, let EH be the greater. Since the solid AB is equal to the solid CD, CM is greater than AG. Let CT be made equal to AG, and let the parallelepipedal solid VC be completed on the base NQ with the height CT. Since the solid AB is equal to the solid CD, the solid CV is another solid, and equals have to the same the same ratio, as the solid AB is to the solid CV, so is the solid CD to the solid CV. But as the solid AB is to the solid CV, so is the base EH to the base NQ, for the solids AB, CV are of the same height; and as the solid CD is to the solid CV, so is the base MQ to the base TQ and so is CM to CT. Therefore as the base EH is to the base NQ, so is CM to CT, and CT is equal to AG. Therefore, as the base EH is to the base NQ, so is CM to AG. Therefore in the parallelepipedal solids AB, CD the bases are reciprocally proportional to the heights. The converse follows by reversing the argument."
