id = "III.15"
book = 3
order = 15
title = "The diameter is the greatest chord"
statement = "Of straight lines in a circle the diameter is greatest, and of the rest the nearer to the centre is always greater than the more remote."
proof = "Therefore the diameter is greatest, and of the rest the nearer to the centre is always greater than the more remote. Q.E.D."

[[step]]
text = "Let ABCD be a circle, let AD be its diameter and E the centre, and let BC be nearer to the diameter AD, and FG more remote. I say that AD is greatest and BC greater than FG."
draw = [
