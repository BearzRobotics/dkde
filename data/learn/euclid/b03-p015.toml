  "segment E K black",
]

[[step]]
text = "From the centre E let EH, EK be drawn perpendicular to BC, FG (I.12), and let EB, EC, EF be joined. Since AE is equal to EB, and ED to EC, AD is equal to EB, EC. But EB, EC are greater than BC (I.20). Therefore AD is also greater than BC."
draw = [
  "segment E B black",
  "segment E C black",
  "segment E F black",
]

[[step]]
text = "And since BC is nearer to the centre than FG, EK is greater than EH. Now BC is double of BH and FG is double of FK, and the squares on EH, HB are equal to the squares on EK, KF, of which the square on EK is greater than the square on EH. Therefore the square on FK is less than the square on BH, so FK is less than BH, and FG is less than BC. Therefore the diameter AD is greatest, and BC is greater than FG."
