id = "III.35"
book = 3
order = 35
title = "Intersecting chords"
statement = "If in a circle two straight lines cut one another, the rectangle contained by the segments of the one is equal to the rectangle contained by the segments of the other."
proof = "Therefore if in a circle two straight lines cut one another, the rectangle contained by the segments of the one is equal to the rectangle contained by the segments of the other. Q.E.D."

[[step]]
text = "In the circle ABCD let two straight lines AC, BD cut one another at the point E. I say that the rectangle contained by AE, EC is equal to the rectangle contained by DE, EB."
draw = [
  "clear",
  "point F 0 0",
  "point A -3.464 -2",
  "point B -2.571 3.064",
  "point C 2 3.464",
