id = "X.61"
book = 10
order = 61
title = "The square on the first bimedial"
statement = "The square on the first bimedial straight line, if applied to a rational straight line, produces as breadth the second binomial."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let AB be the first bimedial straight line divided into its terms at C, and let a rational straight line DE be set out. Apply to DE the rectangle DF equal to the square on AB, producing DG as breadth. I say that DG is the second binomial. Example: (the fourth root of 2 + the fourth root of 8) squared is 4 + 3 times the square root of 2 (terms 4.243 and 4); the breadth is the sum of these terms, 8.243."
