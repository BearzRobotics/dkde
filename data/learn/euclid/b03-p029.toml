id = "III.29"
book = 3
order = 29
title = "Equal arcs have equal chords"
statement = "In equal circles equal circumferences are subtended by equal straight lines."
proof = "Therefore in equal circles equal circumferences are subtended by equal straight lines. Q.E.D."

[[step]]
text = "Let ABC, DEF be equal circles, and in them let equal circumferences BGC, EHF be cut off, and let the straight lines BC, EF be joined. I say that BC is equal to EF."
