[[step]]
text = "Let the centres of the circles be taken, and let them be K, L, and let BK, KC, EL, LF be joined. Since the circumference BGC is equal to the circumference EHF, the angle BKC is equal to the angle ELF (III.27). And since the circles ABC, DEF are equal, the radii are equal. Thus the two sides BK, KC are equal to the two sides EL, LF, and they contain equal angles. Therefore the base BC is equal to the base EF (I.4)."
