id = "IX.28"
book = 9
order = 28
title = "Odd times even"
statement = "If an odd number by multiplying an even number make some number, the product will be even."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "For let the odd number A by multiplying the even number B make C (3 by 4 is 12). I say that C is even."
draw = [
  "clear",
  "point A 0 0",
  "point a 1.05 0",
  "segment A a blue",
  "point B 0 -0.9",
  "point b 1.4 -0.9",
  "segment B b red",
  "point C 0 -1.8",
  "point c 4.2 -1.8",
  "segment C c green",
]

[[step]]
text = "Since A by multiplying B has made C, C is composed of as many numbers equal to B as there are units in A (VII definition 15). And B is even. Therefore C is composed of even numbers. But if as many even numbers as we please be added together, the whole is even (IX.21). Therefore C is even."
