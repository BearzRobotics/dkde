]

[[step]]
text = "Since there are three magnitudes G, K, M and others H, L, N equal to them in multitude, which taken two and two together are in the same ratio, then, if G exceeds M ex aequali, H exceeds N; if equal, equal; if less, less (V.20). And G, H are equimultiples of A, D, and M, N of C, F. Therefore A:C = D:F."
