[[step]]
text = "Take equimultiples G, H of A, D, and other equimultiples K, L of B, E, and still other equimultiples M, N of C, F. Since A:B = D:E, and G, H are equimultiples of A, D, and K, L of B, E, G:K = H:L (V.4). For the same reason K:M = L:N."
