id = "V.22"
book = 5
order = 22
title = "Ex aequali"
statement = "If there be any number of magnitudes, and others equal to them in multitude, which taken two and two together are in the same ratio, they will also be in the same ratio ex aequali."
proof = "Therefore if there be any number of magnitudes, and others equal to them in multitude, which taken two and two together are in the same ratio, they will also be in the same ratio ex aequali. Q.E.D."

[[step]]
text = "Let there be any number of magnitudes A, B, C, and others D, E, F equal to them in multitude, which taken two and two together are in the same ratio, so that A:B = D:E and B:C = E:F. I say that they will also be in the same ratio ex aequali, that is, A:C = D:F."
