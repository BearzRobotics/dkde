[[step]]
text = "For if the angle AGH is unequal to the angle GHD, one of them is greater. Let AGH be greater. Add the angle BGH to each. Then AGH, BGH are greater than BGH, GHD. But AGH, BGH are equal to two right angles (I.13). Therefore BGH, GHD are less than two right angles."
draw = [
  "angle B G H purple fill",
]

[[step]]
text = "But straight lines produced indefinitely from angles less than two right angles meet (postulate 5). Therefore AB, CD will meet if produced indefinitely. But they do not meet, since they are by hypothesis parallel. Therefore the angle AGH is not unequal to the angle GHD, that is, it is equal to it."
draw = [
]

[[step]]
text = "Again, the angle AGH is equal to the angle EGB (I.15). Therefore the angle EGB is equal to the angle GHD. Add the angle BGH to each. Then the angles EGB, BGH are equal to the angles BGH, GHD. But EGB, BGH are equal to two right angles (I.13). Therefore BGH, GHD are also equal to two right angles."
draw = [
  "angle E G B green fill",
]
