id = "XII.11"
book = 12
order = 11
title = "Cones and cylinders of the same height"
statement = "Cones and cylinders which are of the same height are to one another as their bases."
proof = "Therefore cones and cylinders which are of the same height are to one another as their bases. Q.E.D."

[[step]]
text = "Let there be cones and cylinders of the same height, let the circles ABCD, EFGH be their bases, KL, MN their axes and AC, EG the diameters of their bases. I say that, as the circle ABCD is to the circle EFGH, so is the cone AL to the cone EN."
