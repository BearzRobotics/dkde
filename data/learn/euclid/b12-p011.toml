[[step]]
text = "For, if not, then, as the circle ABCD is to the circle EFGH, so will the cone AL be either to some solid less than the cone EN or to a greater. Let it first be to a less, the solid O, and let the solid X be equal to that by which the solid O is less than the cone EN. Therefore the cone EN is equal to the solids O, X. Let the square EFGH be inscribed in the circle EFGH. Therefore the square is greater than the half of the circle. Let there be set up on the square EFGH a pyramid of the same height as the cone. Therefore the pyramid so set up is greater than the half of the cone, since if we circumscribe a square about the circle and set up on it a pyramid of the same height as the cone, the inscribed pyramid is half of the circumscribed. Bisect the circumferences EF, FG, GH, HE at P, Q, R, S, and join HP, PE, EQ, QF, FR, RG, GS, SH. Then each of the triangles HPE, EQF, FRG, GSH is greater than the half of the segment of the circle about it. On each of the triangles set up pyramids having the same vertex as the cone. Each of the pyramids so set up is greater than the half of the segment of the cone about it. Thus, by bisecting the circumferences that are left, joining straight lines, setting up on the triangles pyramids having the same vertex as the cone, and doing this continually, we shall leave some segments of the cone which will be less than the solid X (X.1). Let such be left. Therefore the remainder, the pyramid of which the polygon HPEQFRGS is the base and the vertex is the same as that of the cone, is greater than the solid O. Inscribe also in the circle ABCD the polygon DTAUBVCW similar and similarly situated to the polygon HPEQFRGS, and on it set up a pyramid having the same vertex as the cone AL. Since, as the square on AC is to the square on EG, so is the polygon DTAUBVCW to the polygon HPEQFRGS (XII.1), and as the square on AC is to the square on EG, so is the circle ABCD to the circle EFGH (XII.2), therefore, as the circle ABCD is to the circle EFGH, so is the polygon DTAUBVCW to the polygon HPEQFRGS. But, as the circle ABCD is to the circle EFGH, so is the cone AL to the solid O; and, as the polygon is to the polygon, so is the pyramid of which the polygon DTAUBVCW is the base and the point L the vertex to the pyramid of which the polygon HPEQFRGS is the base and the point N the vertex (XII.6). Therefore, as the cone AL is to the solid O, so is the pyramid in the cone AL to the pyramid in the cone EN. Alternately, as the cone AL is to the pyramid in it, so is the solid O to the pyramid in the cone EN. But the cone AL is greater than the pyramid in it. Therefore the solid O is also greater than the pyramid in the cone EN. But it is also less, which is impossible. Therefore, as the circle ABCD is to the circle EFGH, so is not the cone AL to any solid less than the cone EN. Similarly we can prove that neither is the circle EFGH to the circle ABCD as the cone EN is to any solid less than the cone AL. I say next that neither is the circle ABCD to the circle EFGH as the cone AL is to any solid greater than the cone EN. For, if possible, let it be so to a greater solid O. Then, inversely, as the circle EFGH is to the circle ABCD, so is the solid O to the cone AL. But, as the solid O is to the cone AL, so is the cone EN to some solid less than the cone AL. Therefore, as the circle EFGH is to the circle ABCD, so is the cone EN to some solid less than the cone AL, which was proved impossible. Therefore, as the circle ABCD is to the circle EFGH, so is the cone AL to the cone EN. But, as the cone is to the cone, so is the cylinder to the cylinder, each being triple of each (XII.10). Therefore also, as the circle ABCD is to the circle EFGH, so are the cylinders on them which are of the same height."
