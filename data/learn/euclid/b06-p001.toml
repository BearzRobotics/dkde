[[step]]
text = "Since CB, BG, GH are equal to one another, the triangles AHG, AGB, ABC are also equal to one another (I.38). Therefore, whatever multiple the base HC is of the base BC, that multiple also is the triangle AHC of the triangle ABC. For the same reason, whatever multiple the base LC is of the base CD, that multiple also is the triangle ALC of the triangle ACD."
draw = [
  "polygon A H G orange fill",
  "polygon A G B green fill",
]

[[step]]
text = "If the base HC is equal to the base CL, the triangle AHC is also equal to the triangle ACL (I.38); if the base HC exceeds the base CL, the triangle AHC exceeds the triangle ACL; and if less, less. There are four magnitudes, the two bases BC, CD and the two triangles ABC, ACD; equimultiples have been taken of the base BC and the triangle ABC, namely the base HC and the triangle AHC, and of the base CD and the triangle ADC, namely the base CL and the triangle ALC. Therefore, as the base BC is to the base CD, so is the triangle ABC to the triangle ACD (V, definition 5). Since the parallelogram is double the triangle (I.41), the parallelograms are in the same ratio as the triangles. Therefore as the base is to the base, so is the parallelogram to the parallelogram."
