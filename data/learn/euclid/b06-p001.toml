id = "VI.1"
book = 6
order = 1
title = "Triangles of the same height"
statement = "Triangles and parallelograms which are under the same height are to one another as their bases."
proof = "Therefore triangles and parallelograms which are under the same height are to one another as their bases. Q.E.D."

[[step]]
text = "Let ABC, ACD be triangles and EC, CF parallelograms under the same height. I say that, as the base BC is to the base CD, so is the triangle ABC to the triangle ACD, and the parallelogram EC to the parallelogram CF."
