id = "VI.25"
book = 6
order = 25
title = "A figure similar to one, equal to another"
statement = "To construct one and the same figure similar to a given rectilineal figure and equal to another given rectilineal figure."
proof = "Therefore there has been constructed the one and the same figure KGH, similar to ABC and equal to D. Being what it was required to do."

[[step]]
text = "Let ABC be the given rectilineal figure to which the figure to be constructed must be similar, and D that to which it must be equal. It is required to construct one and the same figure similar to ABC and equal to D."
draw = [
  "clear",
  "point A 0 0",
  "point B 4 0",
  "point C 1 3",
  "polygon A B C blue fill",
]

[[step]]
text = "Let there be applied to BC the parallelogram BE equal to the triangle ABC (I.44), and to CE the parallelogram CM equal to D in the angle FCE, which is equal to the angle CBL. Then BC is in a straight line with CF, and LE with EM. Let GH be taken a mean proportional between BC, CF (VI.13), and on GH let KGH be described similar and similarly situated to ABC (VI.18)."
draw = [
  "point P 5 3",
  "point Q 9 3",
  "segment B C black",
]

[[step]]
text = "Since BC is to GH as GH is to CF, and if three straight lines be proportional, as the first is to the third, so is the figure on the first to the similar and similarly described figure on the second (VI.19 corollary), as BC is to CF, so is the triangle ABC to the triangle KGH. But as BC is to CF, so is the parallelogram BE to the parallelogram EF (VI.1). Therefore as the triangle ABC is to KGH, so is the parallelogram BE to the parallelogram EF. Therefore, alternately, as the triangle ABC is to the parallelogram BE, so is the triangle KGH to the parallelogram EF. But the triangle ABC is equal to the parallelogram BE. Therefore the triangle KGH is also equal to the parallelogram EF. But EF is equal to D. Therefore KGH is also equal to D. And KGH is also similar to ABC."
