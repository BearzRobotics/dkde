id = "X.54"
book = 10
order = 54
title = "The area on the first binomial"
statement = "If an area be contained by a rational straight line and the first binomial, the side of the square equal to the area is the irrational straight line which is called binomial."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let the area be contained by the rational straight line AB (here 1) and the first binomial AD, divided into its terms at E, AE being the greater (here AD = 3.732). I say that the side of the square equal to the area is a binomial (here 1.932)."
draw = [
