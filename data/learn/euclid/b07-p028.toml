[[step]]
text = "For if CA, AB are not prime to one another, some number will measure CA, AB. Let D measure them. Then, since D measures CA, AB, it will also measure the remainder BC. But it also measures BA. Therefore D measures AB, BC, which are prime to one another, which is impossible. Therefore no number will measure the numbers CA, AB. Therefore CA, AB are prime to one another. For the same reason AC, CB are also prime to one another. Therefore CA is prime to each of the numbers AB, BC. Conversely, if CA, AB are prime to one another, then AB, BC are also prime to one another: for if some number D measured AB, BC, it would measure the whole CA and AB, which are prime to one another, which is impossible."
