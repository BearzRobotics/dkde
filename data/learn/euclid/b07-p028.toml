id = "VII.28"
book = 7
order = 28
title = "The sum of primes"
statement = "If two numbers be prime to one another, the sum will also be prime to each of them; and, if the sum of two numbers be prime to any one of them, the original numbers will also be prime to one another."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "For let two numbers AB, BC prime to one another be added (here 5 and 3). I say that the sum AC is also prime to each of the numbers AB, BC."
