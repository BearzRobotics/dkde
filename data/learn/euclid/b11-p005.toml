id = "XI.5"
book = 11
order = 5
title = "A line at right angles to three lines"
statement = "If a straight line be set up at right angles to three straight lines which meet, at their common point of section, the three straight lines are in one plane."
proof = "Therefore if a straight line be set up at right angles to three straight lines which meet, at their common point of section, the three straight lines are in one plane. Q.E.D."

[[step]]
text = "For let any straight line AB be set up at right angles to three straight lines BC, BD, BE at their point of meeting B. I say that BC, BD, BE are in one plane."
draw = [
