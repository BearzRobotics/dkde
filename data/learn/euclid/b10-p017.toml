id = "X.17"
book = 10
order = 17
title = "Application deficient by a square: commensurable parts"
statement = "If there be two unequal straight lines, and to the greater there be applied a parallelogram equal to the fourth part of the square on the less and deficient by a square figure, and if it divide it into parts which are commensurable in length, then the square on the greater will be greater than the square on the less by the square on a straight line commensurable with the greater. And, if the square on the greater be greater than the square on the less by the square on a straight line commensurable with the greater, and if there be applied to the greater a parallelogram equal to the fourth part of the square on the less and deficient by a square figure, it divides it into parts which are commensurable in length."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let A, BC be two unequal straight lines of which BC is the greater (here 5 and 3, so BC = 5 and A = 3). Apply to BC a parallelogram equal to the fourth part of the square on A (that is 9/4) and deficient by a square figure: this is the rectangle BD, DC with BD times DC = 9/4 and BD + DC = 5. Then BD = 4.5, DC = 0.5? (In numbers: x(5 - x) = 9/4 gives x = 4.5 or 0.5, so BD = 4.5 and DC = 0.5.) These are commensurable in length. I say that the square on BC is greater than the square on A by the square on a line commensurable with BC."
