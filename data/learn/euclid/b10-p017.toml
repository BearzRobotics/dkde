[[step]]
text = "Let BC be bisected at E. Then the rectangle BD, DC together with the square on ED is equal to the square on EC (II.5). Multiply by four: four times the rectangle plus four times the square on ED equals four times the square on EC, i.e. the square on A plus the square on 2ED equals the square on BC. So the square on BC exceeds the square on A by the square on BD less DC, that is 2ED. Since BD, DC are commensurable, BD less DC is commensurable with BC (X.15), so the line whose square is the excess is commensurable with BC. (Here 25 less 9 = 16 = 4 squared, and 4 is commensurable with 5.) The converse is proved by reversing the steps."
