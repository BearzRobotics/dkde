[[step]]
text = "Take the least number E measured by B and C (VII.34); here it is 12. As many times as B measures E, so many times let A measure F; so F is 8, and A is to B as F is to E (VII.17). As many times as C measures E, so many times let D measure G; so G is 15, and C is to D as E is to G. Therefore F, E, G (8, 12, 15) are in continued proportion in the given ratios."
draw = [
]

[[step]]
text = "They are the least. For suppose H, K, L were less and in the same ratios. Then H is to K as A is to B, and A, B are least, so A measures H and B measures K equally (VII.20); and K is to L as C to D, so C measures K and D measures L equally. Thus K is a common multiple of B and C, so E measures K (VII.35), the greater the less, which is impossible. Therefore F, E, G are the least."
