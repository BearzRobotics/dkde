id = "VIII.4"
book = 8
order = 4
title = "Several ratios in least numbers"
statement = "Given as many ratios as we please in least numbers, to find the least numbers in continued proportion which keep the given ratios."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "Let the given ratios in least numbers be that of A to B and that of C to D (here 2 to 3 and 4 to 5). It is required to find the least numbers in continued proportion in the ratios of A to B and of C to D."
