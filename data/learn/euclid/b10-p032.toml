  "segment D d orange",
]

[[step]]
text = "As in the last proposition, C, D are medial straight lines commensurable in square only containing a rational rectangle. Since A is to B as C is to D, and the square on A exceeds the square on B by the square on a line incommensurable with A, the square on C exceeds the square on D by the square on a line incommensurable with C (X.14)."
