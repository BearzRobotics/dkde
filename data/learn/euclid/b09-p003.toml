id = "IX.3"
book = 9
order = 3
title = "A cube multiplied by itself"
statement = "If a cube number by multiplying itself make some number, the product will be a cube."
proof = "Q.E.D. In the figure each number is a bar whose length is the number."

[[step]]
text = "For let the cube number A by multiplying itself make B (here A = 8 and B = 64). I say that B is a cube."
draw = [
