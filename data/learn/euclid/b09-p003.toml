  "point b 22.4 -2.7",
  "segment B b orange",
]

[[step]]
text = "Let C be the side of A (2), and let C by multiplying itself make D (4). Then C by multiplying D has made A (8). Let A by multiplying itself make B. Take the unit, and the numbers C, D, A, B... The unit, C, D, A are in continued proportion (as C is to D so D is to A, and the unit is to C as C is to D), and A by multiplying itself makes B, so the unit, C, D, A, ..., B continue the progression: B is the seventh from the unit. But the seventh from the unit is a cube (IX.8). Therefore B is a cube."
