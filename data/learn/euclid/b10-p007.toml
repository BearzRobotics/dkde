id = "X.7"
book = 10
order = 7
title = "Incommensurables are not as numbers"
statement = "Incommensurable magnitudes have not to one another the ratio which a number has to a number."
proof = "Q.E.D. (Lengths in the figure are drawn to scale with the rational line taken as 1.)"

[[step]]
text = "Let A, B be incommensurable magnitudes (a diagonal and a side of a square: 1.4142 and 1). I say that A has not to B the ratio which a number has to a number."
draw = [
  "clear",
  "point A 0 0",
  "point a 0.99 0",
  "segment A a blue",
  "point B 0 -0.9",
  "point b 0.7 -0.9",
  "segment B b red",
]

[[step]]
text = "For, if A has to B the ratio which a number has to a number, A will be commensurable with B (X.6). But it is not. Therefore A has not to B the ratio which a number has to a number."
draw = [
]
