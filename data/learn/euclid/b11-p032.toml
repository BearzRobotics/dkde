[[step]]
text = "For let FH be applied to FG, equal to AE, and in the angle FGH equal to the angle LCG (I.45), and let the parallelepipedal solid GK be completed on the base FH, with the same height as CD. Then the solid AB is equal to the solid GK, for they are on equal bases AE, FH and of the same height (XI.31). And since the parallelepipedal solid CK has been cut by the plane DG parallel to the opposite planes, as the base HF is to the base FC, so is the solid HD to the solid DC (XI.25). But the base HF is equal to the base AE, and the solid GK to the solid AB. Therefore, as the base AE is to the base CF, so is the solid AB to the solid CD."
