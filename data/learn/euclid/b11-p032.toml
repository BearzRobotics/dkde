id = "XI.32"
book = 11
order = 32
title = "Solids of the same height"
statement = "Parallelepipedal solids which are of the same height are to one another as their bases."
proof = "Therefore parallelepipedal solids which are of the same height are to one another as their bases. Q.E.D."

[[step]]
text = "Let AB, CD be parallelepipedal solids of the same height. I say that parallelepipedal solids which are of the same height are to one another as their bases, that is, that as the base AE is to the base CF, so is the solid AB to the solid CD."
