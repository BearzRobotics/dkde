id = "VII.17"
book = 7
order = 17
title = "A number multiplying two numbers"
statement = "If a number by multiplying two numbers make certain numbers, the numbers so produced will have the same ratio as the numbers multiplied."
proof = "Q.E.D. In the figure each number is a bar whose length is the number, so that \"measures\" means \"fits a whole number of times\"."

[[step]]
text = "For let a number A by multiplying two numbers B, C make D, E. I say that B is to C as D is to E. (Here 4 times 3 is 12 and 4 times 5 is 20; and 3 : 5 = 12 : 20.)"
