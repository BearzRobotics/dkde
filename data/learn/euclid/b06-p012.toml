  "segment E F red",
]

[[step]]
text = "Since GH has been drawn parallel to EF, one of the sides of the triangle DEF, then as DG is to GE, so is DH to HF (VI.2). But DG is equal to A, GE to B, and DH to C. Therefore, as A is to B, so is C to HF. Therefore to the three given straight lines A, B, C a fourth proportional HF has been found."
