id = "VI.12"
book = 6
order = 12
title = "A fourth proportional"
statement = "To three given straight lines to find a fourth proportional."
proof = "Therefore to the three given straight lines A, B, C a fourth proportional F has been found. Being what it was required to do."

[[step]]
text = "Let A, B, C be the three given straight lines. It is required to find a fourth proportional to A, B, C. Let two straight lines DE, DF be set out containing any angle EDF. On DE let DG be made equal to A, GE equal to B, and on DF let DH be made equal to C. Let GH be joined, and through E let EF be drawn parallel to it."
draw = [
  "clear",
  "point D 0 0",
  "point G 3 0",
  "point E 5 0",
