id = "VI.22"
book = 6
order = 22
title = "Proportional lines and similar figures"
statement = "If four straight lines be proportional, the rectilineal figures similar and similarly described upon them will also be proportional; and, if the rectilineal figures similar and similarly described upon them be proportional, the straight lines themselves will also be proportional."
proof = "Therefore if four straight lines be proportional, the rectilineal figures similar and similarly described upon them will also be proportional; and, if the rectilineal figures similar and similarly described upon them be proportional, the straight lines themselves will also be proportional. Q.E.D."

[[step]]
text = "Let the four straight lines AB, CD, EF, GH be proportional, so that AB is to CD as EF is to GH, and let the similar and similarly situated rectilineal figures KAB, LCD be described on AB, CD, and the similar and similarly situated rectilineal figures MF, NH on EF, GH. I say that, as KAB is to LCD, so is MF to NH."
