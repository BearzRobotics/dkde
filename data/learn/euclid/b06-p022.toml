[[step]]
text = "Take a third proportional X to AB, CD, and a third proportional O to EF, GH (VI.11). Since AB is to CD as EF is to GH, and CD is to X as GH is to O, ex aequali, as AB is to X, so is EF to O (V.22). But as AB is to X, so is KAB to LCD (VI.19, corollary), and as EF is to O, so is MF to NH. Therefore, as KAB is to LCD, so is MF to NH. Conversely, if KAB is to LCD as MF is to NH, reverse the argument: AB is to X as EF is to O, so AB is to CD as EF is to GH."
