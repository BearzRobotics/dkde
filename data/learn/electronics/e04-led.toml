id = "EL.4"
course = "Electronics"
book = 1
order = 4
title = "Choosing an LED resistor"
statement = "A series resistor sets the LED current: R = (supply - LED drop) / current."

[[step]]
text = "Idea: an LED holds a nearly fixed forward voltage (about 2 V red, 3.2 V blue or white) and passes whatever current the circuit allows, so a resistor must set it. The resistor drops the leftover voltage."
calc = ["5 - 2"]

[[step]]
text = "Red LED, 5 V supply, 20 mA wanted: R = (5 - 2) / 0.02 = 150 ohms."
calc = ["(5 - 2) / 0.02"]

[[step]]
text = "Pick the nearest standard value. At 3.3 V the exact answer is 65 ohms; the nearest E12 value is 68 ohms, which gives I = 1.3 / 68 = 19.1 mA. Round up for safety rather than down."
calc = ["(3.3 - 2) / 0.02", "(3.3 - 2) / 68 * 1000"]

[[step]]
text = "Blue LED on 5 V: (5 - 3.2) / 0.02 = 90 ohms. A 100 ohm resistor gives 18 mA, still bright. Most indicator LEDs are bright at 2 to 5 mA, so a 1 k resistor is a common quiet choice."
calc = ["(5 - 3.2) / 0.02", "(5 - 3.2) / 100 * 1000", "(5 - 2) / 1000 * 1000"]

[[step]]
text = "Power in the resistor: V x I = 3 x 0.02 = 0.06 W, so a 1/4 W part is fine. The supply sends 5 x 0.02 = 0.1 W in total; 60% of it is the resistor's heat, the cost of a simple limiter."
calc = ["3 * 0.02", "5 * 0.02", "0.06 / 0.1"]

[[step]]
text = "Several LEDs in series share one current: three red LEDs (2 V each) on 12 V need R = (12 - 6) / 0.02 = 300 ohms. That wastes less than three separate resistors."
calc = ["(12 - 3*2) / 0.02"]

[[exercise]]
prompt = "Resistor (ohms) for a 2 V LED at 10 mA on a 9 V supply?"
answer = "(9 - 2) / 0.01"
hint = "Drop over current."

[[exercise]]
prompt = "LED current (mA) with a 330 ohm resistor on 5 V and a 2 V LED?"
answer = "(5 - 2) / 330 * 1000"
hint = "Remaining volts over the resistor."
