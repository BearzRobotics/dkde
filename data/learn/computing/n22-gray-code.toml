id = "N.22"
course = "Computing"
book = 5
order = 2
title = "Gray code"
statement = "A Gray code counts so that neighbouring numbers differ in exactly one bit; n xor (n shifted right one place) gives it."

[[step]]
text = "Idea: in ordinary binary, 3 (011) to 4 (100) flips three bits at once. Sensors reading the change can glitch. A Gray code changes one bit per step."
calc = ["3 to binary", "4 to binary"]

[[step]]
text = "The formula: gray(n) = n xor (n shifted right by one). For 5 (101): 101 xor 010 = 111, which is 7."
calc = ["5 xor shift(5,-1)"]

[[step]]
text = "Count 0 to 7 and you get 0, 1, 3, 2, 6, 7, 5, 4: each step differs from the last in one bit."
calc = ["3 xor shift(3,-1)", "2 xor shift(2,-1)", "4 xor shift(4,-1)"]

[[exercise]]
prompt = "What is the Gray code of 6, as a number?"
answer = "6 xor shift(6,-1)"
hint = "110 xor 011."

[[exercise]]
prompt = "What is the Gray code of 9, as a number?"
answer = "9 xor shift(9,-1)"
hint = "1001 xor 0100."
