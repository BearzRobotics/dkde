id = "N.4"
course = "Computing"
book = 1
order = 4
title = "Hexadecimal"
statement = "Base 16 has sixteen digits, 0 to 9 then A to F; one hex digit is exactly four bits."

[[step]]
text = "Idea: A=10, B=11, C=12, D=13, E=14, F=15. The places are 1, 16, 256, 4096. So 0xFF is 15x16 + 15 = 255."
calc = ["0xFF", "15*16 + 15"]

[[step]]
text = "Write 0x in front of hex digits. 0x1A3 is 1x256 + 10x16 + 3 = 419."
calc = ["0x1A3", "1*256 + 10*16 + 3"]

[[step]]
text = "Going the other way, ask the calculator: 255 to hex, 419 to hex. Or divide by 16 and read the remainders upward, just as for binary."
calc = ["255 to hex", "419 to hex", "419 mod 16"]

[[step]]
text = "Hex mode: this step switched the calculator to Programmer mode in Hex, 32 bits. Now bare hex digits are numbers: FF + 1 is 100, and 1A3 * 2 is 346. The Dec, Oct and Bin buttons show the same value in other bases."
calc = ["FF + 1", "1A3 * 2", "FF and F0"]
mode = "programmer"
base = 16
bits = 32

[[exercise]]
prompt = "What is 0x2F in decimal?"
answer = "0x2F"
hint = "2x16 + 15."

[[exercise]]
prompt = "Write 200 in hex, with 0x in front. (200 = 12 x 16 + 8.)"
answer = "0xC8"
hint = "12 is C."

[[exercise]]
prompt = "Write 255 in hex, with 0x in front."
answer = "0xFF"
hint = "The biggest byte."
