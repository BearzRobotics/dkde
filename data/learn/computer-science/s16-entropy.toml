id = "CS.16"
course = "Computer Science"
book = 3
order = 2
title = "Information and entropy"
statement = "The information in an outcome of probability p is log2(1/p) bits; entropy is the average, and it is the least number of bits per symbol any code can use."

[[step]]
text = "Idea: a fair coin flip is one bit. One of 8 equally likely outcomes takes log2(8) = 3 bits to name. One of 26 letters takes log2(26) = 4.70 bits, so 5 whole bits in practice."
calc = ["log2(2)", "log2(8)", "log2(26)", "ceil(log2(26))"]

[[step]]
text = "Surprising events carry more information. An event of probability 1/8 gives log2(8) = 3 bits; one of probability 1/2 gives 1 bit. Information = -log2(p)."
calc = ["-log2(1/8)", "-log2(1/2)"]

[[step]]
text = "Entropy is the average over all outcomes: H = -(sum of p log2 p). A coin that lands heads 90 percent of the time is less surprising: H = 0.469 bits, less than the fair coin's 1."
calc = ["-(0.9*log2(0.9) + 0.1*log2(0.1))", "-(0.5*log2(0.5) + 0.5*log2(0.5))"]

[[step]]
text = "For letters with probabilities 1/2, 1/4, 1/8, 1/8: H = 0.5x1 + 0.25x2 + 0.125x3 + 0.125x3 = 1.75 bits. A fixed 2-bit code wastes a quarter of a bit per letter."
calc = ["-(0.5*log2(0.5) + 0.25*log2(0.25) + 2*0.125*log2(0.125))"]

[[step]]
text = "Entropy is the floor: no lossless compression can beat it on average. Random data has maximum entropy, which is why it cannot be compressed."

[[exercise]]
prompt = "How many bits name one of 8 equally likely outcomes? (log2(8))"
answer = "log2(8)"
hint = "2^3 = 8."

[[exercise]]
prompt = "At least how many whole bits are needed to give each of 26 letters its own code? (ceil(log2(26)))"
answer = "ceil(log2(26))"
hint = "2^5 = 32."
