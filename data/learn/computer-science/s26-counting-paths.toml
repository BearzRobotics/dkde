id = "CS.26"
course = "Computer Science"
book = 4
order = 6
title = "Counting paths and dynamic programming"
statement = "Dynamic programming solves a big problem by combining stored answers to smaller ones; many counts reduce to binomial coefficients."

[[step]]
text = "Idea: on a grid, a robot moves only right or down. The number of routes to a square is the routes to the square above plus the routes to the square to its left. The first row and column all have 1 route."
calc = ["1 + 1", "3 + 3"]

[[step]]
text = "Filling the table gives rows 1, 1, 1; 1, 2, 3; 1, 3, 6; 1, 4, 10, which are Pascal's triangle read sideways. The number of routes across an m by n grid is nCr(m + n, n), because a route is a choice of which n of the m + n moves go down."
calc = ["nCr(2+2,2)", "nCr(3+3,3)", "nCr(5+5,5)"]

[[step]]
text = "A 5 by 5 grid has nCr(10, 5) = 252 routes. Trying them all would be slow for large grids, but the table needs only m x n additions."
calc = ["nCr(10,5)", "5*5"]

[[step]]
text = "Memoisation: store each answer the first time you compute it. Fibonacci with a table takes about 30 steps for n = 30, instead of 2692537 calls."
calc = ["2*fibonacci(31) - 1", "fibonacci(30)"]

[[step]]
text = "Counting subsets: a set of n items has 2^n subsets, so brute-force subset-sum on 40 items is about 10^12 cases. A table of reachable sums (a dynamic programme) needs only n x target steps."
calc = ["2^40", "40*1000"]

[[exercise]]
prompt = "How many routes cross a 5 by 5 grid moving only right or down? (nCr(10, 5))"
answer = "nCr(10,5)"
hint = "Choose which 5 of the 10 moves go down."

[[exercise]]
prompt = "How many subsets does a set of 40 items have? (2^40)"
answer = "2^40"
hint = "In or out for each item."
