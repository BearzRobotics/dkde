id = "CS.47"
course = "Computer Science"
book = 10
order = 2
title = "How many strings does a pattern match? Password strength"
statement = "A pattern matches (alphabet size)^(length) strings; the log2 of that is the strength in bits, and brute-force time is the count divided by guesses per second."

[[step]]
text = "Idea: the pattern [0-9]{3}-[0-9]{4} (a phone-like number) matches 10^3 x 10^4 = 10^7 strings. Each position multiplies the count by its choices."
calc = ["10^3 * 10^4", "10^7"]

[[step]]
text = "Strength in bits is log2 of the number of equally likely possibilities. A random 8-character password drawn from 94 printable characters has 94^8 possibilities, 52.4 bits."
calc = ["94^8", "8*log2(94)"]

[[step]]
text = "Four random words from a list of 7776 (diceware) give 7776^4 possibilities, 51.7 bits: nearly the same strength as the 8 random characters, and far easier to remember."
calc = ["7776^4", "4*log2(7776)"]

[[step]]
text = "Brute-force time: an offline attack at 10^10 guesses a second exhausts the 94^8 space in about 7 days. Each extra random character multiplies the work by 94: ten characters take about 170 years."
calc = ["94^8 / 10^10 / 86400", "94^10 / 10^10 / (86400*365.25)"]

[[step]]
text = "Human-chosen passwords are far weaker than their length suggests because they follow patterns (a word plus digits). Defences: length, random generation, and slow hashes (bcrypt, scrypt, Argon2) that make each guess cost milliseconds instead of nanoseconds."

[[exercise]]
prompt = "How many strings match [0-9]{3}-[0-9]{4}? (10^3 x 10^4)"
answer = "10^3 * 10^4"
hint = "Multiply the choices for each position."

[[exercise]]
prompt = "How many bits is a random 8-character password from 94 characters? (8 x log2(94))"
answer = "8*log2(94)"
hint = "Strength is length times log2 of the alphabet."
