id = "CS.35"
course = "Computer Science"
book = 7
order = 2
title = "Alignment and padding"
statement = "CPUs want each value at an address divisible by its size; the compiler adds padding bytes to make that so, and the size of a struct is rounded up too."

[[step]]
text = "Idea: a 4-byte int should sit at an address divisible by 4. Rounding an address x up to a multiple of a: ceil(x/a) x a. 9 rounded to 4 is 12."
calc = ["ceil(9/4)*4", "ceil(13/8)*8"]

[[step]]
text = "For a power of two a there is a bit trick: (x + a - 1) and not(a - 1). It adds almost a, then clears the low bits. With x = 9 and a = 4: (9 + 3) and not(3) = 12."
calc = ["(9 + 3) and not(3)", "not(3)", "(13 + 7) and not(7)"]

[[step]]
text = "A struct { char a; int b; char c; } puts a at offset 0, then pads 3 bytes so b is at 4, then c at offset 8; the whole struct is then padded to a multiple of 4: 12 bytes, not the 6 you might expect."
calc = ["ceil(1/4)*4", "4 + 4", "ceil(9/4)*4"]

[[step]]
text = "Reorder the fields and you may save space: { int b; char a; char c; } is b at 0, a at 4, c at 5, padded to 8. Same data in 8 bytes instead of 12, a third less."
calc = ["ceil(6/4)*4", "1 - 8/12"]

[[step]]
text = "Misaligned access is slow on some CPUs and a crash on others, and an access that straddles a cache line or page costs two fetches."

[[exercise]]
prompt = "Round 13 up to a multiple of 8. (ceil(13/8) x 8)"
answer = "ceil(13/8)*8"
hint = "8 x 2."

[[exercise]]
prompt = "How big is struct { char a; int b; char c; } with 4-byte alignment? (ceil(9/4) x 4)"
answer = "ceil(9/4)*4"
hint = "Last field ends at 9."
