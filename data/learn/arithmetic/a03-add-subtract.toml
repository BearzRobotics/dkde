id = "A.3"
course = "Arithmetic"
book = 1
order = 3
title = "Adding and subtracting whole numbers"
statement = "Line the digits up by place value and work from the right, carrying or borrowing as you go."

[[step]]
text = "Idea: units add to units, tens to tens, hundreds to hundreds. When a column adds to ten or more, carry the extra ten to the next column."
calc = ["347 + 285"]

[[step]]
text = "By hand: 7 + 5 = 12, write 2, carry 1. 4 + 8 + 1 = 13, write 3, carry 1. 3 + 2 + 1 = 6. So 347 + 285 = 632."
work = ["347 + 285"]

[[step]]
text = "Subtraction goes the same way, borrowing a ten when the top digit is smaller. 52 - 37: borrow to make 12 - 7 = 5, then 4 - 3 = 1, giving 15."
calc = ["52 - 37"]
work = ["52 - 37"]

[[exercise]]
prompt = "Work out 468 + 395."
answer = "468 + 395"
hint = "8 + 5 = 13, carry the 1."

[[exercise]]
prompt = "Work out 1000 - 387."
answer = "1000 - 387"
hint = "Borrow across the zeros."
