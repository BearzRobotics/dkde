id = "DE.8"
course = "Differential Equations"
book = 3
order = 8
title = "Euler's method"
statement = "When no formula exists, step along the slope: y_new = y + h f(x, y). The smaller the step, the smaller the error."

[[step]]
text = "Idea: from the point (x, y) the equation tells you the slope f(x, y). Walk a short step h in that direction: y_new = y + h x f. Repeat. Try y' = y with y(0) = 1, whose true answer is e^x."
calc = ["1 + 0.1 * 1"]

[[step]]
text = "With h = 0.1 each step multiplies by 1.1: 1, 1.1, 1.21, 1.331, ... After 10 steps (x = 1) the value is 1.1^10 = 2.5937."
calc = ["1.1^2", "1.1^3", "1.1^10"]

[[step]]
text = "The true value is e = 2.71828, so the error is 0.1246, a 4.6% shortfall. Euler's method under-estimates here because the curve bends upward and each step uses the slope from the start."
calc = ["e - 1.1^10", "(e - 1.1^10) / e * 100"]

[[step]]
text = "A smaller step helps. h = 0.01 (100 steps) gives 1.01^100 = 2.7048, error 0.0135. h = 0.001 (1000 steps) gives 2.7169, error 0.00136."
calc = ["1.01^100", "e - 1.01^100", "1.001^1000", "e - 1.001^1000"]

[[step]]
text = "Each tenfold reduction in the step cuts the error about tenfold: the error is proportional to h, so Euler's method is called first order. To get 6 correct digits you would need about a million steps. Better methods follow in the next lesson."
calc = ["(e - 1.1^10) / (e - 1.01^100)", "(e - 1.01^100) / (e - 1.001^1000)"]

[[step]]
text = "When it is still useful: for equations no formula can solve, such as y' = x^2 + y^2, a computer simply steps. You can use it on a spreadsheet: one row per step, with y_new = y + h f."
calc = ["0 + 0.1 * (0^2 + 0^2)", "0 + 0.1 * (0.1^2 + 0^2)"]

[[exercise]]
prompt = "One Euler step of y' = 2y from y = 3 with h = 0.1?"
answer = "3 + 0.1 * 2 * 3"
hint = "y + h f."

[[exercise]]
prompt = "Euler value after 5 steps of h = 0.2 for y' = y, y(0) = 1?"
answer = "1.2^5"
hint = "Multiply by 1.2 each step."
