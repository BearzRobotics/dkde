id = "LA.4"
course = "Linear Algebra"
book = 1
order = 4
title = "Determinant and inverse"
statement = "The determinant measures how a matrix scales area; a matrix with determinant zero has no inverse."

[[step]]
text = "Idea: for [[1,2],[3,4]] the determinant is 1x4 - 2x3 = -2."
calc = ["det([[1,2],[3,4]])"]

[[step]]
text = "The inverse undoes the matrix: A times its inverse is the identity."
calc = ["inv([[1,2],[3,4]])", "[[1,2],[3,4]]*inv([[1,2],[3,4]])"]

[[step]]
text = "To solve A x = b, compute inv(A) times b. For 2x + y = 3, x + y = 2 the solution is x = 1, y = 1."
calc = ["inv([[2,1],[1,1]])*[[3],[2]]"]

[[exercise]]
prompt = "What is the determinant of [[3,5],[2,4]]?"
answer = "det([[3,5],[2,4]])"

[[exercise]]
prompt = "What is the trace (sum of the diagonal) of [[1,2],[3,4]]?"
answer = "trace([[1,2],[3,4]])"
