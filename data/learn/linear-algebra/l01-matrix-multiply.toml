id = "LA.1"
course = "Linear Algebra"
book = 1
order = 1
title = "Multiplying a matrix by a vector"
statement = "Each entry of the answer is a row of the matrix multiplied entry by entry with the vector, then added."
proof = "Row times column: multiply matching entries and add them up."

[[step]]
text = "Idea: for the matrix with rows (1, 2) and (3, 4) and the vector (5, 6), the first answer entry is 1*5 + 2*6 = 17, the second is 3*5 + 4*6 = 39."
calc = ["1*5 + 2*6", "3*5 + 4*6"]

[[exercise]]
prompt = "With rows (2, 1) and (0, 3), and vector (4, 5), what is the first entry of the answer?"
answer = "2*4 + 1*5"
hint = "First row times the vector."
