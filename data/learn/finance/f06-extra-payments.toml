id = "FIN.6"
course = "Finance"
book = 2
order = 6
title = "Paying a loan off early"
statement = "Extra payments go entirely to principal, so they shorten the loan and cut the interest far more than their size suggests."

[[step]]
text = "Idea: the 250000, 5%, 30-year loan has a payment of 1342.05. Pay 200 extra each month, 1542.05 in all. The loan ends sooner: nper(0.05/12, -1542.05, 250000) / 12 = 22.6 years."
calc = ["nper(0.05/12, -1542.05, 250000)", "nper(0.05/12, -1542.05, 250000) / 12"]

[[step]]
text = "That is 7.4 years earlier. Total paid falls from 1342.05 x 360 = 483139 to 1542.05 x 271 months, which is about 417,400."
calc = ["1542.05 * nper(0.05/12, -1542.05, 250000)", "1342.05 * 360"]

[[step]]
text = "Interest saved is 483139 - 417,400 = about 65,700, for 200 x 271 = 54,200 of extra payments. Each extra dollar early on saves more than a dollar in interest."
calc = ["483139 - 1542.05 * nper(0.05/12, -1542.05, 250000)", "200 * nper(0.05/12, -1542.05, 250000)"]

[[step]]
text = "Why: an extra payment cuts the principal at once, and the interest on that amount never accrues again. An extra 10000 paid at the start removes a debt that would have grown, at 5% compounding monthly, to 10000 x (1 + 0.05/12)^360 = 44,677 by the end of the loan."
calc = ["10000 * (1 + 0.05/12)^360", "10000 * (1 + 0.05/12)^360 - 10000"]

[[step]]
text = "Compare with investing: paying down a 5% loan is a guaranteed 5% return. If you could safely earn 7% elsewhere, investing wins on paper; at a loan rate above the return, repay first."
calc = ["1.07^20", "1.05^20"]

[[step]]
text = "Credit cards are the case for paying early: 5000 at 18% with a 300 payment takes nper(0.18/12, -300, 5000) = 19.3 months. Never pay only the minimum, which can take decades."
calc = ["nper(0.18/12, -300, 5000)", "5000 * 0.18/12"]

[[exercise]]
prompt = "Months to repay 8000 at 12% a year with 400 a month?"
answer = "nper(0.12/12, -400, 8000)"
hint = "nper(rate, payment, principal)."

[[exercise]]
prompt = "First-month interest on a card balance of 3000 at 20%?"
answer = "3000 * 0.20 / 12"
hint = "Balance x monthly rate."
