id = "FIN.8"
course = "Finance"
book = 3
order = 8
title = "Growth rates: CAGR and returns"
statement = "The compound annual growth rate is (end / start)^(1/years) - 1; percent changes multiply, they do not add."

[[step]]
text = "Idea: an investment grows from 1000 to 2500 in 10 years. That is 150% in total, but the yearly rate is the CAGR = (2500 / 1000)^(1/10) - 1 = 9.6%."
calc = ["(2500/1000)^(1/10) - 1", "((2500/1000)^(1/10) - 1) * 100"]

[[step]]
text = "Check: 1000 x 1.0960^10 = 2500. The CAGR is the single constant rate that gives the same endpoint."
calc = ["1000 * 1.0959582^10"]

[[step]]
text = "Percent changes multiply. Up 20% then down 20% does not return to the start: 1.2 x 0.8 = 0.96, a 4% loss."
calc = ["1.2 * 0.8", "(1.2 * 0.8 - 1) * 100"]

[[step]]
text = "Losses are harder to recover from. After falling 50% you need a gain of 100% to get back, since 1 / 0.5 = 2. After a 20% fall you need 25%."
calc = ["1/0.5 - 1", "1/0.8 - 1"]

[[step]]
text = "The average of yearly returns overstates growth. Returns of +50% and -50% average 0%, but 1.5 x 0.5 = 0.75 leaves 25% less. The geometric mean sqrt(0.75) - 1 = -13.4% a year is what you actually got."
calc = ["(50 + (-50))/2", "1.5 * 0.5", "sqrt(1.5 * 0.5) - 1"]

[[step]]
text = "Years to reach a goal: t = ln(goal / start) / ln(1 + r). To triple money at 8% takes ln 3 / ln 1.08 = 14.3 years."
calc = ["ln(3) / ln(1.08)"]

[[exercise]]
prompt = "CAGR (%) of a stock going from 50 to 80 in 5 years?"
answer = "((80/50)^(1/5) - 1) * 100"
hint = "(end/start)^(1/years) - 1."

[[exercise]]
prompt = "Gain needed to recover from a 30% loss (%)?"
answer = "(1/0.7 - 1) * 100"
hint = "1 / 0.7 - 1."
