id = "ST.5"
course = "Statistics"
book = 2
order = 5
title = "The binomial distribution"
statement = "Counting successes in n independent tries, each with probability p: P(k) = C(n,k) p^k (1-p)^(n-k)."

[[step]]
text = "Idea: flip a fair coin 10 times. The chance of exactly 3 heads is C(10,3) x 0.5^3 x 0.5^7: there are 120 ways to choose which 3 flips, each with probability (1/2)^10."
calc = ["nCr(10,3)", "0.5^10", "nCr(10,3) * 0.5^10"]

[[step]]
text = "The calculator has it built in: binomdist(k, n, p, 0) is the exact count, with 1 as the last argument it is the cumulative chance of k or fewer."
calc = ["binomdist(3,10,0.5,0)", "binomdist(3,10,0.5,1)"]

[[step]]
text = "At least 4 heads is 1 minus the chance of 3 or fewer: 1 - 0.1719 = 0.828."
calc = ["1 - binomdist(3,10,0.5,1)"]

[[step]]
text = "The mean number of successes is n x p = 5 and the standard deviation is sqrt(n p (1 - p)) = 1.58. Most outcomes land within two of those: 2 to 8 heads."
calc = ["10*0.5", "sqrt(10*0.5*0.5)", "5 - 2*1.58", "5 + 2*1.58"]

[[step]]
text = "Practical case: a disk fails in a year with probability 3%. In a 20-disk array the chance at least one fails is 1 - 0.97^20 = 45.6%."
calc = ["1 - 0.97^20", "1 - binomdist(0,20,0.03,0)"]

[[step]]
text = "For large n the binomial looks like a normal curve with the same mean and standard deviation. For 100 flips (mean 50, sd 5) the chance of 45 to 55 heads is 72.9% exactly and 72.9% by the normal curve."
calc = ["binomdist(55,100,0.5,1) - binomdist(44,100,0.5,1)", "normdist(55.5,50,5,1) - normdist(44.5,50,5,1)"]

[[exercise]]
prompt = "Probability of exactly 2 sixes in 5 rolls of a die? (nCr(5,2) x (1/6)^2 x (5/6)^3)"
answer = "nCr(5,2)*(1/6)^2*(5/6)^3"
hint = "10 ways."

[[exercise]]
prompt = "Mean number of heads in 40 fair flips?"
answer = "40*0.5"
hint = "n x p."
