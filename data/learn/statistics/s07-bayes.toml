id = "ST.7"
course = "Statistics"
book = 2
order = 7
title = "Conditional probability and Bayes' theorem"
statement = "Bayes' theorem updates a probability after evidence: P(A|B) = P(B|A) P(A) / P(B)."

[[step]]
text = "Idea: a disease affects 1% of people. A test catches 90% of cases (sensitivity) and wrongly flags 5% of healthy people (false positives). You test positive: how likely are you ill?"
calc = ["0.01", "0.9", "0.05"]

[[step]]
text = "Count a population of 10000. Ill: 100, of whom 90 test positive. Healthy: 9900, of whom 5% = 495 test positive. Positives in total: 585."
calc = ["10000 * 0.01", "100 * 0.9", "9900 * 0.05", "90 + 495"]

[[step]]
text = "So of the 585 who test positive only 90 are ill: 90 / 585 = 15.4%. The test sounds good, but the disease is rare, so most positives are false alarms."
calc = ["90 / 585"]

[[step]]
text = "The same in Bayes' form: P(ill | +) = 0.9 x 0.01 / (0.9 x 0.01 + 0.05 x 0.99). The denominator is the total chance of testing positive."
calc = ["0.9*0.01 / (0.9*0.01 + 0.05*0.99)", "0.9*0.01 + 0.05*0.99"]

[[step]]
text = "A second independent positive test uses 15.4% as the new prior: 0.9 x 0.154 / (0.9 x 0.154 + 0.05 x 0.846) = 76.6%. Evidence accumulates."
calc = ["0.9*0.1538 / (0.9*0.1538 + 0.05*(1-0.1538))"]

[[step]]
text = "The same arithmetic runs spam filters (how likely is spam given this word), intrusion alerts (how likely a real attack given an alarm) and fault diagnosis. Always ask for the base rate."
calc = ["0.95*0.02 / (0.95*0.02 + 0.01*0.98)"]

[[exercise]]
prompt = "Base rate 2%, sensitivity 95%, false-positive rate 1%: chance of the condition given a positive?"
answer = "0.95*0.02/(0.95*0.02 + 0.01*0.98)"
hint = "Numerator over total positives."

[[exercise]]
prompt = "How many false positives among 5000 healthy people at a 4% false-positive rate?"
answer = "5000*0.04"
hint = "Multiply."
