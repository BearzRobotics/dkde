id = "ST.11"
course = "Statistics"
book = 4
order = 11
title = "Correlation"
statement = "The correlation coefficient r runs from -1 to 1 and measures how well two variables move along a straight line together."

[[step]]
text = "Idea: pairs (x, y): (1,2) (2,4) (3,5) (4,4) (5,5). Covariance averages the product of the two deviations. Means: x 3, y 4. Covariance = 1.2."
calc = ["mean([1,2,3,4,5])", "mean([2,4,5,4,5])", "covar([1,2,3,4,5],[2,4,5,4,5])"]

[[step]]
text = "Covariance depends on the units, so divide by both standard deviations: r = cov / (sx x sy). Here sx = sqrt(2), sy = sqrt(1.2)."
calc = ["stdevp([1,2,3,4,5])", "stdevp([2,4,5,4,5])", "1.2 / (stdevp([1,2,3,4,5]) * stdevp([2,4,5,4,5]))"]

[[step]]
text = "The calculator does it in one go: r = 0.7746, a fairly strong positive link. r = 1 is a perfect rising line, -1 a perfect falling one, 0 none."
calc = ["pearson([1,2,3,4,5],[2,4,5,4,5])", "pearson([1,2,3],[3,2,1])"]

[[step]]
text = "r squared is the share of the variation in y explained by x: 0.7746^2 = 0.6, so 60%. The other 40% is something else."
calc = ["0.7746^2", "pearson([1,2,3,4,5],[2,4,5,4,5])^2"]

[[step]]
text = "Two warnings. Correlation is not causation: ice cream sales and drownings rise together because of summer. And r only sees straight-line links: y = x^2 over symmetric x has r = 0 yet is perfectly dependent."
calc = ["pearson([-2,-1,0,1,2],[4,1,0,1,4])"]

[[exercise]]
prompt = "Correlation of x = 1, 2, 3 and y = 2, 4, 6?"
answer = "pearson([1,2,3],[2,4,6])"
hint = "A perfect line."

[[exercise]]
prompt = "What share of variation does r = 0.9 explain? (r^2)"
answer = "0.9^2"
hint = "Square it."
